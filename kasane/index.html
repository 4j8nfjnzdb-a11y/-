<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Kasane 重ね</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Murecho:wght@400;500;700&family=M+PLUS+1+Code:wght@400;500&family=Zen+Kurenaido&display=swap">
<style>
/* Layout: a workbench. The sheet being worked on lies on a cutting mat in the middle; what can be laid on it
   is on the left, what the selected sheet is made of is on the right, and time runs along the bottom.
   On a phone the mat stays on top and the three panels take turns underneath.
   Deliberately single-theme dark: moving pictures are judged against a dark surround. */
:root{
  --bg:#0f1412; --panel:#151b18; --raise:#1c2420; --well:#0a0e0c; --ink:#e8ece6; --dim:#9aa69f; --faint:#5f6b65;
  --line:rgba(214,232,222,.10); --line2:rgba(214,232,222,.18);
  --tape:#e9c84a; --tape-ink:#1b1705; --blade:#6fd0c5; --rec:#ff5a4f; --paper:#f1ecdf; --tie:#c9a2f2;
  --f-ui:"Murecho","Hiragino Sans","Yu Gothic UI","Noto Sans JP","Noto Sans CJK JP","IPAPGothic",system-ui,sans-serif;
  --f-num:"M PLUS 1 Code",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-brand:"Zen Kurenaido","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:12.5px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--blade);outline-offset:1px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:grid;grid-template-columns:204px minmax(0,1fr) 336px;grid-template-rows:auto minmax(0,1fr) var(--tlh,40%);
  grid-template-areas:"top top top" "left stage insp" "tl tl insp";
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel)}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding-block:6px;border-bottom:1px solid var(--line);min-width:0}
.left{grid-area:left;border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;min-height:0}
.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--well);min-height:0;min-width:0}
.insp{grid-area:insp;border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;min-height:0;padding-bottom:40px}
.tl{grid-area:tl;border-top:1px solid var(--line2);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:none}

/* ---- top bar */
.brand{display:flex;align-items:baseline;gap:6px;padding:1px 9px 2px;background:var(--tape);color:var(--tape-ink);border-radius:2px;transform:rotate(-1.5deg);flex:none;
  box-shadow:0 1px 0 rgba(0,0,0,.35);clip-path:polygon(0 8%,3% 0,97% 3%,100% 12%,99% 92%,96% 100%,4% 97%,0 88%)}
.brand b{font-family:var(--f-brand);font-size:17px;font-weight:400;letter-spacing:.06em}
.brand span{font-family:var(--f-num);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.menus{display:flex;gap:2px;flex:none}
.tb{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 9px;border-radius:5px;color:var(--ink);white-space:nowrap}
.tb:hover,.ib:hover{background:var(--raise)}
.ib{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:5px;color:var(--dim);flex:none}
.ib[aria-pressed="true"]{color:var(--tape);background:rgba(233,200,74,.12)}
.ib.rec[aria-pressed="true"]{color:var(--rec);background:rgba(255,90,79,.14)}
.tools{display:flex;gap:1px;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none;flex:1}
.tools::-webkit-scrollbar{display:none}
.tool{display:inline-grid;place-items:center;width:30px;height:28px;border-radius:5px;color:var(--dim);flex:none}
.tool:hover{background:var(--raise);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tool.lab{color:var(--tape)}
.tool.lab[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink)}
.tsep{width:1px;height:18px;background:var(--line2);margin:0 5px;flex:none}
.acts{display:flex;gap:2px;align-items:center;flex:none;margin-left:auto}
.btn{height:28px;padding:0 12px;border-radius:5px;border:1px solid var(--line2);background:var(--raise);white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--paper);color:#14110a;border-color:var(--paper);font-weight:700}
.btn.small{height:24px;padding:0 8px;font-size:11.5px}

/* ---- left: what can be laid on the sheet */
.lsec{padding:8px 10px 10px;border-bottom:1px solid var(--line)}
.lsec h3,.sec h3{margin:0 0 6px;font-size:10.500px;font-weight:500;letter-spacing:.14em;color:var(--dim);display:flex;align-items:center;gap:6px}
.lsec h3 .ib,.sec h3 .ib{margin-left:auto;width:22px;height:22px}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.lbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;border-radius:5px;background:var(--raise);color:var(--ink);font-size:10.5px;line-height:1.2}
.lbtn:hover{background:#243029}
.asset{display:grid;grid-template-columns:48px minmax(0,1fr) 24px;gap:7px;align-items:center;padding:3px;border-radius:5px}
.asset:hover{background:var(--raise)}
.asset .th{width:48px;height:27px;border-radius:3px;background:var(--well) center/cover no-repeat;display:grid;place-items:center;color:var(--faint)}
.asset b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset small{display:block;color:var(--faint);font:10px var(--f-num)}
.asset.off b{color:var(--faint)}
.compi{display:flex;align-items:center;gap:6px;width:100%;padding:4px 6px;border-radius:5px;text-align:left}
.compi:hover{background:var(--raise)}
.compi[aria-current="true"]{background:var(--raise);box-shadow:inset 2px 0 0 var(--tape)}
.compi span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{margin:4px 0 0;color:var(--faint);font-size:11px;line-height:1.6;-webkit-user-select:text;user-select:text}
.meter{height:3px;background:var(--well);border-radius:2px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--tie);width:0}

/* ---- stage */
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.hud{position:absolute;left:8px;bottom:8px;display:flex;gap:4px}
.hb{height:22px;padding:0 8px;border-radius:11px;background:rgba(10,14,12,.78);border:1px solid var(--line2);color:var(--dim);font:10.5px var(--f-num)}
.hb:hover{color:var(--ink)}
.hb[aria-pressed="true"]{color:var(--tape);border-color:rgba(233,200,74,.5)}
.note{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(92%,460px);padding:6px 12px;border-radius:14px;background:rgba(10,14,12,.86);border:1px solid var(--line2);color:var(--ink);font-size:11.5px;text-align:center;pointer-events:none}
.note b{color:var(--tape);font-weight:500}
.fail,.drop,.exp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:rgba(10,14,12,.9)}
.drop{border:2px dashed var(--tape);color:var(--tape);font-size:14px;pointer-events:none;background:rgba(10,14,12,.7)}
.exp{pointer-events:auto;background:rgba(10,14,12,.55);justify-content:flex-end;padding-bottom:18px}
.exp b{font-weight:500}
.exp span{font:11px var(--f-num);color:var(--dim)}
.bar{width:min(320px,80%);height:5px;background:var(--well);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--tape)}

/* ---- inspector */
.sec{padding:9px 0 8px;border-bottom:1px solid var(--line)}
.sec h3{padding:0 10px}
.ihead{display:flex;gap:6px;align-items:center;padding:9px 10px 8px;border-bottom:1px solid var(--line)}
.ihead .chipl{flex:none;width:10px;height:22px;border-radius:2px}
.ihead input{flex:1;min-width:0;height:26px;background:transparent;border:1px solid transparent;border-radius:4px;padding:0 6px;font-size:13.500px;font-weight:500;-webkit-user-select:text;user-select:text}
.ihead input:hover,.ihead input:focus{border-color:var(--line2);background:var(--well)}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.abtn{display:flex;align-items:center;justify-content:center;gap:5px;height:30px;border-radius:5px;background:var(--raise);font-size:11.5px;white-space:nowrap}
.abtn:hover{background:#243029}
.abtn.tie{color:var(--tie)}
.abtn .ic{width:16px;height:16px}
.prow{display:grid;grid-template-columns:20px minmax(0,1fr) auto 20px 20px;align-items:center;gap:3px;padding:1px 8px 1px 7px;min-height:26px}
.prow.plain{grid-template-columns:minmax(0,1fr) auto;padding-left:30px}
.pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.pv{display:flex;gap:3px;align-items:center;justify-content:flex-end}
.pb{display:grid;place-items:center;width:20px;height:22px;border-radius:4px;color:var(--faint)}
.pb .ic{width:14px;height:14px}
.pb:hover{color:var(--ink);background:var(--raise)}
.pb.kf.on{color:var(--tape)}
.pb.rl.on{color:var(--tie)}
.pb.xp.on{color:var(--blade)}
.num{width:56px;height:22px;border:1px solid transparent;background:var(--well);color:var(--ink);font:11.500px var(--f-num);font-variant-numeric:tabular-nums;text-align:right;padding:0 5px;border-radius:4px;cursor:ew-resize;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.num.wide{width:74px}
.num:hover{border-color:var(--line2)}
.num:focus{cursor:text;border-color:var(--blade);outline:0}
.num.scrub{border-color:var(--tape)}
.numw{position:relative;display:inline-flex}
.numw i{position:absolute;right:4px;top:3px;font:normal 9px var(--f-num);color:var(--faint);pointer-events:none}
.numw .num{padding-right:14px}
.sel{height:22px;max-width:100%;background:var(--well);border:1px solid transparent;border-radius:4px;padding:0 4px;font-size:11.5px;color:var(--ink)}
.sel:hover{border-color:var(--line2)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:11.500px}
.chk input{accent-color:var(--tape);margin:0}
.colw{display:inline-flex;gap:3px;align-items:center}
.col{position:relative;width:34px;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--line2);background:repeating-conic-gradient(#3a423e 0 25%,#262d29 0 50%) 0 0/8px 8px;display:block}
.col input{position:absolute;inset:-4px;width:150%;height:150%;opacity:0;cursor:pointer}
.col .sw2{position:absolute;inset:0;pointer-events:none}
.txt{width:100%;min-height:54px;resize:vertical;background:var(--well);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:13px;line-height:1.5;-webkit-user-select:text;user-select:text}
.pad{padding:2px 10px}
.row2{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:2px 10px}
.row2 > span{color:var(--dim);font-size:11px}
.xrow{margin:1px 8px 6px 30px;padding:6px;border-radius:5px;background:var(--well);border-left:2px solid var(--blade)}
.xrow textarea{width:100%;min-height:38px;resize:vertical;background:transparent;border:0;font:11.500px/1.5 var(--f-num);color:var(--ink);-webkit-user-select:text;user-select:text}
.xrow textarea:focus{outline:0}
.xerr{color:var(--rec);font-size:10.500px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.chip{height:20px;padding:0 7px;border-radius:10px;background:var(--raise);font-size:10.5px;color:var(--dim);white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--tape);color:var(--tape-ink)}
/* a relation: one component of the sound (or a number sequence) tied to this property */
.rel{margin:1px 8px 7px 30px;padding:6px 6px 5px;border-radius:5px;background:var(--well);border-left:2px solid var(--tie)}
.rel.off{opacity:.5}
.relh{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 20px 20px;gap:3px;align-items:center}
.relh .sel{width:100%}
.relg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 8px;margin-top:5px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.fld > span{color:var(--dim);font-size:10.500px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld.full{grid-column:1/-1}
.fld .sel{max-width:62%}
.scope{display:block;width:100%;height:34px;margin-top:5px;border-radius:3px;background:#070a09}
.reln{margin:4px 0 0;color:var(--dim);font-size:10.500px;line-height:1.5}
.more{color:var(--dim);font-size:10.500px;margin-top:4px;display:inline-flex;align-items:center;gap:2px}
.more .ic{width:12px;height:12px}
.fxb{margin:0 0 2px}
.fxh{display:flex;align-items:center;gap:3px;padding:2px 6px 2px 7px;min-height:26px}
.fxh b{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxh .pb{width:22px}
.fxb.off .fxh b{color:var(--faint);text-decoration:line-through}
.easebox{padding:0 10px}
.easebox canvas{display:block;width:100%;height:130px;background:var(--well);border-radius:5px;touch-action:none;cursor:crosshair}
.kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 10px;padding:2px 10px}
.rulei{margin:0 10px 6px;padding:6px;border-radius:5px;background:var(--well);border-left:2px solid var(--tape)}

/* ---- timeline */
.tlbar{display:flex;align-items:center;gap:8px;padding-block:4px;border-bottom:1px solid var(--line);min-width:0;flex:none}
.tc{font:500 15px var(--f-num);font-variant-numeric:tabular-nums;color:var(--tape);padding:1px 6px;border-radius:4px;letter-spacing:.02em;flex:none}
.tc:hover{background:var(--raise)}
.transport{display:flex;gap:1px;flex:none}
.ib.play{color:var(--ink);background:var(--raise)}
.tlinfo{flex:1;min-width:0;color:var(--faint);font:10.500px var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tlZoom{width:92px;flex:none;accent-color:var(--dim)}
.tlbody{flex:1;min-height:0;display:grid;grid-template-columns:var(--tlw,304px) minmax(0,1fr)}
.tlleft{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;border-right:1px solid var(--line);padding-top:22px;overscroll-behavior:contain}
.tlleft::-webkit-scrollbar{display:none}
.tlright{position:relative;min-width:0;overflow:hidden;background:var(--well)}
#tlc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lrow{display:flex;align-items:center;gap:2px;height:26px;padding-right:4px;border-bottom:1px solid rgba(214,232,222,.045);white-space:nowrap}
.lrow.sel{background:rgba(111,208,197,.11)}
.lrow.off .nm{color:var(--faint)}
.lrow .tw,.lrow .sb{display:grid;place-items:center;width:20px;height:24px;color:var(--faint);flex:none;border-radius:3px}
.lrow .tw .ic,.lrow .sb .ic{width:13px;height:13px}
.lrow .sb:hover,.lrow .tw:hover{color:var(--ink)}
.lrow .sb.on{color:var(--ink)}
.lrow .sb.mb.on{color:var(--tape)}
.lrow .sb.so.on{color:var(--blade)}
.lrow .lab{width:4px;height:16px;border-radius:1px;flex:none;margin-right:3px}
.lrow .ty{color:var(--dim);flex:none;display:grid;place-items:center;width:18px}
.lrow .ty .ic{width:14px;height:14px}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0 3px;cursor:default}
.lrow input.nm{height:20px;background:var(--well);border:1px solid var(--blade);border-radius:3px;-webkit-user-select:text;user-select:text}
.lrow.drop-above{box-shadow:inset 0 2px 0 var(--tape)}
.lrow.drop-below{box-shadow:inset 0 -2px 0 var(--tape)}
.prow2{display:flex;align-items:center;gap:2px;height:22px;padding:0 4px 0 24px;white-space:nowrap;color:var(--dim);font-size:11.5px}
.prow2.sel{color:var(--ink)}
.prow2 .pb{height:20px}
.prow2 .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.prow2 .pv2{font:10.500px var(--f-num);color:var(--faint);max-width:46%;overflow:hidden;text-overflow:ellipsis}
.srow{display:flex;align-items:center;height:16px;padding:0 6px 0 44px;color:var(--tie);font-size:10px;white-space:nowrap;opacity:.9}
.srow button{color:inherit;font-size:10px;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.srow button:hover{color:var(--ink)}
.srow.pick button{color:var(--ink);font-weight:700}

/* ---- popover, menu, dialog, toast */
.pop{position:fixed;z-index:40;min-width:180px;max-height:min(70vh,560px);overflow-y:auto;background:#1e2622;border:1px solid var(--line2);border-radius:7px;box-shadow:0 10px 34px rgba(0,0,0,.55);padding:4px;overscroll-behavior:contain}
.menu{display:flex;flex-direction:column}
.mi{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;text-align:left;min-height:28px}
.mi:hover:not(:disabled){background:rgba(232,236,230,.09)}
.mi.on b{color:var(--tape)}
.mic{color:var(--dim);display:grid;place-items:center}
.ml{flex:1;min-width:0;display:flex;flex-direction:column}
.ml b{font-weight:400}
.ml small{color:var(--dim);font-size:10.500px;line-height:1.45;white-space:normal}
.mi kbd{font:10px var(--f-num);color:var(--faint)}
.msep{height:1px;background:var(--line);margin:4px 2px;font-size:0}
.msep:not(:empty){height:auto;background:none;font-size:10px;letter-spacing:.14em;color:var(--faint);padding:5px 8px 1px;margin:0}
.search{width:100%;height:28px;background:var(--well);border:1px solid var(--line);border-radius:4px;padding:0 8px;margin-bottom:4px;-webkit-user-select:text;user-select:text}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,7,.66);display:grid;place-items:center;padding:16px}
.mbox{width:min(520px,100%);max-height:min(86vh,720px);display:flex;flex-direction:column;background:#1a221e;border:1px solid var(--line2);border-radius:9px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mhead{display:flex;align-items:center;padding:10px 10px 8px 16px;border-bottom:1px solid var(--line)}
.mhead h2{flex:1;margin:0;font-size:14px;font-weight:500}
.mbody{padding:14px 16px;overflow-y:auto;-webkit-user-select:text;user-select:text}
.mbody p{margin:0 0 10px;line-height:1.75;color:var(--ink)}
.mbody h4{margin:14px 0 5px;font-size:11px;letter-spacing:.12em;color:var(--tape);font-weight:500}
.mbody dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0}
.mbody dt{font:11px var(--f-num);color:var(--dim);white-space:nowrap}
.mbody dd{margin:0}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px}
.form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center}
.form > label{color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,10px);z-index:60;max-width:min(92vw,480px);padding:8px 14px;border-radius:16px;background:var(--paper);color:#14110a;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast[data-kind="warn"]{background:#ffd9d4}

/* ---- phone: the mat on top, one panel at a time below */
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(150px,37%) minmax(0,1fr) auto;grid-template-areas:"top" "stage" "panel" "tabs"}
  .left,.insp,.tl{grid-area:panel;border:0;border-top:1px solid var(--line2)}
  .app[data-tab="tl"] .left,.app[data-tab="tl"] .insp,.app[data-tab="insp"] .left,.app[data-tab="insp"] .tl,.app[data-tab="left"] .insp,.app[data-tab="left"] .tl{display:none}

<script>
// Kasane — shared helpers: 2D affine matrices, easing, colour, noise, path simplification.
// Every source file hangs its exports on KS so the files can be concatenated into one script
// (tools/build.mjs) and also loaded one by one under node for the offline tests.
'use strict';
var KS = globalThis.KS || (globalThis.KS = {});
(() => {
  const U = KS.U = {};

  U.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.isArr = Array.isArray;
  let uidN = 0;
  U.uid = (p = '') => p + (++uidN).toString(36) + Math.floor(Math.random() * 46656).toString(36).padStart(3, '0');
  U.clone = (o) => JSON.parse(JSON.stringify(o));
  U.round = (x, d = 3) => { const k = 10 ** d; return Math.round(x * k) / k; };

  // ---- matrices: [a, b, c, d, e, f] with x' = a*x + c*y + e, y' = b*x + d*y + f (canvas order)
  U.mIdent = () => [1, 0, 0, 1, 0, 0];
  U.mMul = (m, n) => [
    m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
    m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  U.mInv = (m) => {
    const d = m[0] * m[3] - m[1] * m[2];
    if (Math.abs(d) < 1e-12) return [1, 0, 0, 1, -m[4], -m[5]];
    return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d];
  };
  U.mApply = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
  U.mVec = (m, x, y) => [m[0] * x + m[2] * y, m[1] * x + m[3] * y];          // direction only, no translation
  // position · rotation · scale · (−anchor): the order After Effects uses for a layer transform
  U.mTRS = (px, py, deg, sx, sy, ax, ay) => {
    const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    const a = c * sx, b = s * sx, cc = -s * sy, d = c * sy;
    return [a, b, cc, d, px - (a * ax + cc * ay), py - (b * ax + d * ay)];
  };
  U.mScaleOf = (m) => Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2]));        // area-preserving mean scale
  U.mRotOf = (m) => Math.atan2(m[1], m[0]) * 180 / Math.PI;
  U.mScale = (s, t = s) => [s, 0, 0, t, 0, 0];
  U.mTrans = (x, y) => [1, 0, 0, 1, x, y];

  // ---- cubic-bezier easing, CSS style: e = [x1, y1, x2, y2], maps progress in time to progress in value
  U.bez = (e, x) => {
    if (!e) return x;
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    const x1 = U.clamp(e[0], 0, 1), y1 = e[1], x2 = U.clamp(e[2], 0, 1), y2 = e[3];
    if (x1 === y1 && x2 === y2) return x;
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    let t = x;
    for (let i = 0; i < 8; i++) {                                           // Newton
      const xt = ((ax * t + bx) * t + cx) * t - x;
      if (Math.abs(xt) < 1e-6) return ((ay * t + by) * t + cy) * t;
      const d = (3 * ax * t + 2 * bx) * t + cx;
      if (Math.abs(d) < 1e-6) break;
      t -= xt / d;
    }
    let lo = 0, hi = 1; t = x;                                              // bisection when Newton stalls
    for (let i = 0; i < 24; i++) {
      const xt = ((ax * t + bx) * t + cx) * t;
      if (Math.abs(xt - x) < 1e-6) break;
      if (xt < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return ((ay * t + by) * t + cy) * t;
  };
  U.EASE = {
    linear: null, ease: [0.333, 0, 0.667, 1], in: [0.55, 0, 1, 1], out: [0, 0, 0.45, 1],
    strong: [0.8, 0, 0.2, 1], back: [0.3, -0.4, 0.3, 1.45], spring: [0.2, 1.6, 0.4, 1], snap: [0.9, 0, 0.1, 1],
  };

  // ---- values: numbers or arrays of numbers (vectors, colours)
  U.vlerp = (a, b, t) => {
    if (typeof a === 'number') return a + (b - a) * t;
    const n = a.length, o = new Array(n);
    for (let i = 0; i < n; i++) o[i] = a[i] + ((b[i] === undefined ? a[i] : b[i]) - a[i]) * t;
    return o;
  };
  U.veq = (a, b) => {
    if (typeof a === 'number' || typeof b === 'number') return a === b;
    if (!a || !b || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  };
  U.vcopy = (a) => (U.isArr(a) ? a.slice() : a);

  // ---- colour: stored as [r, g, b, a] in 0..1, not premultiplied
  U.hex2rgba = (h, a = 1) => {
    h = String(h || '').replace('#', '').trim();
    if (h.length === 3 || h.length === 4) h = h.split('').map((c) => c + c).join('');
    if (!/^[0-9a-f]{6}([0-9a-f]{2})?$/i.test(h)) return [1, 1, 1, a];
    const n = parseInt(h.slice(0, 6), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : a];
  };
  U.rgba2hex = (c) => '#' + [0, 1, 2].map((i) => Math.round(U.clamp(c[i], 0, 1) * 255).toString(16).padStart(2, '0')).join('');
  U.rgbaCss = (c, mul = 1) => `rgba(${Math.round(U.clamp(c[0], 0, 1) * 255)},${Math.round(U.clamp(c[1], 0, 1) * 255)},${Math.round(U.clamp(c[2], 0, 1) * 255)},${U.clamp((c[3] === undefined ? 1 : c[3]) * mul, 0, 1)})`;

  // ---- deterministic randomness
  U.rng = (seed) => {                                                       // mulberry32
    let a = (seed >>> 0) || 1;
    return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  U.hashStr = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  U.hash1 = (n, seed = 0) => { let h = (Math.imul(n | 0, 374761393) + Math.imul(seed | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  // smooth 1-D noise in [-1, 1]; what wiggle() and the torn edges are built on
  // (random targets once per unit, joined by a Catmull-Rom spline — it never snaps back to zero on the beat)
  U.noise1 = (x, seed = 0) => {
    const i = Math.floor(x), f = x - i, v = (k) => U.hash1(k, seed) * 2 - 1;
    const p0 = v(i - 1), p1 = v(i), p2 = v(i + 1), p3 = v(i + 2);
    const y = 0.5 * (2 * p1 + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f);
    return U.clamp(y, -1, 1);
  };

  // ---- Ramer–Douglas–Peucker on n-dimensional points; keeps the first and last point
  U.rdp = (pts, eps) => {
    const n = pts.length;
    if (n < 3) return pts.map((_, i) => i);
    const keep = new Uint8Array(n); keep[0] = keep[n - 1] = 1;
    const stack = [[0, n - 1]];
    while (stack.length) {
      const [a, b] = stack.pop(), A = pts[a], B = pts[b], dim = A.length;
      let len2 = 0; for (let k = 0; k < dim; k++) len2 += (B[k] - A[k]) ** 2;
      let worst = -1, wd = eps * eps;
      for (let i = a + 1; i < b; i++) {
        const P = pts[i]; let t = 0;
        if (len2 > 0) { for (let k = 0; k < dim; k++) t += (P[k] - A[k]) * (B[k] - A[k]); t = U.clamp(t / len2, 0, 1); }
        let d2 = 0; for (let k = 0; k < dim; k++) d2 += (P[k] - (A[k] + (B[k] - A[k]) * t)) ** 2;
        if (d2 > wd) { wd = d2; worst = i; }
      }
      if (worst > 0) { keep[worst] = 1; stack.push([a, worst], [worst, b]); }
    }
    const out = []; for (let i = 0; i < n; i++) if (keep[i]) out.push(i);
    return out;
  };

  // ---- time display: m:ss:ff (frames), the way an editing timeline counts
  U.fmtTime = (t, fps) => {
    const neg = t < 0; t = Math.abs(t);
    const f = Math.round(t * fps), ff = f % Math.round(fps), s = Math.floor(f / Math.round(fps));
    return (neg ? '-' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ':' + String(ff).padStart(2, '0');
  };
  U.parseTime = (str, fps) => {
    str = String(str).trim();
    if (/^-?\d+(\.\d+)?s?$/.test(str)) return parseFloat(str);              // plain seconds
    if (/^\d+f$/.test(str)) return parseInt(str, 10) / fps;                  // frames
    const p = str.split(':').map((x) => parseFloat(x) || 0);
    if (p.length === 3) return p[0] * 60 + p[1] + p[2] / fps;
    if (p.length === 2) return p[0] + p[1] / fps;
    return NaN;
  };
  U.fmtNum = (x, d = 1) => { const s = (+x).toFixed(d); return d ? s.replace(/\.?0+$/, '') : s; };

  U.debounce = (fn, ms) => { let h = 0; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; };
  U.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
})();

// Kasane — the document: project → compositions → layers → properties → keyframes.
// The shape follows After Effects on purpose: every animatable thing is a property that either holds
// one value or a list of keyframes, and a layer is drawn as masks → effects → transform.
// Everything here is plain JSON so that undo, autosave and project files are one JSON.stringify away.
'use strict';
(() => {
  const U = KS.U;
  const M = KS.M = {};

  M.BLENDS = [
    ['normal', '通常'], ['multiply', '乗算'], ['screen', 'スクリーン'], ['overlay', 'オーバーレイ'], ['add', '加算'],
    ['darken', '比較（暗）'], ['lighten', '比較（明）'], ['colordodge', '覆い焼き'], ['colorburn', '焼き込み'],
    ['hardlight', 'ハードライト'], ['softlight', 'ソフトライト'], ['difference', '差の絶対値'], ['exclusion', '除外'],
    ['hue', '色相'], ['saturation', '彩度'], ['color', 'カラー'], ['luminosity', '輝度'],
  ];
  M.MATTES = [['a', 'アルファ'], ['ai', 'アルファ反転'], ['l', 'ルミナンス'], ['li', 'ルミナンス反転']];
  M.TYPES = {
    solid: '平面', shape: '図形', text: 'テキスト', image: '画像', video: '動画', audio: '音', null: 'ヌル', adjust: '調整', comp: 'コンポ',
  };
  // washi-tape label colours for layers
  M.LABELS = ['#e86a5c', '#e9c84a', '#7fc97a', '#57c2c9', '#6f8fe8', '#b07ce8', '#e77fb3', '#c9a06a'];

  const TR = {
    a: { label: 'アンカー', type: 'vec2', unit: 'px', step: 1 },
    p: { label: '位置', type: 'vec2', unit: 'px', step: 1 },
    s: { label: 'スケール', type: 'vec2', unit: '%', step: 1, link: true },
    r: { label: '回転', type: 'num', unit: '°', step: 1 },
    o: { label: '不透明度', type: 'num', unit: '%', min: 0, max: 100, step: 1 },
  };
  M.TR_ORDER = ['a', 'p', 's', 'r', 'o'];
  const TYPE_PROPS = {
    solid: { color: { label: '色', type: 'color' } },
    shape: {
      size: { label: 'サイズ', type: 'vec2', unit: 'px', min: 0, step: 1, link: false },
      round: { label: '角の丸み', type: 'num', unit: 'px', min: 0, step: 1 },
      points: { label: '頂点の数', type: 'num', min: 3, max: 64, step: 1, int: true },
      inner: { label: '内側の半径', type: 'num', unit: '%', min: 1, max: 100, step: 1 },
      fill: { label: '塗り', type: 'color' },
      stroke: { label: '線の色', type: 'color' },
      strokeW: { label: '線の太さ', type: 'num', unit: 'px', min: 0, step: 0.5 },
      trimS: { label: '線の開始', type: 'num', unit: '%', min: 0, max: 100, step: 1 },
      trimE: { label: '線の終了', type: 'num', unit: '%', min: 0, max: 100, step: 1 },
      trimO: { label: '線のずらし', type: 'num', unit: '°', step: 1 },
    },
    text: {
      size: { label: '文字サイズ', type: 'num', unit: 'px', min: 1, step: 1 },
      track: { label: '字間', type: 'num', min: -200, max: 2000, step: 5 },
      lead: { label: '行送り', type: 'num', unit: '%', min: 50, max: 400, step: 1 },
      fill: { label: '文字の色', type: 'color' },
      stroke: { label: 'ふちの色', type: 'color' },
      strokeW: { label: 'ふちの太さ', type: 'num', unit: 'px', min: 0, step: 0.5 },
      reveal: { label: '表示する文字', type: 'num', unit: '%', min: 0, max: 100, step: 1 },
    },
    video: { vol: { label: '音量', type: 'num', unit: '%', min: 0, max: 200, step: 1 } },
    audio: { vol: { label: '音量', type: 'num', unit: '%', min: 0, max: 200, step: 1 } },
  };
  const MASK_PROPS = {
    feather: { label: 'ぼかし', type: 'num', unit: 'px', min: 0, step: 1 },
    expand: { label: '拡張', type: 'num', unit: 'px', step: 1 },
    opacity: { label: '不透明度', type: 'num', unit: '%', min: 0, max: 100, step: 1 },

  M.desc = (layer, path) => {

  // ---- keyframes
  // key: { id, t, v, e?: [x1,y1,x2,y2] easing of the stretch that starts at this key, h?: 1 hold }
  M.keySeg = (k, t) => {                       // index i with k[i].t <= t < k[i+1].t ; -1 before the first key

    if (a.h) return a.v;
    const span = b.t - a.t;

  M.keyAt = (prop, t, tol = 1e-4) => (prop.k ? prop.k.find((q) => Math.abs(q.t - t) < tol) : null);
  M.setKey = (prop, t, v, opts = {}) => {
    if (!prop.k) prop.k = [];
    let key = M.keyAt(prop, t);

    key = { id: U.uid('k'), t, v: U.vcopy(v) };
    const i = prop.k.length ? M.keySeg(prop.k, t) : -1;

    else if (i >= 0 && prop.k[i].e) key.e = prop.k[i].e.slice();

    id: U.uid('c'), name: o.name || 'コンポ 1', w: o.w || 1920, h: o.h || 1080, fps: o.fps || 30, dur: o.dur || 8,
    bg: o.bg || [0.06, 0.07, 0.07, 1], layers: [], wa: [0, o.dur || 8], mb: { on: true, angle: 180, samples: 8 },
  });
  M.newLayer = (type, comp, o = {}) => {
    const cx = comp.w / 2, cy = comp.h / 2;
    const L = {
      id: U.uid('l'), type, name: o.name || M.TYPES[type], label: M.TYPE_LABEL[type] || 0,
      in: o.in === undefined ? 0 : o.in, out: o.out === undefined ? comp.dur : o.out, start: o.start === undefined ? (o.in || 0) : o.start,
      vis: true, solo: false, lock: false, mb: false, blend: 'normal', parent: null, matte: null, step: 0, speed: 1,
      tr: { a: P([0, 0]), p: P([cx, cy]), s: P([100, 100]), r: P(0), o: P(100) },

    const c = U.clone(layer);

  // ---- evaluation of one moment

  // and remembers the answers so that a layer referenced by many others is only worked out once.
  class Frame {
    constructor(project, comp, t) {

      const l = this.local(layer, t);
      const par = layer.parent && depth < 32 ? this.layer(layer.parent) : null;
      return par && par.tr ? U.mMul(this.world(par, t, depth + 1), l) : l;
    }
    parentWorld(layer, t = this.t) {
      const par = layer.parent ? this.layer(layer.parent) : null;
      return par && par.tr ? this.world(par, t, 1) : U.mIdent();
    }

  }

})();

// Kasane — expressions: a property can be driven by a line of code instead of (or on top of) keyframes,
// with the vocabulary After Effects users already know: time, value, wiggle(), loopOut(), linear(), ...
// This is a small interpreter rather than eval/new Function: a project file may come from someone else,
// and nothing typed into an expression can reach the page, its storage or the network.
'use strict';
(() => {
  const U = KS.U, M = KS.M;
  const X = KS.X = {};

  // ---------------------------------------------------------------- tokenizer
  const PUNCT = ['===', '!==', '**', '==', '!=', '<=', '>=', '&&', '||', '+=', '-=', '*=', '/=', '=>',
    '+', '-', '*', '/', '%', '(', ')', '[', ']', '{', '}', ',', ';', '.', '?', ':', '<', '>', '!', '='];
  function lex(src) {

      const c = src[i];
      if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }
      if (c === '\n') { out.push({ k: 'nl' }); i++; continue; }
      if (c === '/' && src[i + 1] === '/') { while (i < n && src[i] !== '\n') i++; continue; }
      if (c === '/' && src[i + 1] === '*') { const e = src.indexOf('*/', i + 2); i = e < 0 ? n : e + 2; continue; }
      if ((c >= '0' && c <= '9') || (c === '.' && src[i + 1] >= '0' && src[i + 1] <= '9')) {
        const m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(src.slice(i));

    G.use(G.prog(G.SRC.layer, 'layer'), { uTex: pre.tex, uMat: mat, uView: [rt.w, rt.h], uZk: zr > 0 ? 1 / (zr * 1.05) : 0, uZs: U.mScaleOf(mat), uColor: color, uEdge: 0, uShade: zr > 0 ? shade : 0, uBack: zr > 0 ? back : 0, uFlip: mat[0] * mat[3] - mat[1] * mat[2] < 0 ? -1 : 1, uLight: LIGHT, uPaper: PAPER });

    for (const f of meshFx(L)) { for (const k in f.p) if (M.isAnimated(f.p[k])) return true; for (const q of f.pins || []) if (M.isAnimated(q.pos)) return true; if (f.type === 'flutter') return true; }

    const world = U.mMul(U.mScale(res), frame.world(L, t));
    const src = getSource(env, L, t, world);
    if (!src) return null;

    env.srcRect = src.rect;
    const pre = prepare(env, L, t, src, L.type === 'adjust');

  function renderComp(project, comp, t, o = {}) {

      if (anySolo ? !L.solo : !L.vis) continue;

        const fxs = (L.fx || []).filter((f) => f.on && FX.defs[f.type] && !FX.defs[f.type].mesh);
        if (!fxs.length) { if (env.depth === 0) R.rects.set(L.id, { x: 0, y: 0, w: L.d.w, h: L.d.h }); continue; }
        const cov = layerTarget(env, L, t);
        if (!cov) continue;
        let cur = acc;
        const ctx = { rs: res, time: t, seed: 0, frameNo: 0, l0: [0, 0], ls: [W, H], toPx: (pt) => [pt[0] * res, pt[1] * res], wave: () => waveFor(env, t) };

      if (direct) {

        if (!src) continue;
        if (env.depth === 0) R.rects.set(L.id, src.rect);
        env.srcRect = src.rect;
        const pre = prepare(env, L, t, src, false);
        if (pre === src && src.tint) pre.tint = src.tint;
        place(env, acc, L, t, pre, world, U.clamp(frame.val(L, 'tr.o', t), 0, 100) / 100, 'over', mfx);

    }

    return acc;
  }

  // ---------------------------------------------------------------- frame-level entry points
  // draw the composition into the viewer canvas, lying on the mat
  R.present = (rt, comp, view) => {

      uTex: rt.tex, uCanvas: [gl.drawingBufferWidth, gl.drawingBufferHeight], uPan: [view.panX * view.dpr, view.panY * view.dpr],
      uComp: [comp.w, comp.h], uZoom: view.zoom * view.dpr, uDpr: view.dpr, uSurround: view.surround === 'black' ? -1 : view.surround === 'plain' ? 0 : 1,

    G.quad();
  };

    const t0 = performance.now();

    const rt = renderComp(project, comp, t, o);
    R.stats.ms = performance.now() - t0;
    return rt;
  };

  R.pixels = (project, comp, t, o = {}) => {
    const rt = renderComp(project, comp, t, Object.assign({ res: 1, mb: true }, o));
    let out = rt;
    if (o.flat !== false) { out = G.acquire(rt.w, rt.h, { clear: false }); R.flatten(rt, comp, out); }
    const px = G.read(out), w = out.w, h = out.h;
    if (out !== rt) G.release(out);
    G.release(rt);
    return { px, w, h };
  };
})();

'use strict';
(() => {
  const U = KS.U, M = KS.M;
  const S = KS.S = {
    project: null, compId: null, t: 0, playing: false, loop: true, rec: false, exporting: false,
    sel: { layers: [], keys: [], mask: null },
    tool: 'select',
    view: { zoom: 1, panX: 0, panY: 0, fit: true, res: 0, dpr: 1, surround: 'mat', checker: false, guides: false, mb: false },
    tl: { pps: 90, sx: 0, open: {}, anim: false },
    ui: { tab: 'tl', hint: true },
  };

  // ---- tiny event bus. 'doc' = the project changed, 'struct' = rows/panels must be rebuilt,
  // 'time', 'sel', 'view', 'tool', 'play' are what they say.
  const subs = {};
  KS.on = (ev, fn) => { (subs[ev] || (subs[ev] = [])).push(fn); };
  KS.emit = (ev, data) => { for (const fn of subs[ev] || []) fn(data); };

  KS.comp = () => (S.project ? M.comp(S.project, S.compId) || S.project.comps[0] || null : null);
  KS.layer = (id) => { const c = KS.comp(); return c ? M.layer(c, id) : null; };
  KS.selLayers = () => { const c = KS.comp(); return c ? c.layers.filter((l) => S.sel.layers.includes(l.id)) : []; };
  KS.firstSel = () => KS.selLayers()[0] || null;

  KS.docVer = 0;
  KS.changed = () => { KS.docVer++; KS.emit('doc'); };   // values moved
  KS.restructured = () => { KS.docVer++; KS.emit('struct'); KS.emit('doc'); };   // things were added, removed, reordered

  // ---- history: whole-project snapshots. A project is a few kilobytes of JSON (media lives elsewhere),
  // so this is cheap and can never get out of step with the document.
  const H = KS.H = { stack: [], at: -1, max: 120, lastLabel: '' };
  H.init = () => { H.stack = [JSON.stringify(S.project)]; H.at = 0; };
  KS.commit = (label = '') => {
    const snap = JSON.stringify(S.project);

// Kasane — footage: importing pictures, video and sound, keeping them between visits (IndexedDB),
// stepping video elements in time with the playhead, and playing / mixing the sound.
// Files never leave the device; the project file only refers to them by name.
'use strict';
(() => {
  const U = KS.U, M = KS.M, S = KS.S;
  const MD = KS.Media = { store: new Map() };   // asset.id → { blob, url, el, w, h, audio, thumb, state }

  const EXT = {

    video: ['mp4', 'mov', 'm4v', 'webm', 'ogv', 'mkv'],
    audio: ['mp3', 'wav', 'm4a', 'aac', 'ogg', 'oga', 'flac', 'aif', 'aiff', 'opus'],

    const t = file.type || '', e = (file.name.split('.').pop() || '').toLowerCase();

  // ---- IndexedDB (best effort: a private window or a full disk just means footage has to be re-added)
  let dbp = null;

    try {

  const loadImage = (url) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('画像を開けませんでした')); im.src = url; });

    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
    let done = false; const fail = () => { if (!done) { done = true; rej(new Error('この動画はこのブラウザで再生できない形式です')); } };
    const tm = setTimeout(fail, 15000);

    v.onseeked = () => { if (done) return; done = true; clearTimeout(tm); res({ w: v.videoWidth, h: v.videoHeight, dur: isFinite(v.duration) ? v.duration : 10, thumb: KS.Raster.thumb(v, v.videoWidth, v.videoHeight).toDataURL('image/jpeg', 0.7) }); v.removeAttribute('src'); v.load(); };
    v.src = url;
  });
  async function open(asset, blob) {
    const e = { blob, url: URL.createObjectURL(blob), state: 'loading' };

    if (asset.kind === 'image') {
      const im = await loadImage(e.url);
      e.el = im; e.w = asset.w = im.naturalWidth || 512; e.h = asset.h = im.naturalHeight || 512;

  MD.importFiles = async (files) => {
    const out = [];

  MD.image = (id) => { const e = MD.store.get(id); return e && e.el ? e : null; };
  MD.audio = (id) => { const e = MD.store.get(id); return e ? e.audio || null : null; };
  MD.thumb = (id) => { const e = MD.store.get(id); return e ? e.thumb || '' : ''; };
  MD.ready = (id) => { const e = MD.store.get(id); return !!(e && e.state === 'ready'); };

    if (!v) {
      if (!host) { host = document.createElement('div'); host.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none'; document.body.append(host); }
      const el = document.createElement('video');
      el.muted = true; el.playsInline = true; el.preload = 'auto'; el.setAttribute('playsinline', ''); el.disablePictureInPicture = true;
      el.src = e.url;
      const poke = () => KS.emit('videoFrame');
      el.addEventListener('seeked', poke); el.addEventListener('loadeddata', poke);
      host.append(el);

  MD.videoFrame = (L, tl, env) => {
    const v = videoFor(L); if (!v) return null;
    const el = v.el, dur = isFinite(el.duration) ? el.duration : 1e9, want = U.clamp(tl, 0, Math.max(0, dur - 0.04));
    v.used = tick;

  MD.pauseAll = () => { for (const v of vids.values()) if (!v.el.paused) v.el.pause(); };
  MD.pruneVideos = (project) => { const live = new Set(); for (const c of project.comps) for (const l of c.layers) live.add(l.id); for (const [id, v] of vids) if (!live.has(id)) { v.el.removeAttribute('src'); v.el.load(); v.el.remove(); vids.delete(id); } };

// Kasane — getting work out: video (frame-exact through WebCodecs, or recorded in real time where that is
// missing), a still frame, and the project file.
'use strict';
(() => {
  const U = KS.U, S = KS.S, G = KS.G, R = KS.R, MD = KS.Media;
  const EX = KS.Export = { cancel: false, busy: false };

  // the muxer / encoder front end is fetched only when a video is actually exported
  const MB_URLS = ['https://cdn.jsdelivr.net/npm/mediabunny@1.62.1/dist/bundles/mediabunny.min.mjs', 'https://unpkg.com/mediabunny@1.62.1/dist/bundles/mediabunny.min.mjs'];
  let mbp = null;
  EX.loadMB = () => mbp || (mbp = (async () => {
    for (const url of MB_URLS) {
      try {
        const m = await Promise.race([import(url), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 25000))]);
        if (m && m.Output) return m;
      } catch (e) { /* try the next host */ }
    }
    mbp = null;
    return null;
  })());

  const inViewer = () => !!(window.claude && typeof window.claude.use === 'function');
  EX.deliver = async (name, blob) => {
    if (inViewer()) {
      const dl = await window.claude.use('downloads');
      if (dl) {
        try { await dl.save({ filename: name, data: blob }); return `${name} を保存しました`; }
        catch (e) {
          const c = e && e.code;
          if (c === 'declined') return '保存をやめました';
          if (c === 'rate_limited') throw new Error('保存の確認がまだ開いています。閉じてからもう一度押してください');
          if (c === 'too_large') throw new Error('ファイルが大きすぎて保存できませんでした。解像度か長さを下げてください');
          throw new Error('この表示ではファイルを保存できません');
        }
      }
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return `${name} を書き出しました`;
  };

  // o: { format: 'mp4'|'webm', scale: 1|0.5, range: 'work'|'all', audio: bool, quality: 'high'|'medium'|'veryhigh' }
  EX.video = async (o, onProgress) => {
    const comp = KS.comp(), project = S.project, fps = comp.fps;
    const [t0, t1] = o.range === 'all' ? [0, comp.dur] : comp.wa;
    const scale = o.scale || 1, W = Math.max(2, Math.round(comp.w * scale / 2) * 2), H = Math.max(2, Math.round(comp.h * scale / 2) * 2);
    const frames = Math.max(1, Math.round((t1 - t0) * fps));

      const MB = typeof VideoEncoder !== 'undefined' ? await EX.loadMB() : null;

      let ext = o.format === 'webm' ? 'webm' : 'mp4', note = '';
      let vcodec = await MB.getFirstEncodableVideoCodec(ext === 'webm' ? ['vp9', 'vp8', 'av1'] : ['avc'], { width: W, height: H });
      if (!vcodec && ext === 'mp4') { ext = 'webm'; vcodec = await MB.getFirstEncodableVideoCodec(['vp9', 'vp8', 'av1'], { width: W, height: H }); note = 'このブラウザは MP4 に書き出せないため、WebM にしました。'; }
      if (!vcodec) return viaRecorder();
      const q = { veryhigh: MB.QUALITY_VERY_HIGH, high: MB.QUALITY_HIGH, medium: MB.QUALITY_MEDIUM }[o.quality] || MB.QUALITY_HIGH;
      const output = new MB.Output({ format: ext === 'webm' ? new MB.WebMOutputFormat() : new MB.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new MB.BufferTarget() });
      const vs = new MB.CanvasSource(G.canvas, { codec: vcodec, bitrate: q, keyFrameInterval: 2 });

      await new Promise((res) => {
        const step = () => {
          const t = MD.time();

  // ---------------------------------------------------------------- keyboard
  function keys(e) {
    const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    const mod = e.metaKey || e.ctrlKey, k = e.key.length === 1 ? e.key.toLowerCase() : e.key, comp = KS.comp();
    if (!$('modal').hidden) { if (k === 'Escape') { $('modal').hidden = true; $('modal').replaceChildren(); } return; }
    if (S.exporting || !comp) return;
    if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) KS.redo(); else KS.undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); KS.redo(); return; }
    if (mod && k === 's') { e.preventDefault(); deliver(EX.projectFile()); return; }
    if (typing) return;
    const fr = 1 / comp.fps;
    if (mod) {
      if (k === 'd') { e.preventDefault(); if (e.shiftKey) C.split(); else C.duplicate(); }
      else if (k === 'a') { e.preventDefault(); KS.select(comp.layers.map((l) => l.id)); }
      else if (k === ']' || k === '[') { e.preventDefault(); C.reorder(k === ']' ? (e.shiftKey ? 2 : 1) : (e.shiftKey ? -2 : -1)); }
      return;
    }
    const tools = { v: 'select', h: 'hand', g: 'pen', x: 'text', c: 'tear', y: 'pin', w: 'crumple' };
    if (tools[k]) { KS.setTool(tools[k]); return; }
    if (k === 'q') { KS.setTool(S.tool === 'rect' ? 'ellipse' : S.tool === 'ellipse' ? 'star' : 'rect'); return; }
    switch (k) {
      case ' ': e.preventDefault(); P.toggle(); break;
      case ',': case 'PageUp': e.preventDefault(); P.stop(); KS.step(e.shiftKey ? -10 : -1); break;
      case '.': case 'PageDown': e.preventDefault(); P.stop(); KS.step(e.shiftKey ? 10 : 1); break;
      case 'Home': KS.setTime(0); break;
      case 'End': KS.setTime(comp.dur); break;
      case 'j': C.keyNav(-1); break;
      case 'k': C.keyNav(1); break;
      case 'b': comp.wa[0] = Math.min(S.t, comp.wa[1] - fr); KS.changed(); KS.commit('work area'); break;
      case 'n': comp.wa[1] = Math.max(S.t + fr, comp.wa[0] + fr); KS.changed(); KS.commit('work area'); break;
      case 'i': { const L = KS.firstSel(); if (L) KS.setTime(L.in); break; }
      case 'o': { const L = KS.firstSel(); if (L) KS.setTime(L.out - fr); break; }
      case '[': if (e.altKey) C.trimIn(); else C.moveInTo(); break;
      case ']': if (e.altKey) C.trimOut(); else { for (const L of KS.selLayers()) M.shiftLayer(L, S.t + fr - L.out); KS.changed(); KS.commit('move'); } break;
      case 'u': { const Ls = KS.selLayers(); const any = Ls.some((L) => S.tl.open[L.id]); for (const L of Ls) { if (any) delete S.tl.open[L.id]; else S.tl.open[L.id] = 'anim'; } KS.emit('struct'); break; }
      case 'F9': e.preventDefault(); C.ease(U.EASE.ease, false); dirty.insp = true; break;
      case 'f': V.fit(); break;
      case '+': case '=': case ';': V.zoomAt(1.25); break;
      case '-': V.zoomAt(0.8); break;
      case "'": S.view.guides = !S.view.guides; dirty.overlay = true; break;
      case 'Delete': case 'Backspace': e.preventDefault(); C.deleteSel(); break;
      case 'Enter': if (V.pen) V.penFinish(false); break;
      case 'Escape': if (!V.cancel()) { if (S.tool !== 'select') KS.setTool('select'); else KS.select([]); } break;
      case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown': {
        e.preventDefault();
        const Ls = KS.selLayers().filter((L) => L.tr && !L.lock), d = e.shiftKey ? 10 : 1, dx = k === 'ArrowLeft' ? -d : k === 'ArrowRight' ? d : 0, dy = k === 'ArrowUp' ? -d : k === 'ArrowDown' ? d : 0;
        if (!Ls.length) { if (dx) { P.stop(); KS.step(dx); } break; }
        for (const L of Ls) { const p = M.evalProp(L.tr.p, S.t); M.setValue(L.tr.p, [p[0] + dx, p[1] + dy], S.t); }
        KS.changed(); KS.commit('nudge'); break;
      }
      default: break;
    }
  }

    $('loopBtn').onclick = () => { S.loop = !S.loop; $('loopBtn').setAttribute('aria-pressed', String(S.loop)); };
    $('recBtn').onclick = () => { S.rec = !S.rec; $('recBtn').setAttribute('aria-pressed', String(S.rec)); if (S.rec) { KS.setTool('select'); V.note('●記録中：<b>レイヤーをつかんで動かす</b>と、離すまでの動きがキーフレームになります', 6000); } };
    $('tcBtn').onclick = (e) => { const comp = KS.comp(), inp = h('input.search', { type: 'text', value: U.fmtTime(S.t, comp.fps), 'aria-label': '移動先の時間', onkeydown: (ev) => { ev.stopPropagation(); if (ev.key === 'Enter') { const t = U.parseTime(inp.value, comp.fps); if (isFinite(t)) KS.setTime(t); UI.closePop(); } } }); UI.pop(e.currentTarget, h('div', inp, h('p.hint', { style: 'margin:0 4px 4px' }, '分:秒:コマ、または秒数（例 2.5）')), { width: 200, force: true }); inp.focus(); inp.select(); };
    $('zoomBtn').onclick = (e) => UI.menu(e.currentTarget, [['全体を表示', 'fit'], ['50%', 0.5], ['100%', 1], ['200%', 2], ['400%', 4]].map(([label, z]) => ({ label, run: () => V.zoomTo(z) })).concat([{ sep: true }, { label: 'ガイドを表示', checked: S.view.guides, run: () => { S.view.guides = !S.view.guides; dirty.overlay = true; } }, { label: 'カッターマットの上に置く', checked: S.view.surround === 'mat', run: () => { S.view.surround = S.view.surround === 'mat' ? 'black' : 'mat'; dirty.render = true; } }]), { force: true });
    $('resBtn').onclick = (e) => UI.menu(e.currentTarget, [['自動（表示倍率に合わせる）', 0], ['フル', 1], ['1/2', 0.5], ['1/4', 0.25]].map(([label, r]) => ({ label, checked: S.view.res === r, run: () => { S.view.res = r; KS.emit('view'); } })), { force: true });
    $('mbBtn').onclick = () => { S.view.mb = !S.view.mb; KS.emit('view'); };
    for (const b of $('tabs').children) b.onclick = () => KS.setTab(b.dataset.tab);
    $('fileIn').onchange = (e) => { importFiles(e.target.files); e.target.value = ''; };
    $('projIn').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { adopt(await EX.readProject(f)); KS.toast('プロジェクトを開きました'); } catch (err) { KS.toast(err.message, 'warn'); } };
    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; $('drop').hidden = false; } });
    window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('drop').hidden = true; });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });
    window.addEventListener('keydown', keys);
    window.addEventListener('resize', () => { dirty.timeline = true; });
    KS.Fonts.onLoad = () => { dirty.render = true; };

    V.init(); TL.init(); IN.init();
    let project = null, restored = false;
    try { const raw = localStorage.getItem('kasane.project'); if (raw) { const p = JSON.parse(raw); if (p && p.app === 'kasane' && p.comps && p.comps.length) { project = p; restored = true; } } } catch (e) { project = null; }
    adopt(project || KS.demo(), { t: restored ? 0 : 3.6 });
    KS.emit('play'); KS.emit('tool'); hud();
    if (!restored && V.ok) V.note('これはサンプルです。<b>レイヤーをつかんで動かせます</b>。スペースで再生', 7000);
    requestAnimationFrame(loop);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>

</body></html>
