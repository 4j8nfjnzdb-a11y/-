<title>リズム箱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: hsl(250 22% 93%);
    --surface: hsl(250 18% 97%);
    --surface-line: hsl(250 15% 82%);
    --well: hsl(250 16% 87%);
    --well-floor: hsl(250 18% 82%);
    --ink: hsl(250 32% 13%);
    --ink-dim: hsl(250 12% 42%);
    --ink-faint: hsl(250 10% 58%);
    --accent: #b85a24;
    --accent-ink: #ffffff;
    --accent-glow: rgba(184, 90, 36, 0.28);
    --rim: rgba(184, 90, 36, 0.55);

    --note-1: #b8663a; /* ember */
    --note-2: #a75c68; /* rose */
    --note-3: #5f7d52; /* sage */
    --note-4: #4f688f; /* dusk */
    --note-5: #8a5a3a; /* clay */
    --note-6: #4c6d70; /* mist */

    --font-display: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: hsl(250 26% 7%);
      --surface: hsl(250 22% 10%);
      --surface-line: hsl(250 18% 20%);
      --well: hsl(250 26% 5%);
      --well-floor: hsl(250 30% 3%);
      --ink: hsl(250 22% 93%);
      --ink-dim: hsl(250 12% 66%);
      --ink-faint: hsl(250 10% 44%);
      --accent: #e08a44;
      --accent-ink: #1a0f06;
      --accent-glow: rgba(224, 138, 68, 0.35);
      --rim: rgba(224, 138, 68, 0.45);

      --note-1: #d98a52;
      --note-2: #c7818c;
      --note-3: #85a273;
      --note-4: #7a93bf;
      --note-5: #b9814f;
      --note-6: #6f9698;
    }
  }
  :root[data-theme="dark"] {
    --bg: hsl(250 26% 7%);
    --surface: hsl(250 22% 10%);
    --surface-line: hsl(250 18% 20%);
    --well: hsl(250 26% 5%);
    --well-floor: hsl(250 30% 3%);
    --ink: hsl(250 22% 93%);
    --ink-dim: hsl(250 12% 66%);
    --ink-faint: hsl(250 10% 44%);
    --accent: #e08a44;
    --accent-ink: #1a0f06;
    --accent-glow: rgba(224, 138, 68, 0.35);
    --rim: rgba(224, 138, 68, 0.45);

    --note-1: #d98a52;
    --note-2: #c7818c;
    --note-3: #85a273;
    --note-4: #7a93bf;
    --note-5: #b9814f;
    --note-6: #6f9698;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a:focus-visible, button:focus-visible, input:focus-visible, label:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  header {
    padding: 28px clamp(16px, 4vw, 40px) 18px;
    border-bottom: 1px solid var(--surface-line);
    background: var(--surface);
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 20px 32px;
  }

  .title-block { margin-right: auto; }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 4vw, 38px);
    margin: 0 0 4px;
    letter-spacing: 0.04em;
    text-wrap: balance;
  }
  .subtitle {
    margin: 0;
    color: var(--ink-dim);
    font-size: 13.5px;
    max-width: 46ch;
    line-height: 1.6;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 18px 26px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field .label-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }
  .field .readout {
    font-family: var(--font-mono);
    color: var(--ink-dim);
    font-size: 11px;
  }

  input[type="range"] {
    width: 130px;
    accent-color: var(--accent);
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.03em;
    border: 1px solid var(--surface-line);
    background: transparent;
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
  .btn.primary[aria-pressed="true"] { filter: brightness(0.92); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-file {
    position: relative;
    overflow: hidden;
  }
  .btn-file input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .source-row {
    display: flex;
    gap: 8px;
  }

  .legend {
    padding: 12px clamp(16px, 4vw, 40px);
    background: var(--surface);
    border-bottom: 1px solid var(--surface-line);
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
    overflow-x: auto;
    min-height: 20px;
  }
  .legend:empty { display: none; }
  .chip {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--ink-dim);
    background: var(--bg);
    border: 1px solid var(--surface-line);
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    font-family: var(--font-mono);
    white-space: nowrap;
  }
  .chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex: none;
  }

  main {
    flex: 1;
    display: flex;
    padding: clamp(16px, 3vw, 32px);
  }

  .box-frame {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 340px;
  }

  .rim {
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--rim) 20%, var(--rim) 80%, transparent);
    box-shadow: 0 0 18px 1px var(--accent-glow);
    margin-bottom: 0;
    flex: none;
  }

  .box-well {
    position: relative;
    flex: 1;
    background: linear-gradient(180deg, var(--well) 0%, var(--well-floor) 100%);
    border-left: 1px solid var(--surface-line);
    border-right: 1px solid var(--surface-line);
    border-bottom: 3px solid var(--surface-line);
    border-radius: 0 0 14px 14px;
    overflow: hidden;
  }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink-faint);
    font-size: 14px;
    padding: 20px;
    pointer-events: none;
  }

  .note-block {
    position: absolute;
    height: 14px;
    border-radius: 3px;
    border: 1.5px solid var(--c, var(--accent));
    background: color-mix(in srgb, var(--c, var(--accent)) 18%, transparent);
    transition: top 0.55s cubic-bezier(0.32, 0.72, 0.24, 1), opacity 0.4s ease, transform 0.4s ease;
    opacity: 0;
  }
  .note-block.settled {
    box-shadow: none;
  }
  .note-block.spawning {
    box-shadow: 0 0 10px 1px var(--c, var(--accent));
  }
  .note-block.collapsing {
    transition: opacity 0.6s ease, transform 0.6s ease;
    opacity: 0 !important;
    transform: scale(0.7);
  }

  footer {
    padding: 10px clamp(16px, 4vw, 40px) 20px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-faint);
  }
  footer .flash {
    color: var(--accent);
  }
</style>

<header>
  <div class="title-block">
    <h1>リズム箱</h1>
    <p class="subtitle">フォルダを選ぶと、その中の音をランダムに鳴らします。音の長さがそのまま空の音符になり、幾重にも重なって箱の中に積もっていきます。</p>
  </div>

  <div class="controls">
    <div class="field">
      <span class="label-row"><span>音源</span></span>
      <div class="source-row">
        <label class="btn btn-file" id="folderLabel">
          フォルダを選ぶ
          <input type="file" id="folderInput" webkitdirectory directory multiple aria-label="音声ファイルが入ったフォルダを選択">
        </label>
        <label class="btn btn-file" id="filesLabel">
          ファイルを選ぶ
          <input type="file" id="filesInput" multiple aria-label="音声ファイルを直接選択">
        </label>
      </div>
    </div>

    <div class="field">
      <span class="label-row"><span>密度</span><span class="readout" id="densityReadout">—</span></span>
      <input type="range" id="densitySlider" min="0" max="100" value="45" aria-label="音が鳴る密度">
    </div>

    <div class="field">
      <span class="label-row"><span>音量</span><span class="readout" id="volumeReadout">70%</span></span>
      <input type="range" id="volumeSlider" min="0" max="100" value="70" aria-label="音量">
    </div>

    <div class="field">
      <span class="label-row">&nbsp;</span>
      <button class="btn primary" id="playBtn" aria-pressed="false" disabled>再生開始</button>
    </div>

    <div class="field">
      <span class="label-row">&nbsp;</span>
      <button class="btn" id="clearBtn">箱を空にする</button>
    </div>
  </div>
</header>

<div class="legend" id="legend" aria-label="読み込んだ音声ファイル"></div>

<main>
  <div class="box-frame">
    <div class="rim" aria-hidden="true"></div>
    <div class="box-well" id="boxWell">
      <div class="placeholder" id="placeholder">まだ音がありません。<br>上の「フォルダを選ぶ」でフォルダごと、または「ファイルを選ぶ」でwav・mp3などを直接指定してください。</div>
    </div>
  </div>
</main>

<footer>
  <span id="status" aria-live="polite">待機中</span>
  <span id="stored">収納された音: 0</span>
</footer>

<script>
(() => {
  const folderInput = document.getElementById('folderInput');
  const folderLabel = document.getElementById('folderLabel');
  const filesInput = document.getElementById('filesInput');
  const legend = document.getElementById('legend');
  const playBtn = document.getElementById('playBtn');
  const clearBtn = document.getElementById('clearBtn');
  const densitySlider = document.getElementById('densitySlider');
  const densityReadout = document.getElementById('densityReadout');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeReadout = document.getElementById('volumeReadout');
  const boxWell = document.getElementById('boxWell');
  const placeholder = document.getElementById('placeholder');
  const statusEl = document.getElementById('status');
  const storedEl = document.getElementById('stored');

  const PALETTE = ['--note-1', '--note-2', '--note-3', '--note-4', '--note-5', '--note-6'];
  const AUDIO_EXT = /\.(mp3|wav|ogg|m4a|flac|aac|webm|aiff|aif|opus)$/i;
  const COLS = 26;
  const STEP = 16;
  const BLOCK_H = 14;
  const MIN_W = 22;
  const MAX_W = 150;

  let audioCtx = null;
  let masterGain = null;
  let files = [];
  let isPlaying = false;
  let schedulerId = null;
  let storedCount = 0;
  let skyline = new Array(COLS).fill(0);
  let liveBlocks = [];
  let colWidth = 0;

  function hashColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  function setStatus(text) { statusEl.textContent = text; }

  function ensureAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = Number(volumeSlider.value) / 100;
      masterGain.connect(audioCtx.destination);
    }
    return audioCtx;
  }

  volumeSlider.addEventListener('input', () => {
    volumeReadout.textContent = volumeSlider.value + '%';
    if (masterGain) masterGain.gain.value = Number(volumeSlider.value) / 100;
  });

  function densityToGap(v) {
    const min = 1300 - (v / 100) * 1220;
    return { min, max: min * 1.8 };
  }
  function updateDensityReadout() {
    const { min, max } = densityToGap(Number(densitySlider.value));
    densityReadout.textContent = '~' + Math.round((min + max) / 2) + 'ms';
  }
  densitySlider.addEventListener('input', updateDensityReadout);
  updateDensityReadout();

  async function loadFiles(rawList) {
    const list = Array.from(rawList || []).filter(f =>
      (f.type && f.type.startsWith('audio/')) || AUDIO_EXT.test(f.name)
    );
    if (!list.length) {
      setStatus('音声ファイルが見つかりませんでした(wav, mp3, ogg, m4a, flac, aac に対応)');
      return;
    }
    playBtn.disabled = true;
    setStatus('読み込み中… 0/' + list.length);
    ensureAudioContext();

    files = [];
    legend.innerHTML = '';
    let loaded = 0;
    for (const f of list) {
      const colorVar = hashColor(f.name);
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = '<span class="dot" style="background:var(' + colorVar + ')"></span>' +
        f.name.replace(/\.[^.]+$/, '');
      legend.appendChild(chip);

      try {
        const buf = await f.arrayBuffer();
        const decoded = await audioCtx.decodeAudioData(buf.slice(0));
        files.push({ name: f.name, buffer: decoded, colorVar });
      } catch (err) {
        chip.style.opacity = '0.4';
        chip.title = '読み込めませんでした';
      }
      loaded++;
      setStatus('読み込み中… ' + loaded + '/' + list.length);
    }

    if (files.length) {
      placeholder.style.display = 'none';
      playBtn.disabled = false;
      setStatus(files.length + ' 個の音を読み込みました');
    } else {
      setStatus('読み込みに失敗しました');
    }
  }

  folderInput.addEventListener('change', (e) => loadFiles(e.target.files));
  filesInput.addEventListener('change', (e) => loadFiles(e.target.files));

  function measureWell() {
    colWidth = boxWell.clientWidth / COLS;
  }
  window.addEventListener('resize', () => { measureWell(); });

  function collapseBox() {
    liveBlocks.forEach(el => el.classList.add('collapsing'));
    const toRemove = liveBlocks;
    liveBlocks = [];
    skyline = new Array(COLS).fill(0);
    setTimeout(() => { toRemove.forEach(el => el.remove()); }, 650);
    setStatus('箱がいっぱいになり、空になりました');
  }

  clearBtn.addEventListener('click', () => {
    liveBlocks.forEach(el => el.classList.add('collapsing'));
    const toRemove = liveBlocks;
    liveBlocks = [];
    skyline = new Array(COLS).fill(0);
    storedCount = 0;
    storedEl.textContent = '収納された音: 0';
    setTimeout(() => { toRemove.forEach(el => el.remove()); }, 650);
    setStatus('箱を空にしました');
  });

  function mapDurationToWidth(dur) {
    const clamped = Math.max(0.05, Math.min(dur, 5));
    const t = Math.log(clamped / 0.05) / Math.log(5 / 0.05);
    return MIN_W + t * (MAX_W - MIN_W);
  }

  function spawnBlock(file, duration) {
    if (!colWidth) measureWell();
    const wellH = boxWell.clientHeight;
    const widthPx = mapDurationToWidth(duration);
    const spanCols = Math.max(1, Math.min(COLS, Math.round(widthPx / colWidth)));
    const startCol = Math.floor(Math.random() * (COLS - spanCols + 1));

    let peak = 0;
    for (let i = startCol; i < startCol + spanCols; i++) peak = Math.max(peak, skyline[i]);
    const landingBottom = peak;

    if (landingBottom + STEP > wellH - 4) {
      collapseBox();
      for (let i = startCol; i < startCol + spanCols; i++) skyline[i] = 0;
    }

    const finalPeak = (() => {
      let p = 0;
      for (let i = startCol; i < startCol + spanCols; i++) p = Math.max(p, skyline[i]);
      return p;
    })();

    const finalTop = wellH - finalPeak - STEP;

    const el = document.createElement('div');
    el.className = 'note-block spawning';
    el.style.setProperty('--c', 'var(' + file.colorVar + ')');
    el.style.left = (startCol * colWidth + 1) + 'px';
    el.style.width = (spanCols * colWidth - 2) + 'px';
    el.style.height = BLOCK_H + 'px';
    el.style.top = '-' + STEP + 'px';
    el.style.opacity = '0';
    boxWell.appendChild(el);
    liveBlocks.push(el);

    requestAnimationFrame(() => {
      el.style.opacity = '1';
      el.style.top = Math.max(0, finalTop) + 'px';
    });
    el.addEventListener('transitionend', function onEnd(ev) {
      if (ev.propertyName !== 'top') return;
      el.classList.remove('spawning');
      el.classList.add('settled');
      el.removeEventListener('transitionend', onEnd);
    });

    for (let i = startCol; i < startCol + spanCols; i++) {
      skyline[i] = finalPeak + STEP;
    }

    storedCount++;
    storedEl.textContent = '収納された音: ' + storedCount;
  }

  function playNote(file) {
    const src = audioCtx.createBufferSource();
    src.buffer = file.buffer;
    src.playbackRate.value = 0.98 + Math.random() * 0.04;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.7 + Math.random() * 0.3;
    src.connect(gain).connect(masterGain);
    src.start();
    setStatus('再生中: ' + file.name.replace(/\.[^.]+$/, ''));
    spawnBlock(file, file.buffer.duration);
  }

  function scheduleNext() {
    if (!isPlaying) return;
    const ready = files.filter(f => f.buffer);
    if (ready.length) {
      const file = ready[Math.floor(Math.random() * ready.length)];
      playNote(file);
    }
    const { min, max } = densityToGap(Number(densitySlider.value));
    const gap = min + Math.random() * (max - min);
    schedulerId = setTimeout(scheduleNext, gap);
  }

  playBtn.addEventListener('click', async () => {
    ensureAudioContext();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    if (!isPlaying) {
      isPlaying = true;
      playBtn.textContent = '停止';
      playBtn.setAttribute('aria-pressed', 'true');
      measureWell();
      scheduleNext();
    } else {
      isPlaying = false;
      playBtn.textContent = '再生開始';
      playBtn.setAttribute('aria-pressed', 'false');
      clearTimeout(schedulerId);
      setStatus('停止しました');
    }
  });

  measureWell();
})();
</script>

</body></html>
