<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>hibana — realtime input instrument</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg"></canvas>

  <main class="ui">
    <header>
      <h1>hibana <span class="sub">ひばな</span></h1>
      <p class="tagline">触れる、叩く、なぞる。すべての入力がそのまま音と光になる、その場限りの楽器。</p>
    </header>

    <div class="transport">
      <button id="paletteBtn" class="ghostBtn">配色を変える</button>
      <label class="volume">
        <span>音量 <em>volume</em></span>
        <input id="volume" type="range" min="0" max="100" value="70" />
      </label>
    </div>

    <p class="hint" id="hint">
      キーボードの2段(<code>qwertyuiop</code> / <code>asdfghjkl;</code>)を叩くか、
      クリックしたまま動かして音の高さと明るさをなぞって。
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
