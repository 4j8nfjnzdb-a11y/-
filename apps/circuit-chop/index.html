<meta charset="UTF-8" />
<title>CIRCUIT CHOP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
<style>
:root {
  --bg: #0a0b0f;
  --panel: #13161c;
  --panel2: #191d25;
  --line: #262b35;
  --ink: #e9ecf1;
  --ink-dim: #838da0;
  --accent: #45d9bd;
  --accent2: #ff7a5c;
  --accent3: #b78bff;
  --accent4: #ffc65c;
  --accent5: #4fb8ff;
  --accent6: #ff5fa2;
  --accent7: #9be564;
  --mod: #f042ff;
  --danger: #ff5d72;
  --font-mono: "IBM Plex Mono", "Noto Sans JP", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px;
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
}

html, body {
  margin: 0;
  padding: 0;
  color: var(--ink);
  font-family: var(--font-jp);
}

body {
  background:
    radial-gradient(1100px 560px at 12% -8%, rgba(69, 217, 189, 0.06), transparent 60%),
    radial-gradient(900px 520px at 102% 6%, rgba(255, 122, 92, 0.045), transparent 55%),
    radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px) 0 0 / 22px 22px,
    var(--bg);
  background-attachment: fixed;
}

button {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.03em;
  padding: 0.5rem 0.9rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, transform 0.1s, box-shadow 0.2s;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:active { transform: translateY(1px); }
button.ghostBtn { background: transparent; color: var(--ink-dim); }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 3px;
  background: var(--line);
  border-radius: 999px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(69, 217, 189, 0.65);
}
input[type="range"]::-moz-range-thumb {
  width: 11px; height: 11px; border: none; border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

select, input[type="number"] {
  font-family: var(--font-mono);
  background: var(--panel2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0.3rem 0.4rem;
  font-size: 0.75rem;
}
select:focus-visible, input[type="number"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- topbar ---- */

.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.9rem 1.4rem;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(10, 11, 15, 0.88);
  backdrop-filter: blur(8px);
  z-index: 20;
}

.topbar h1 {
  font-family: var(--font-mono);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: 0.55rem;
}
.led {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px 1px rgba(69, 217, 189, 0.9);
  align-self: center;
  animation: ledPulse 2.6s ease-in-out infinite;
  flex: none;
}
@keyframes ledPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 6px 1px rgba(69, 217, 189, 0.9); }
  50% { opacity: 0.55; box-shadow: 0 0 3px 0px rgba(69, 217, 189, 0.5); }
}
.topbar h1 .sub {
  display: block;
  font-family: var(--font-jp);
  font-size: 0.68rem;
  font-weight: 400;
  color: var(--ink-dim);
  margin-top: 0.15rem;
  letter-spacing: 0.02em;
}

.transport {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.playBtn {
  background: rgba(69, 217, 189, 0.14);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.playBtn.playing {
  background: rgba(255, 122, 92, 0.14);
  border-color: var(--accent2);
  color: var(--accent2);
}

.bpmField, .mixField {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--ink-dim);
  letter-spacing: 0.04em;
}
.bpmField input { width: 4rem; font-variant-numeric: tabular-nums; }
.mixField input { width: 7rem; }

.meter {
  width: 5rem;
  height: 6px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.meterBar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent4));
  transition: width 0.05s linear;
}

main {
  padding: 1.2rem 1.4rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.6rem;
  max-width: 1500px;
  margin: 0 auto;
}

/* ---- slots ---- */

.slots {
  display: grid;
  grid-template-columns: repeat(4, minmax(260px, 1fr));
  gap: 0.9rem;
}
@media (max-width: 1100px) {
  .slots { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 620px) {
  .slots { grid-template-columns: 1fr; }
}

@keyframes bootIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.slot {

<script type="text/plain" id="glitch-worklet-src">
// GlitchProcessor — a Pure-Data-style live re-slicer.
//
// It continuously records its input into a rolling ring buffer, and on
// every step of an internal clock decides where to read from next,
// according to `mode`:
//   through  - plain pass-through (bypass)
//   chop     - retrigger the most recent window at the start of every step
//              (classic gated buffer-chop)
//   stutter  - latch one short window and repeat it, occasionally
//              relatching to a newer window
//   random   - jump to a random point in recent history each step,
//              forward or backward
//   reverse  - replay the most recent window backwards
//   freeze   - grab one grain once and loop it until the mode changes
//
// Params (sent via port.postMessage({...})): mode, stepSec, gate (0..1
// audible fraction of the step), probability (0..1 chance a step plays
// at all), jitter (0..1 randomises the read start point), mix (0..1
// dry/wet).

const MAX_SECONDS = 2.5;
const FADE_SAMPLES = 48;

class GlitchProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.bufLen = Math.ceil(sampleRate * MAX_SECONDS);
    this.ring = [new Float32Array(this.bufLen), new Float32Array(this.bufLen)];
    this.clock = 0;
    this.stepSamples = Math.round(sampleRate * 0.125);
    this.currentStepIndex = -1;
    this.sliceStart = 0;
    this.direction = 1;
    this.stepAudible = true;
    this.latchOffset = 0;
    this.hasLatched = false;

    this.params = {
      mode: "through",
      gate: 0.85,
      probability: 1,
      jitter: 0,
      mix: 1,
    };
    this.prevMode = "through";

    this.port.onmessage = (e) => {
      const msg = e.data || {};
      if (typeof msg.stepSec === "number" && msg.stepSec > 0.002) {
        this.stepSamples = Math.max(64, Math.round(sampleRate * msg.stepSec));
      }
      Object.assign(this.params, msg);
    };
  }

  wrap(pos) {
    const m = this.bufLen;
    return ((Math.floor(pos) % m) + m) % m;
  }

  onStepBoundary() {
    const p = this.params;
    const modeChanged = p.mode !== this.prevMode;
    this.prevMode = p.mode;

    this.stepAudible = Math.random() < p.probability;

    const jitterSamples = p.jitter * this.stepSamples * 0.5 * (Math.random() * 2 - 1);
    const recent = this.clock - this.stepSamples;
    const maxLookback = this.bufLen - this.stepSamples - 8;

    switch (p.mode) {
      case "stutter": {
        const shouldRelatch = !this.hasLatched || modeChanged || Math.random() > p.probability + 0.05;
        if (shouldRelatch) {
          this.latchOffset = recent + jitterSamples;
          this.hasLatched = true;
        }
        this.sliceStart = this.latchOffset;
        this.direction = 1;
        break;
      }
      case "chop": {
        this.sliceStart = recent + jitterSamples;
        this.direction = 1;
        break;
      }
      case "random": {
        const lookback = Math.random() * Math.max(1, maxLookback);
        this.sliceStart = this.clock - this.stepSamples - lookback;
        this.direction = Math.random() < 0.5 ? -1 : 1;
        break;
      }
      case "reverse": {
        this.sliceStart = this.clock;
        this.direction = -1;
        break;
      }
      case "freeze": {
        if (!this.hasLatched || modeChanged) {
          this.latchOffset = recent;
          this.hasLatched = true;
        }
        this.sliceStart = this.latchOffset;
        this.direction = 1;
        break;
      }
      default:
        this.hasLatched = false;
        break;
    }
  }

  readRing(ch, pos) {
    return this.ring[ch][this.wrap(pos)];
  }

  process(inputs, outputs) {
    const input = inputs[0];
    const output = outputs[0];
    if (!output || output.length === 0) return true;

    const chCount = Math.max(1, output.length);
    const inCh0 = input && input[0] ? input[0] : null;
    const inCh1 = input && input[1] ? input[1] : inCh0;
    const frames = output[0].length;
    const p = this.params;

    for (let i = 0; i < frames; i++) {
      const stepIndex = Math.floor(this.clock / this.stepSamples);
      if (stepIndex !== this.currentStepIndex) {
        this.currentStepIndex = stepIndex;
        this.onStepBoundary();
      }

      const s0 = inCh0 ? inCh0[i] : 0;
      const s1 = inCh1 ? inCh1[i] : s0;
      this.ring[0][this.wrap(this.clock)] = s0;
      this.ring[1][this.wrap(this.clock)] = s1;

      let wet0 = s0, wet1 = s1;

      if (p.mode !== "through") {
        const sampleInStep = this.clock - this.currentStepIndex * this.stepSamples;
        const gateSamples = this.stepSamples * Math.max(0.02, p.gate);
        const audible = this.stepAudible && sampleInStep < gateSamples;

        if (audible) {
          const readPos = this.sliceStart + this.direction * sampleInStep;
          wet0 = this.readRing(0, readPos);
          wet1 = this.readRing(1, readPos);

          if (sampleInStep < FADE_SAMPLES) {
            const g = sampleInStep / FADE_SAMPLES;
            wet0 *= g; wet1 *= g;
          } else if (gateSamples - sampleInStep < FADE_SAMPLES) {
            const g = Math.max(0, (gateSamples - sampleInStep) / FADE_SAMPLES);
            wet0 *= g; wet1 *= g;
          }
        } else {
          wet0 = 0; wet1 = 0;
        }
      }

      const mix = p.mix;
      const out0 = s0 * (1 - mix) + wet0 * mix;
      const out1 = s1 * (1 - mix) + wet1 * mix;

      for (let ch = 0; ch < chCount; ch++) {
        output[ch][i] = ch === 0 ? out0 : out1;
      }

      this.clock++;
    }

    return true;
  }
}

registerProcessor("glitch-processor", GlitchProcessor);

// CrushProcessor — bit-depth quantization + sample-and-hold rate reduction,
// the other classic IDM texture: dirty, aliased, stepped.
class CrushProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.params = { bits: 8, hold: 4, mix: 1 };
    this.holdCounter = 0;
    this.held = [0, 0];
    this.port.onmessage = (e) => Object.assign(this.params, e.data || {});
  }

  quantize(x) {
    const levels = Math.pow(2, Math.max(1, Math.min(16, this.params.bits)));
    return Math.round(x * levels) / levels;
  }

  process(inputs, outputs) {
    const input = inputs[0];
    const output = outputs[0];
    if (!output || output.length === 0) return true;
    const inCh0 = input && input[0] ? input[0] : null;
    const inCh1 = input && input[1] ? input[1] : inCh0;
    const frames = output[0].length;
    const hold = Math.max(1, Math.round(this.params.hold));
    const mix = this.params.mix;

    for (let i = 0; i < frames; i++) {
      const s0 = inCh0 ? inCh0[i] : 0;
      const s1 = inCh1 ? inCh1[i] : s0;

      if (this.holdCounter === 0) {
        this.held[0] = this.quantize(s0);
        this.held[1] = this.quantize(s1);
      }
      this.holdCounter = (this.holdCounter + 1) % hold;

      const out0 = s0 * (1 - mix) + this.held[0] * mix;
      const out1 = s1 * (1 - mix) + this.held[1] * mix;
      for (let ch = 0; ch < output.length; ch++) {
        output[ch][i] = ch === 0 ? out0 : out1;
      }
    }
    return true;
  }
}

registerProcessor("crush-processor", CrushProcessor);

// PitchProcessor — a granular ("PSOLA-lite") pitch shifter. Two grains,
// phase-offset by half a window, each read the rolling ring buffer at a
// sped-up/slowed-down rate and are triangle-windowed so their sum stays
// roughly constant in loudness across the grain boundary jumps.
const PITCH_MAX_SECONDS = 1.5;

class PitchProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.bufLen = Math.ceil(sampleRate * PITCH_MAX_SECONDS);
    this.ring = [new Float32Array(this.bufLen), new Float32Array(this.bufLen)];
    this.writePos = 0;
    this.grainSize = Math.round(sampleRate * 0.08);
    this.age = [0, Math.floor(this.grainSize / 2)];
    this.readPos = [0, 0];
    this.params = { semitones: 0, mix: 1 };
    this.port.onmessage = (e) => Object.assign(this.params, e.data || {});
  }

  wrap(pos) {
    const m = this.bufLen;
    return ((Math.floor(pos) % m) + m) % m;
  }

  process(inputs, outputs) {
    const input = inputs[0];
    const output = outputs[0];
    if (!output || output.length === 0) return true;
    const inCh0 = input && input[0] ? input[0] : null;
    const inCh1 = input && input[1] ? input[1] : inCh0;
    const frames = output[0].length;
    const rate = Math.pow(2, this.params.semitones / 12);
    const g = this.grainSize;
    const mix = this.params.mix;

    for (let i = 0; i < frames; i++) {
      const s0 = inCh0 ? inCh0[i] : 0;
      const s1 = inCh1 ? inCh1[i] : s0;
      this.ring[0][this.wrap(this.writePos)] = s0;
      this.ring[1][this.wrap(this.writePos)] = s1;

      let wet0 = 0, wet1 = 0;
      for (let k = 0; k < 2; k++) {
        this.age[k] += 1;
        this.readPos[k] += rate;
        if (this.age[k] >= g) {
          this.age[k] = 0;
          this.readPos[k] = this.writePos - g;
        }
        const win = 1 - Math.abs((this.age[k] / g) * 2 - 1);
        const rp = this.wrap(this.readPos[k]);
        wet0 += this.ring[0][rp] * win;
        wet1 += this.ring[1][rp] * win;
      }

      const out0 = s0 * (1 - mix) + wet0 * mix;
      const out1 = s1 * (1 - mix) + wet1 * mix;
      for (let ch = 0; ch < output.length; ch++) {
        output[ch][i] = ch === 0 ? out0 : out1;
      }

      this.writePos++;
    }

    return true;
  }
}

registerProcessor("pitch-processor", PitchProcessor);
</script>

<script>
(function () {
  "use strict";

  // ================= audioEngine =================

  const engine = {
    ctx: null,
    master: null,
    compressor: null,
    reverbBus: null,
    reverbNode: null,
    analyser: null,
    analyserData: null,
    glitchWorkletReady: false,
    bpm: 120,
    running: false,
  };

  function buildImpulseResponse(ctx, duration, decay) {
    const rate = ctx.sampleRate;
    const length = Math.max(1, Math.floor(rate * duration));
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const t = i / length;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return impulse;
  }

  async function initAudioEngine() {
    if (engine.ctx) return engine;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    engine.ctx = ctx;

    const master = ctx.createGain();
    master.gain.value = 0.85;
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -16;
    compressor.ratio.value = 3.5;
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    engine.analyser = analyser;
    engine.analyserData = new Float32Array(analyser.fftSize);

    master.connect(compressor).connect(analyser).connect(ctx.destination);
    engine.master = master;
    engine.compressor = compressor;

    const reverbBus = ctx.createGain();
    reverbBus.gain.value = 1;
    const reverbNode = ctx.createConvolver();
    reverbNode.buffer = buildImpulseResponse(ctx, 3.2, 2.6);
    reverbBus.connect(reverbNode).connect(master);
    engine.reverbBus = reverbBus;
    engine.reverbNode = reverbNode;

    try {
      const workletSrc = document.getElementById("glitch-worklet-src").textContent;
      const blob = new Blob([workletSrc], { type: "application/javascript" });
      const url = URL.createObjectURL(blob);
      await ctx.audioWorklet.addModule(url);
      engine.glitchWorkletReady = true;
    } catch (err) {
      console.warn("Glitch worklet failed to load; GLITCH/CRUSH/PITCH boxes will be silent passthrough.", err);
      engine.glitchWorkletReady = false;
    }

    return engine;
  }

  async function resumeEngine() {
    if (!engine.ctx) await initAudioEngine();
    if (engine.ctx.state === "suspended") await engine.ctx.resume();
  }

  function stepSeconds(division) {
    const beat = 60 / engine.bpm;
    const map = {
      "1/4": beat,
      "1/8": beat / 2,
      "1/8d": (beat / 2) * 1.5,
      "1/8t": (beat / 2) * (2 / 3),
      "1/16": beat / 4,
      "1/16t": (beat / 4) * (2 / 3),
      "1/32": beat / 8,
    };
    return map[division] ?? beat / 4;
  }

  function readMeterLevel() {
    if (!engine.analyser) return 0;
    engine.analyser.getFloatTimeDomainData(engine.analyserData);
    let sum = 0;
    for (let i = 0; i < engine.analyserData.length; i++) {
      sum += engine.analyserData[i] * engine.analyserData[i];
    }
    return Math.sqrt(sum / engine.analyserData.length);
  }

  // ================= synthSamples =================

  function noiseBuffer(ctx, seconds) {
    const length = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, length, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  async function render(seconds, build) {
    const sr = 44100;
    const off = new OfflineAudioContext(1, Math.ceil(sr * seconds), sr);
    build(off);
    return off.startRendering();
  }

  async function synthKick() {
    return render(0.5, (ctx) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(150, 0);
      osc.frequency.exponentialRampToValueAtTime(40, 0.14);
      gain.gain.setValueAtTime(1, 0);
      gain.gain.exponentialRampToValueAtTime(0.001, 0.42);
      osc.connect(gain).connect(ctx.destination);
      osc.start(0);
      osc.stop(0.45);
    });
  }

  async function synthSnare() {
    return render(0.4, (ctx) => {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(ctx, 0.4);
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 1800;
      bp.Q.value = 0.6;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(1, 0);
      ng.gain.exponentialRampToValueAtTime(0.001, 0.22);
      src.connect(bp).connect(ng).connect(ctx.destination);

      const osc = ctx.createOscillator();
      osc.type = "triangle";
      osc.frequency.value = 180;
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.6, 0);
      og.gain.exponentialRampToValueAtTime(0.001, 0.12);
      osc.connect(og).connect(ctx.destination);

      src.start(0);
      osc.start(0);
      osc.stop(0.15);
    });
  }

  async function synthHat(open) {
    const dur = open ? 0.5 : 0.12;
    return render(dur, (ctx) => {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(ctx, dur);
      const hp = ctx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 7000;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.9, 0);
      g.gain.exponentialRampToValueAtTime(0.001, dur);
      src.connect(hp).connect(g).connect(ctx.destination);
      src.start(0);
    });
  }

  async function synthPerc() {
    return render(0.35, (ctx) => {
      const osc = ctx.createOscillator();
      osc.type = "square";
      osc.frequency.setValueAtTime(900, 0);
      osc.frequency.exponentialRampToValueAtTime(220, 0.09);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.5, 0);
      g.gain.exponentialRampToValueAtTime(0.001, 0.18);
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 1200;
      osc.connect(bp).connect(g).connect(ctx.destination);
      osc.start(0);
      osc.stop(0.2);
    });
  }

  const DEFAULT_SAMPLE_BUILDERS = [
    { name: "kick.synth", build: synthKick },
    { name: "snare.synth", build: synthSnare },
    { name: "hat-closed.synth", build: () => synthHat(false) },
    { name: "hat-open.synth", build: () => synthHat(true) },
    { name: "perc.synth", build: synthPerc },
  ];

  async function makeDefaultSample(index) {
    const def = DEFAULT_SAMPLE_BUILDERS[index % DEFAULT_SAMPLE_BUILDERS.length];
    const buffer = await def.build();
    return { name: def.name, buffer };
  }

  async function makeRandomDefaultSample() {
    const i = Math.floor(Math.random() * DEFAULT_SAMPLE_BUILDERS.length);
    return makeDefaultSample(i);
  }

  // ================= boxes =================

  let nextBoxId = 1;
  const DIVISIONS = ["1/4", "1/8", "1/8d", "1/8t", "1/16", "1/16t", "1/32"];
  const pct = (v) => `${Math.round(v * 100)}%`;

  function makeGlitchBox() {
    const ctx = engine.ctx;
    const node = engine.glitchWorkletReady
      ? new AudioWorkletNode(ctx, "glitch-processor", {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [2],
          channelCount: 2,
          channelCountMode: "explicit",
        })
      : ctx.createGain();

    const state = { mode: "chop", division: "1/16", gate: 0.8, probability: 1, jitter: 0.15, mix: 1 };

    function push() {
      if (!(node instanceof AudioWorkletNode)) return;
      node.port.postMessage({
        mode: state.mode,
        stepSec: stepSeconds(state.division),
        gate: state.gate,
        probability: state.probability,
        jitter: state.jitter,
        mix: state.mix,
      });
    }
    push();

    return {
      type: "glitch",
      title: "GLITCH",
      input: node,
      output: node,
      modTargetKey: "probability",
      paramDefs: [
        { key: "mode", label: "モード", type: "select", options: ["chop", "stutter", "random", "reverse", "freeze", "through"] },
        { key: "division", label: "レート", type: "select", options: DIVISIONS },
        { key: "gate", label: "ゲート", type: "range", min: 0.05, max: 1, step: 0.01, format: pct },
        { key: "probability", label: "確率", type: "range", min: 0, max: 1, step: 0.01, format: pct },
        { key: "jitter", label: "ジッター", type: "range", min: 0, max: 1, step: 0.01, format: pct },
        { key: "mix", label: "MIX", type: "range", min: 0, max: 1, step: 0.01, format: pct },
      ],
      getParam: (k) => state[k],
      setParam(k, v) { state[k] = v; push(); },
      dispose() { if (node.disconnect) node.disconnect(); },
    };
  }

  function makeFilterBox() {
    const ctx = engine.ctx;
    const node = ctx.createBiquadFilter();
    node.type = "lowpass";
    node.frequency.value = 1800;
    node.Q.value = 0.7;
    const state = { filterType: "lowpass", freq: 1800, q: 0.7 };

    return {
      type: "filter",
      title: "FILTER",
      input: node,
      output: node,
      modTargetKey: "freq",
      paramDefs: [
        { key: "filterType", label: "種類", type: "select", options: ["lowpass", "highpass", "bandpass", "notch"] },
        { key: "freq", label: "周波数", type: "range", min: 80, max: 12000, step: 10, format: (v) => `${Math.round(v)}Hz` },
        { key: "q", label: "Q", type: "range", min: 0.1, max: 18, step: 0.1 },
      ],
      getParam: (k) => state[k],
      setParam(k, v) {
        state[k] = v;
        if (k === "filterType") node.type = v;
        if (k === "freq") node.frequency.setTargetAtTime(v, ctx.currentTime, 0.01);
        if (k === "q") node.Q.setTargetAtTime(v, ctx.currentTime, 0.01);
      },
      dispose() { node.disconnect(); },
    };
  }

  function makeCrushBox() {
    const ctx = engine.ctx;
    const node = engine.glitchWorkletReady
      ? new AudioWorkletNode(ctx, "crush-processor", {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [2],
          channelCount: 2,
          channelCountMode: "explicit",
        })
      : ctx.createGain();

    const state = { bits: 6, hold: 6, mix: 1 };
    function push() {
      if (!(node instanceof AudioWorkletNode)) return;
      node.port.postMessage(state);
    }
    push();

    return {
      type: "crush",
      title: "CRUSH",
      input: node,
      output: node,
      modTargetKey: "hold",
      paramDefs: [
        { key: "bits", label: "ビット深度", type: "range", min: 1, max: 16, step: 1, format: (v) => `${v}bit` },
        { key: "hold", label: "サンプル間引き", type: "range", min: 1, max: 40, step: 1, format: (v) => `x${Math.round(v)}` },
        { key: "mix", label: "MIX", type: "range", min: 0, max: 1, step: 0.01, format: pct },
      ],
      getParam: (k) => state[k],
      setParam(k, v) { state[k] = v; push(); },
      dispose() { if (node.disconnect) node.disconnect(); },
    };
  }

  function makeDelayBox() {
    const ctx = engine.ctx;
    const inputGain = ctx.createGain();
    const outputGain = ctx.createGain();
    const dryGain = ctx.createGain();
    const wetGain = ctx.createGain();
    const feedbackGain = ctx.createGain();
    const damp = ctx.createBiquadFilter();
    damp.type = "lowpass";
    damp.frequency.value = 3500;
    const delayNode = ctx.createDelay(2.0);
    delayNode.delayTime.value = 0.3;

    inputGain.connect(dryGain).connect(outputGain);
    inputGain.connect(delayNode);
    delayNode.connect(damp).connect(feedbackGain).connect(delayNode);
    delayNode.connect(wetGain).connect(outputGain);

    const state = { division: "1/8d", feedback: 0.4, mix: 0.35 };
    dryGain.gain.value = 1 - state.mix;
    wetGain.gain.value = state.mix;
    feedbackGain.gain.value = state.feedback;

    function applyDivision() {
      delayNode.delayTime.setTargetAtTime(stepSeconds(state.division), ctx.currentTime, 0.01);
    }
    applyDivision();

    return {
      type: "delay",
      title: "DELAY",
      input: inputGain,
      output: outputGain,
      modTargetKey: "feedback",
      paramDefs: [
        { key: "division", label: "レート", type: "select", options: DIVISIONS },
        { key: "feedback", label: "フィードバック", type: "range", min: 0, max: 0.92, step: 0.01, format: pct },
        { key: "mix", label: "MIX", type: "range", min: 0, max: 1, step: 0.01, format: pct },
      ],
      getParam: (k) => state[k],
      setParam(k, v) {
        state[k] = v;
        if (k === "division") applyDivision();
        if (k === "feedback") feedbackGain.gain.setTargetAtTime(v, ctx.currentTime, 0.01);
        if (k === "mix") {
          dryGain.gain.setTargetAtTime(1 - v, ctx.currentTime, 0.01);
          wetGain.gain.setTargetAtTime(v, ctx.currentTime, 0.01);
        }
      },
      dispose() {
        inputGain.disconnect(); outputGain.disconnect(); dryGain.disconnect();
        wetGain.disconnect(); feedbackGain.disconnect(); damp.disconnect(); delayNode.disconnect();
      },
    };
  }

  function buildReverbImpulse(ctx, duration, decay) {
    const rate = ctx.sampleRate;
    const length = Math.max(1, Math.floor(rate * duration));
    const buf = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const t = i / length;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return buf;
  }

  function makeReverbBox() {
    const ctx = engine.ctx;
    const input = ctx.createGain();
    const output = ctx.createGain();
    const dry = ctx.createGain();
    const wet = ctx.createGain();
    const convolver = ctx.createConvolver();
    const damp = ctx.createBiquadFilter();
    damp.type = "lowpass";

    input.connect(dry).connect(output);
    input.connect(convolver).connect(damp).connect(wet).connect(output);

    const state = { size: 2.2, damp: 4500, mix: 0.4 };
    dry.gain.value = 1 - state.mix;
    wet.gain.value = state.mix;
    damp.frequency.value = state.damp;

    let rebuildTimer = null;
    function buildImpulse() { convolver.buffer = buildReverbImpulse(ctx, state.size, 2.5); }
    function scheduleRebuild() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(buildImpulse, 120); }
    buildImpulse();

    return {
      type: "reverb",
      title: "REVERB",
      input,
      output,
      modTargetKey: "size",
      paramDefs: [
        { key: "size", label: "サイズ", type: "range", min: 0.3, max: 6, step: 0.1, format: (v) => `${v.toFixed(1)}s` },
        { key: "damp", label: "ダンプ", type: "range", min: 800, max: 12000, step: 100, format: (v) => `${Math.round(v)}Hz` },
        { key: "mix", label: "MIX", type: "range", min: 0, max: 1, step: 0.01, format: pct },
      ],
      getParam: (k) => state[k],
      setParam(k, v) {
        state[k] = v;
        if (k === "size") scheduleRebuild();
        if (k === "damp") damp.frequency.setTargetAtTime(v, ctx.currentTime, 0.01);
        if (k === "mix") {
          dry.gain.setTargetAtTime(1 - v, ctx.currentTime, 0.01);
          wet.gain.setTargetAtTime(v, ctx.currentTime, 0.01);
        }
      },
      dispose() {
        clearTimeout(rebuildTimer);
        input.disconnect(); output.disconnect(); dry.disconnect();
        wet.disconnect(); convolver.disconnect(); damp.disconnect();
      },
    };
  }

  function makePitchBox() {
    const ctx = engine.ctx;
    const node = engine.glitchWorkletReady
      ? new AudioWorkletNode(ctx, "pitch-processor", {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [2],
          channelCount: 2,
          channelCountMode: "explicit",
        })
      : ctx.createGain();

    const state = { semitones: 5, mix: 1 };
    function push() {
      if (!(node instanceof AudioWorkletNode)) return;
      node.port.postMessage(state);
    }
    push();

    return {
      type: "pitch",
      title: "PITCH",
      input: node,
      output: node,
      modTargetKey: "semitones",
      paramDefs: [
        { key: "semitones", label: "半音", type: "range", min: -12, max: 12, step: 1, format: (v) => `${v >= 0 ? "+" : ""}${Math.round(v)}st` },
        { key: "mix", label: "MIX", type: "range", min: 0, max: 1, step: 0.01, format: pct },
      ],
      getParam: (k) => state[k],
      setParam(k, v) { state[k] = v; push(); },
      dispose() { if (node.disconnect) node.disconnect(); },
    };
  }

  function makeGateBox() {
    const ctx = engine.ctx;
    const gainNode = ctx.createGain();
    gainNode.gain.value = 1;
    const state = { division: "1/8", probability: 0.45, smooth: 8 };
    let nextStepTime = 0;
    let started = false;

    return {
      type: "gate",
      title: "GATE",
      input: gainNode,
      output: gainNode,
      modTargetKey: "probability",
      paramDefs: [
        { key: "division", label: "間隔", type: "select", options: DIVISIONS },
        { key: "probability", label: "開く確率", type: "range", min: 0, max: 1, step: 0.01, format: pct },
        { key: "smooth", label: "なめらかさ", type: "range", min: 1, max: 40, step: 1, format: (v) => `${v}ms` },
      ],
      getParam: (k) => state[k],
      setParam(k, v) { state[k] = v; },
      onTransportStart() { started = false; },
      tick(now, lookahead) {
        if (!started) { nextStepTime = now + 0.02; started = true; }
        while (nextStepTime < now + lookahead) {
          const t = nextStepTime;
          const open = Math.random() < state.probability;
          const smoothSec = Math.max(0.001, state.smooth / 1000);
          gainNode.gain.linearRampToValueAtTime(open ? 1 : 0, t + smoothSec);
          nextStepTime += Math.max(0.02, stepSeconds(state.division));
        }
      },
      dispose() { gainNode.disconnect(); },
    };
  }

  function pseudoRandom(n) {
    const x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function makeModBox() {
    const state = { shape: "drift", division: "1/4", depth: 0.6 };
    let driftValue = Math.random();
    let driftTarget = driftValue;
    let lastStepAt = 0;

    function getValue(t) {
      const period = Math.max(0.05, stepSeconds(state.division) * 4);
      switch (state.shape) {
        case "sine":
          return 0.5 + 0.5 * Math.sin((t / period) * Math.PI * 2);
        case "pulse":
          return (t % period) / period < 0.5 ? 1 : 0;
        case "sh":
          return pseudoRandom(Math.floor(t / period));
        default: {
          if (t - lastStepAt > period * 0.25) {
            lastStepAt = t;
            if (Math.random() < 0.3) driftTarget = Math.random();
          }
          driftValue += (driftTarget - driftValue) * 0.05;
          return driftValue;
        }
      }
    }

    return {
      type: "mod",
      title: "MOD",
      input: null,
      output: null,
      isModSource: true,
      paramDefs: [
        { key: "shape", label: "波形", type: "select", options: ["drift", "sine", "sh", "pulse"] },
        { key: "division", label: "サイクル", type: "select", options: DIVISIONS },
        { key: "depth", label: "深さ", type: "range", min: 0, max: 1, step: 0.01, format: pct },
      ],
      getParam: (k) => state[k],
      setParam(k, v) { state[k] = v; },
      getValue,
      dispose() {},
    };
  }

  const FACTORIES = {
    glitch: makeGlitchBox,
    filter: makeFilterBox,
    crush: makeCrushBox,
    delay: makeDelayBox,
    reverb: makeReverbBox,
    pitch: makePitchBox,
    gate: makeGateBox,
    mod: makeModBox,
  };

  function createBox(type) {
    const factory = FACTORIES[type];
    if (!factory) throw new Error(`unknown box type: ${type}`);
    const box = factory();
    box.id = `box${nextBoxId++}`;
    box.defaults = {};
    box.paramDefs.forEach((d) => { box.defaults[d.key] = box.getParam(d.key); });
    return box;
  }

  // ================= sampleSlot =================

  const ORDERS = ["forward", "reverse", "random", "pingpong"];
  const SLOT_DIVISIONS = ["1/8", "1/8d", "1/16", "1/16t", "1/32"];
  const COLORS = ["#45d9bd", "#ff7a5c", "#b78bff", "#ffc65c"];

  function el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function reverseBuffer(ctx, buffer) {
    const rev = ctx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
    for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
      const src = buffer.getChannelData(ch);
      const dst = rev.getChannelData(ch);
      for (let i = 0; i < src.length; i++) dst[i] = src[src.length - 1 - i];
    }
    return rev;
  }

  class SampleSlot {
    constructor(index) {
      this.index = index;
      this.color = COLORS[index % COLORS.length];
      this.buffer = null;
      this.reversedBuffer = null;
      this.region = { start: 0, end: 1 };
      this.loop = { enabled: false, rate: 1, reverse: false };
      this.chop = { enabled: true, steps: 8, division: "1/16", gate: 0.7, probability: 0.9, jitter: 0.15, order: "forward" };
      this.chopCounter = 0;
      this.chopDir = 1;
      this.nextStepTime = 0;
      this.loopSource = null;
      this.loopStartedAt = 0;

      this._buildNodes();
      this._buildUI();
    }

    _buildNodes() {
      const ctx = engine.ctx;
      this.preGain = ctx.createGain();
      this.preGain.gain.value = 1;
      this.panner = ctx.createStereoPanner();
      this.volumeGain = ctx.createGain();
      this.volumeGain.gain.value = 0.85;
      this.reverbSend = ctx.createGain();
      this.reverbSend.gain.value = 0.15;
      this.outputBus = ctx.createGain();

      this.preGain.connect(this.panner).connect(this.volumeGain);
      this.volumeGain.connect(this.outputBus);
      this.volumeGain.connect(this.reverbSend);
      this.reverbSend.connect(engine.reverbBus);

    async _loadFile(file) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const buffer = await engine.ctx.decodeAudioData(arrayBuffer);
        this._setBuffer(buffer, file.name);
      } catch (err) {
        console.warn("failed to load sample", err);
        this.fileLabel.textContent = "読込失敗: 対応形式か確認してください";
      }
    }

    async loadDefault(seedIndex) {
      const { name, buffer } = seedIndex === undefined
        ? await makeRandomDefaultSample()
        : await makeDefaultSample(seedIndex);
      this._setBuffer(buffer, name);
    }

    _setBuffer(buffer, name) {
      this.buffer = buffer;
      this.reversedBuffer = reverseBuffer(engine.ctx, buffer);
      this.region = { start: 0, end: buffer.duration };
      this.fileLabel.textContent = name;
      this.fileLabel.title = name;
      this.emptyEl.style.display = "none";
      this._drawWaveform();
      this._drawRegion();
      if (this.loop.enabled) this._restartLoop();
    }

    _drawWaveform() {
      if (!this.buffer) return;
      const dpr = window.devicePixelRatio || 1;
      const cssW = this.waveWrap.clientWidth || 240;
      const cssH = this.waveWrap.clientHeight || 84;
      const canvas = this.canvas;
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;
      const g = canvas.getContext("2d");
      g.clearRect(0, 0, canvas.width, canvas.height);
      const data = this.buffer.getChannelData(0);
      const step = Math.max(1, Math.floor(data.length / canvas.width));
      const mid = canvas.height / 2;
      g.strokeStyle = this.color;
      g.lineWidth = 1;
      g.beginPath();
      for (let x = 0; x < canvas.width; x++) {
        let min = 1, max = -1;
        const startI = x * step;
        for (let i = 0; i < step; i++) {
          const v = data[startI + i] || 0;
          if (v < min) min = v;
          if (v > max) max = v;
        }
        g.moveTo(x, mid + min * mid * 0.92);
        g.lineTo(x, mid + max * mid * 0.92);
      }
      g.stroke();
    }

    _drawRegion() {
      if (!this.buffer) return;
      const dur = this.buffer.duration;
      const leftPct = (this.region.start / dur) * 100;
      const widthPct = ((this.region.end - this.region.start) / dur) * 100;
      this.regionEl.style.left = `${leftPct}%`;
      this.regionEl.style.width = `${Math.max(0.5, widthPct)}%`;
    }

    _bindWaveformDrag() {
      let dragMode = null;
      let dragOriginFrac = 0;

      const fracAt = (clientX) => {
        const rect = this.waveWrap.getBoundingClientRect();
        return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      };

      this.waveWrap.addEventListener("mousedown", (e) => {
        if (!this.buffer) return;
        const dur = this.buffer.duration;
        const frac = fracAt(e.clientX);
        const startFrac = this.region.start / dur;
        const endFrac = this.region.end / dur;
        const px = frac * this.waveWrap.clientWidth;
        const startPx = startFrac * this.waveWrap.clientWidth;
        const endPx = endFrac * this.waveWrap.clientWidth;

        if (Math.abs(px - startPx) < 7) dragMode = "start";
        else if (Math.abs(px - endPx) < 7) dragMode = "end";
        else { dragMode = "new"; dragOriginFrac = frac; }

        const onMove = (ev) => {
          const f = fracAt(ev.clientX);
          if (dragMode === "start") {
            this.region.start = Math.min(f, endFrac - 0.005) * dur;
          } else if (dragMode === "end") {
            this.region.end = Math.max(f, startFrac + 0.005) * dur;
          } else {
            this.region.start = Math.min(dragOriginFrac, f) * dur;
            this.region.end = Math.max(dragOriginFrac, f) * dur;
          }
          this._drawRegion();
        };
        const onUp = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
          if (this.region.end - this.region.start < 0.02) {
            this.region.end = Math.min(dur, this.region.start + 0.05);
          }
          if (this.loop.enabled) this._restartLoop();
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      });

      let dragDepth = 0;
      this.waveWrap.addEventListener("dragenter", (e) => {
        e.preventDefault();
        dragDepth++;
        this.waveWrap.classList.add("wave-dragover");
      });
      this.waveWrap.addEventListener("dragover", (e) => e.preventDefault());
      this.waveWrap.addEventListener("dragleave", () => {
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) this.waveWrap.classList.remove("wave-dragover");
      });
      this.waveWrap.addEventListener("drop", (e) => {
        e.preventDefault();
        dragDepth = 0;
        this.waveWrap.classList.remove("wave-dragover");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) this._loadFile(file);
      });
    }

    setLoopEnabled(on) {
      this.loop.enabled = on;
      if (on && this.buffer) this._restartLoop();
      else this._stopLoop();
    }

    _restartLoop() {
      this._stopLoop();
      if (!this.buffer) return;
      const ctx = engine.ctx;
      const src = ctx.createBufferSource();
      const dur = this.buffer.duration;
      if (this.loop.reverse) {
        src.buffer = this.reversedBuffer;
        src.loopStart = dur - this.region.end;
        src.loopEnd = dur - this.region.start;
      } else {
        src.buffer = this.buffer;
        src.loopStart = this.region.start;
        src.loopEnd = this.region.end;
      }
      src.loop = true;
      src.playbackRate.value = this.loop.rate;
      const fadeGain = ctx.createGain();
      fadeGain.gain.setValueAtTime(0, ctx.currentTime);
      fadeGain.gain.linearRampToValueAtTime(1, ctx.currentTime + 0.02);
      src.connect(fadeGain).connect(this.preGain);
      src.start(ctx.currentTime, this.loop.reverse ? dur - this.region.end : this.region.start);
      this.loopSource = src;
      this.loopFadeGain = fadeGain;
      this.loopStartedAt = ctx.currentTime;
    }

    _stopLoop() {
      if (this.loopSource) {
        try {
          const ctx = engine.ctx;
          this.loopFadeGain.gain.setTargetAtTime(0, ctx.currentTime, 0.015);
          const src = this.loopSource;
          setTimeout(() => { try { src.stop(); } catch (e) {} }, 80);
        } catch (e) {}
        this.loopSource = null;
      }
    }

    setChopEnabled(on) {
      this.chop.enabled = on;
      if (on) this.nextStepTime = engine.ctx.currentTime + 0.05;
    }

    _nextChopIndex() {
      const n = this.chop.steps;
      switch (this.chop.order) {
        case "reverse":
          this.chopCounter = (this.chopCounter + 1) % n;
          return n - 1 - this.chopCounter;
        case "random":
          return Math.floor(Math.random() * n);
        case "pingpong": {
          const idx = this.chopCounter;
          this.chopCounter += this.chopDir;
          if (this.chopCounter >= n - 1 || this.chopCounter <= 0) this.chopDir *= -1;
          return Math.max(0, Math.min(n - 1, idx));
        }
        default:
          this.chopCounter = (this.chopCounter + 1) % n;
          return this.chopCounter;
      }
    }

    transportTick(now, lookahead) {
      if (!this.chop.enabled || !this.buffer) return;
      const stepDur = stepSeconds(this.chop.division);
      while (this.nextStepTime < now + lookahead) {
        const t = this.nextStepTime;
        if (Math.random() < this.chop.probability) {
          this._triggerChopSlice(t);
        }
        this.nextStepTime += Math.max(0.01, stepDur);
      }
    }

    _triggerChopSlice(time) {
      const ctx = engine.ctx;
      const dur = this.region.end - this.region.start;
      const steps = this.chop.steps;
      const sliceWidth = dur / steps;
      const idx = this._nextChopIndex();
      const jitterOffset = (Math.random() * 2 - 1) * this.chop.jitter * sliceWidth * 0.5;
      let offset = this.region.start + idx * sliceWidth + jitterOffset;
      offset = Math.min(this.buffer.duration - 0.01, Math.max(0, offset));
      const playDur = Math.max(0.01, sliceWidth * this.chop.gate);
      const rateJitter = 1 + (Math.random() * 2 - 1) * this.chop.jitter * 0.12;

      const src = ctx.createBufferSource();
      src.buffer = this.buffer;
      src.playbackRate.value = rateJitter;

      const env = ctx.createGain();
      const attack = Math.min(0.006, playDur * 0.2);
      env.gain.setValueAtTime(0, time);
      env.gain.linearRampToValueAtTime(1, time + attack);
      env.gain.setValueAtTime(1, time + Math.max(attack, playDur - attack));
      env.gain.linearRampToValueAtTime(0, time + playDur);

      src.connect(env).connect(this.preGain);
      src.start(time, offset, playDur + 0.02);
      src.stop(time + playDur + 0.03);
    }

    hit() {
      if (!this.buffer) return;
      const ctx = engine.ctx;
      const src = ctx.createBufferSource();
      src.buffer = this.loop.reverse ? this.reversedBuffer : this.buffer;
      const dur = this.buffer.duration;
      const offset = this.loop.reverse ? dur - this.region.end : this.region.start;
      const playDur = this.region.end - this.region.start;
      const env = ctx.createGain();
      env.gain.setValueAtTime(0, ctx.currentTime);
      env.gain.linearRampToValueAtTime(1, ctx.currentTime + 0.005);
      src.connect(env).connect(this.preGain);
      src.start(ctx.currentTime, offset, playDur);
    }

    onTransportStart() {
      this.nextStepTime = engine.ctx.currentTime + 0.05;
      if (this.loop.enabled && this.buffer) this._restartLoop();
    }

    onTransportStop() {
      this._stopLoop();
    }

    updatePlayhead() {
      if (!this.buffer || !this.loop.enabled || !this.loopSource) {
        this.playheadEl.style.opacity = 0;
        return;
      }
      const ctx = engine.ctx;
      const dur = this.buffer.duration;
      const loopStart = this.loop.reverse ? dur - this.region.end : this.region.start;
      const loopEnd = this.loop.reverse ? dur - this.region.start : this.region.end;
      const loopLen = Math.max(0.001, loopEnd - loopStart);
      const elapsed = ((ctx.currentTime - this.loopStartedAt) * this.loop.rate) % loopLen;
      const posInBuffer = this.loop.reverse ? (dur - (loopStart + elapsed)) : (loopStart + elapsed);
      const pctPos = (posInBuffer / dur) * 100;
      this.playheadEl.style.left = `${pctPos}%`;
      this.playheadEl.style.opacity = 1;
    }
  }

  // ================= patchbay =================

  const NS = "http://www.w3.org/2000/svg";
  const SOURCE_COLORS = ["#45d9bd", "#ff7a5c", "#b78bff", "#ffc65c"];
  const MOD_COLOR = "#f042ff";

  class PatchBay {
    constructor(canvasEl, svgEl, slots) {
      this.canvasEl = canvasEl;
      this.svgEl = svgEl;
      this.slots = slots;
      this.nodes = new Map();
      this.connections = [];
      this._pendingConnect = null;

      this._topZ = 10;

      this._buildSourcesAndMaster();
      this._bindGlobalMouse();
      window.addEventListener("resize", () => this.redrawCables());
      this._modTimer = setInterval(() => this._modTick(), 60);
    }

    _buildSourcesAndMaster() {
      this.slots.forEach((slot, i) => {
        const id = `slot${i}`;
        const boxEl = el(`
          <div class="pbox source" style="left:20px; top:${30 + i * 130}px; border-color:${SOURCE_COLORS[i]}55">
            <div class="pbox-head">SLOT ${i + 1}<span></span></div>
            <div class="pbox-body"><span style="font-size:0.6rem;color:var(--ink-dim)">サンプル出力</span></div>
            <div class="port out" data-role="audio" data-node="${id}" data-port="out"></div>
          </div>
        `);
        this.canvasEl.appendChild(boxEl);
        this.nodes.set(id, { kind: "source", el: boxEl, output: slot.outputBus });
      });

      const masterInput = engine.ctx.createGain();
      masterInput.connect(engine.master);
      const masterEl = el(`
        <div class="pbox master" style="left:1220px; top:280px;">
          <div class="pbox-head">MASTER OUT<span></span></div>
          <div class="pbox-body"><span style="font-size:0.6rem;color:var(--ink-dim)">最終出力</span></div>
          <div class="port in" data-role="audio" data-node="master" data-port="in"></div>
        </div>
      `);
      this.canvasEl.appendChild(masterEl);
      this.nodes.set("master", { kind: "master", el: masterEl, input: masterInput });

      this._bindBoxDrag(document.querySelectorAll(".pbox"));
      this._bindPorts();
    }

    addBox(type, x, y) {
      const box = createBox(type);
      const paramsHtml = box.paramDefs.map((d) => {
        const val = box.getParam(d.key);
        if (d.type === "select") {
          return `
            <label class="param">${d.label}
              <select data-key="${d.key}">
                ${d.options.map((o) => `<option value="${o}" ${o === val ? "selected" : ""}>${o}</option>`).join("")}
              </select>
            </label>`;
        }
        const fmt = d.format ? d.format(val) : val;
        return `
          <label class="param">${d.label} <span class="valnum" data-show="${d.key}">${fmt}</span>
            <input type="range" data-key="${d.key}" min="${d.min}" max="${d.max}" step="${d.step}" value="${val}" />
          </label>`;
      }).join("");

      const audioPorts = box.isModSource
        ? ""
        : `<div class="port in" data-role="audio" data-node="${box.id}" data-port="in"></div>
           <div class="port out" data-role="audio" data-node="${box.id}" data-port="out"></div>`;
      const modPort = box.isModSource
        ? `<div class="port modout" data-role="mod" data-node="${box.id}" data-port="out"></div>`
        : box.modTargetKey
          ? `<div class="port modin" data-role="mod" data-node="${box.id}" data-port="in"></div>`
          : "";

      const boxEl = el(`
        <div class="pbox type-${box.type}" style="left:${x}px; top:${y}px;">
          <div class="pbox-head"><span class="pbox-title">${box.title}</span><span class="remove" title="削除">✕</span></div>
          <div class="pbox-body">${paramsHtml}</div>
          ${audioPorts}
          ${modPort}
        </div>
      `);

      box._userBase = {};
      box.paramDefs.forEach((d) => { box._userBase[d.key] = box.getParam(d.key); });

      box.paramDefs.forEach((d) => {
        const input = boxEl.querySelector(`[data-key="${d.key}"]`);
        const showEl = boxEl.querySelector(`[data-show="${d.key}"]`);
        input.addEventListener("input", () => {
          const v = d.type === "select" ? input.value : +input.value;
          box.setParam(d.key, v);
          box._userBase[d.key] = v;
          if (showEl) showEl.textContent = d.format ? d.format(v) : v;
        });
      });

      boxEl.querySelector(".remove").addEventListener("click", () => this.removeBox(box.id));

      this.canvasEl.appendChild(boxEl);
      this.nodes.set(box.id, { kind: "box", el: boxEl, box, input: box.input, output: box.output });
      this._bindBoxDrag([boxEl]);
      this._bindPorts();
      this._relabelBoxes();
      return box.id;
    }

    removeBox(id) {
      const node = this.nodes.get(id);
      if (!node || node.kind !== "box") return;
      node.box.dispose();
      node.el.remove();
      this.nodes.delete(id);
      this.connections = this.connections.filter((c) => c.from !== id && c.to !== id);
      this.rebuildAudioGraph();
      this.redrawCables();
      this._relabelBoxes();
    }

    _relabelBoxes() {
      const groups = new Map();
      this.nodes.forEach((n) => {
        if (n.kind !== "box") return;
        const t = n.box.type;
        if (!groups.has(t)) groups.set(t, []);
        groups.get(t).push(n);
      });
      groups.forEach((list) => {
        list.forEach((n, i) => {
          const label = list.length > 1 ? `${n.box.title} ${i + 1}` : n.box.title;
          const titleEl = n.el.querySelector(".pbox-title");
          if (titleEl) titleEl.textContent = label;
        });
      });
    }

    connect(from, to, role = "audio") {
      if (from === to) return;
      const fromNode = this.nodes.get(from);
      const toNode = this.nodes.get(to);
      if (!fromNode || !toNode) return;

      if (role === "mod") {
        if (!fromNode.box || !fromNode.box.isModSource) return;
        if (!toNode.box || !toNode.box.modTargetKey) return;
        this.connections = this.connections.filter((c) => !(c.role === "mod" && c.to === to));
      } else {
        if (toNode.kind === "source") return;
        if (fromNode.kind === "master") return;
        if (fromNode.box && fromNode.box.isModSource) return;
      }

      const exists = this.connections.some((c) => c.from === from && c.to === to && (c.role || "audio") === role);
      if (exists) return;
      this.connections.push({ from, to, role });
      this.rebuildAudioGraph();
      this.redrawCables();
    }

    disconnectPair(from, to, role = "audio") {
      this.connections = this.connections.filter((c) => !(c.from === from && c.to === to && (c.role || "audio") === role));
      this.rebuildAudioGraph();
      this.redrawCables();
    }

    clearConnections() {
      this.connections = [];
      this.rebuildAudioGraph();
      this.redrawCables();
    }

    resetDefaultPatch() {
      [...this.nodes.entries()].forEach(([id, n]) => { if (n.kind === "box") this.removeBox(id); });
      this.connections = [];
      const glitchId = this.addBox("glitch", 260, 40);
      this.connect("slot0", glitchId);
      this.connect(glitchId, "master");
      this.connect("slot1", "master");
      this.connect("slot2", "master");
      this.connect("slot3", "master");

      const modId = this.addBox("mod", 260, 460);
      this.connect(modId, glitchId, "mod");
    }

    randomizePatch() {
      const boxEntries = [...this.nodes.entries()].filter(([, n]) => n.kind === "box" && !n.box.isModSource);
      const modEntries = [...this.nodes.entries()].filter(([, n]) => n.kind === "box" && n.box.isModSource);
      const boxIds = boxEntries.map(([id]) => id);
      const slotIds = this.slots.map((_, i) => `slot${i}`);
      const shuffledSlots = [...slotIds].sort(() => Math.random() - 0.5);

      const newConnections = [];
      let reachesMaster = false;

      shuffledSlots.forEach((sid) => {
        if (shuffledSlots.length > 1 && Math.random() < 0.15) return;
        const chainLen = boxIds.length ? Math.floor(Math.random() * Math.min(3, boxIds.length + 1)) : 0;
        const chain = [...boxIds].sort(() => Math.random() - 0.5).slice(0, chainLen);
        let prev = sid;
        chain.forEach((bid) => {
          newConnections.push({ from: prev, to: bid, role: "audio" });
          prev = bid;
        });
        newConnections.push({ from: prev, to: "master", role: "audio" });
        reachesMaster = true;
      });

      if (!reachesMaster) {
        newConnections.push({ from: shuffledSlots[0], to: "master", role: "audio" });
      }

      modEntries.forEach(([mid]) => {
        const targetable = boxIds.filter((id) => this.nodes.get(id).box.modTargetKey);
        if (!targetable.length || Math.random() < 0.25) return;
        const targetId = targetable[Math.floor(Math.random() * targetable.length)];
        newConnections.push({ from: mid, to: targetId, role: "mod" });
      });

      this.connections = newConnections;
      this.rebuildAudioGraph();
      this.redrawCables();
    }

    rebuildAudioGraph() {
      this.nodes.forEach((n) => {
        if (n.output) { try { n.output.disconnect(); } catch (e) {} }
      });
      this.connections.forEach(({ from, to, role }) => {
        if ((role || "audio") !== "audio") return;
        const fromNode = this.nodes.get(from);
        const toNode = this.nodes.get(to);
        if (!fromNode || !toNode) return;
        try { fromNode.output.connect(toNode.input); } catch (e) {}
      });
    }

    _modTick() {
      if (!engine.ctx) return;
      const t = engine.ctx.currentTime;
      this.connections.forEach((conn) => {
        if ((conn.role || "audio") !== "mod") return;
        const src = this.nodes.get(conn.from);
        const tgt = this.nodes.get(conn.to);
        if (!src || !tgt || src.kind !== "box" || tgt.kind !== "box") return;
        const key = tgt.box.modTargetKey;
        const def = tgt.box.paramDefs.find((d) => d.key === key);
        if (!def) return;

        const raw = src.box.getValue(t);
        const depth = src.box.getParam("depth");
        const base = tgt.box._userBase && tgt.box._userBase[key] !== undefined ? tgt.box._userBase[key] : tgt.box.getParam(key);
        const modded = def.min + raw * (def.max - def.min);
        const value = base * (1 - depth) + modded * depth;
        tgt.box.setParam(key, value);

        const input = tgt.el.querySelector(`[data-key="${key}"]`);
        const showEl = tgt.el.querySelector(`[data-show="${key}"]`);
        if (input) input.value = value;
        if (showEl) showEl.textContent = def.format ? def.format(value) : value;
      });
    }

    _updateModVisuals() {
      const moddedTargets = new Set(this.connections.filter((c) => (c.role || "audio") === "mod").map((c) => c.to));
      this.nodes.forEach((n, id) => {
        if (n.kind !== "box" || !n.box.modTargetKey) return;
        const label = n.el.querySelector(`[data-key="${n.box.modTargetKey}"]`)?.closest(".param");
        if (label) label.classList.toggle("modulating", moddedTargets.has(id));
      });
    }

    _bindBoxDrag(elements) {
      elements.forEach((boxEl) => {
        const head = boxEl.querySelector(".pbox-head");
        head.addEventListener("mousedown", (e) => {
          if (e.target.classList.contains("remove")) return;
          e.preventDefault();
          boxEl.style.zIndex = ++this._topZ;
          const startX = e.clientX, startY = e.clientY;
          const origLeft = parseFloat(boxEl.style.left) || 0;
          const origTop = parseFloat(boxEl.style.top) || 0;
          const onMove = (ev) => {
            boxEl.style.left = `${Math.max(0, origLeft + (ev.clientX - startX))}px`;
            boxEl.style.top = `${Math.max(0, origTop + (ev.clientY - startY))}px`;
            this.redrawCables();
          };
          const onUp = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });
      });
    }

    _bindPorts() {
      this.canvasEl.querySelectorAll(".port.out, .port.modout").forEach((portEl) => {
        if (portEl.dataset.bound) return;
        portEl.dataset.bound = "1";
        portEl.addEventListener("mousedown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const ownerBox = portEl.closest(".pbox");
          if (ownerBox) ownerBox.style.zIndex = ++this._topZ;
          this._pendingConnect = { from: portEl.dataset.node, role: portEl.dataset.role || "audio", portEl };
          this._dragPath = document.createElementNS(NS, "path");
          this._dragPath.setAttribute("class", "cable-drag");
          this.svgEl.appendChild(this._dragPath);
        });
      });
    }

    _bindGlobalMouse() {
      this.canvasEl.addEventListener("mousemove", (e) => {
        if (!this._pendingConnect) return;
        const rect = this.canvasEl.getBoundingClientRect();
        const p1 = this._portCenter(this._pendingConnect.portEl);
        const x2 = e.clientX - rect.left, y2 = e.clientY - rect.top;
        this._dragPath.setAttribute("d", this._bezier(p1.x, p1.y, x2, y2));
      });

      window.addEventListener("mouseup", (e) => {
        if (!this._pendingConnect) return;
        const role = this._pendingConnect.role;
        const wantsClass = role === "mod" ? "modin" : "in";
        const target = document.elementFromPoint(e.clientX, e.clientY);
        let targetNode = (target && target.classList.contains("port") && target.classList.contains(wantsClass))
          ? target.dataset.node
          : null;

        if (!targetNode) {
          const selector = role === "mod" ? ".port.modin" : ".port.in";
          let bestDist = 26;
          this.canvasEl.querySelectorAll(selector).forEach((p) => {
            const r = p.getBoundingClientRect();
            const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
            if (d < bestDist) { bestDist = d; targetNode = p.dataset.node; }
          });
        }

        if (targetNode) this.connect(this._pendingConnect.from, targetNode, role);
        if (this._dragPath) this._dragPath.remove();
        this._dragPath = null;
        this._pendingConnect = null;
      });
    }

    _portCenter(portEl) {
      const rect = portEl.getBoundingClientRect();
      const canvasRect = this.canvasEl.getBoundingClientRect();
      return { x: rect.left + rect.width / 2 - canvasRect.left, y: rect.top + rect.height / 2 - canvasRect.top };
    }

    _bezier(x1, y1, x2, y2) {
      const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
      return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    }

    redrawCables() {
      while (this.svgEl.firstChild) this.svgEl.removeChild(this.svgEl.firstChild);
      this.connections.forEach((conn) => {
        const isMod = (conn.role || "audio") === "mod";
        const fromNode = this.nodes.get(conn.from);
        const toNode = this.nodes.get(conn.to);
        if (!fromNode || !toNode) return;
        const outPort = fromNode.el.querySelector(isMod ? ".port.modout" : ".port.out");
        const inPort = toNode.el.querySelector(isMod ? ".port.modin" : ".port.in");
        if (!outPort || !inPort) return;
        const p1 = this._portCenter(outPort);
        const p2 = this._portCenter(inPort);
        const path = document.createElementNS(NS, "path");
        path.setAttribute("class", isMod ? "cable cable-mod" : "cable");
        path.setAttribute("d", this._bezier(p1.x, p1.y, p2.x, p2.y));
        path.setAttribute("stroke", isMod ? MOD_COLOR : (fromNode.kind === "source" ? SOURCE_COLORS[Number(conn.from.replace("slot", ""))] || "#45d9bd" : "#838da0"));
        this.svgEl.appendChild(path);

        const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
        const g = document.createElementNS(NS, "g");
        g.setAttribute("class", "cableDelete");
        g.setAttribute("transform", `translate(${midX},${midY})`);
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("r", "8");
        const t = document.createElementNS(NS, "text");
        t.textContent = "×";
        g.appendChild(c); g.appendChild(t);
        g.addEventListener("mousedown", (e) => e.stopPropagation());
        g.addEventListener("click", () => this.disconnectPair(conn.from, conn.to, conn.role || "audio"));
        this.svgEl.appendChild(g);
      });
      this._updateModVisuals();
    }
  }

  // ================= main / boot =================

  const LOOKAHEAD = 0.15;

  async function boot() {
    await initAudioEngine();

    const slotsContainer = document.getElementById("slots");
    const slots = [0, 1, 2, 3].map((i) => new SampleSlot(i));
    slots.forEach((s) => slotsContainer.appendChild(s.rootEl));
    await Promise.all(slots.map((s, i) => s.loadDefault(i)));

    const patchCanvas = document.getElementById("patchCanvas");
    const cableLayer = document.getElementById("cableLayer");
    const patchBay = new PatchBay(patchCanvas, cableLayer, slots);
    patchBay.resetDefaultPatch();

    let addCascade = 0;
    document.querySelectorAll(".addButtons button[data-add]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const type = btn.dataset.add;
        const x = 480 + (addCascade % 4) * 220;
        const y = 60 + Math.floor(addCascade / 4) * 260;
        addCascade++;
        patchBay.addBox(type, x, y);
        patchBay.redrawCables();
      });
    });
    document.getElementById("clearPatchBtn").addEventListener("click", () => {
      patchBay.resetDefaultPatch();
    });
    document.getElementById("randomPatchBtn").addEventListener("click", () => {
      patchBay.randomizePatch();
    });

    const chaosBtn = document.getElementById("chaosBtn");
    let chaosTimer = null;
    function chaosTick() {
      const pool = Array.from(document.querySelectorAll(".slot input[type=range], .pbox .pbox-body input[type=range]"));
      if (!pool.length) return;
      const n = Math.min(pool.length, 1 + Math.floor(Math.random() * 4));
      pool.sort(() => Math.random() - 0.5).slice(0, n).forEach((input) => {
        const min = parseFloat(input.min), max = parseFloat(input.max);
        const step = parseFloat(input.step) || 0.01;
        const raw = min + Math.random() * (max - min);
        input.value = Math.round(raw / step) * step;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      });
    }
    chaosBtn.addEventListener("click", () => {
      if (chaosTimer) {
        clearInterval(chaosTimer);
        chaosTimer = null;
        chaosBtn.classList.remove("active");
        chaosBtn.textContent = "🌀 暴走モード";
      } else {
        chaosTimer = setInterval(chaosTick, 450);
        chaosBtn.classList.add("active");
        chaosBtn.textContent = "⏹ 暴走停止";
      }
    });

    const playBtn = document.getElementById("playBtn");
    const bpmInput = document.getElementById("bpm");
    const masterVol = document.getElementById("masterVol");
    const meterBar = document.getElementById("meterBar");

    bpmInput.addEventListener("change", () => {
      engine.bpm = Math.max(40, Math.min(220, +bpmInput.value || 120));
      patchBay.nodes.forEach((n) => {
        if (n.kind !== "box") return;
        const hasDivision = n.box.paramDefs.some((d) => d.key === "division");
        if (hasDivision) n.box.setParam("division", n.box.getParam("division"));
      });
    });

    masterVol.addEventListener("input", () => {
      engine.master.gain.setTargetAtTime(+masterVol.value, engine.ctx.currentTime, 0.01);
    });

    let schedulerTimer = null;
    function schedulerLoop() {
      if (!engine.running) return;
      const now = engine.ctx.currentTime;
      slots.forEach((s) => s.transportTick(now, LOOKAHEAD));
      patchBay.nodes.forEach((n) => {
        if (n.kind === "box" && typeof n.box.tick === "function") n.box.tick(now, LOOKAHEAD);
      });
      schedulerTimer = setTimeout(schedulerLoop, 30);
    }

    async function start() {
      await resumeEngine();
      engine.running = true;
      slots.forEach((s) => s.onTransportStart());
      patchBay.nodes.forEach((n) => {
        if (n.kind === "box" && typeof n.box.onTransportStart === "function") n.box.onTransportStart();
      });
      schedulerLoop();
      playBtn.textContent = "■ 停止";
      playBtn.classList.add("playing");
    }

    function stop() {
      engine.running = false;
      clearTimeout(schedulerTimer);
      slots.forEach((s) => s.onTransportStop());
      playBtn.textContent = "▶ 再生";
      playBtn.classList.remove("playing");
    }

    playBtn.addEventListener("click", () => {
      if (engine.running) stop(); else start();
    });

    function uiLoop() {
      slots.forEach((s) => s.updatePlayhead());
      const level = readMeterLevel();
      meterBar.style.width = `${Math.min(100, level * 260)}%`;
      requestAnimationFrame(uiLoop);
    }
    requestAnimationFrame(uiLoop);
  }

  boot();
})();
</script>
