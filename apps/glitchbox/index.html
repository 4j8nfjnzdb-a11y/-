<title>glitchbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f1ece1;
    --panel: #e7ded0;
    --panel-edge: #d9cebb;
    --ink: #221d16;
    --ink-dim: rgba(34, 29, 22, 0.62);
    --ink-faint: rgba(34, 29, 22, 0.34);
    --accent: #c9481c;
    --accent-ink: #fff6ef;
    --signal: #2c8a4c;
    --fault: #6c4fc4;
    --line: rgba(34, 29, 22, 0.16);
    --line-strong: rgba(34, 29, 22, 0.28);
    --led-off: rgba(34, 29, 22, 0.22);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15120d;
      --panel: #1d1811;
      --panel-edge: #2a2318;
      --ink: #ede5d6;
      --ink-dim: rgba(237, 229, 214, 0.62);
      --ink-faint: rgba(237, 229, 214, 0.34);
      --accent: #ff7a3d;
      --accent-ink: #1a0f08;
      --signal: #5fd97e;
      --fault: #a084ff;
      --line: rgba(237, 229, 214, 0.14);
      --line-strong: rgba(237, 229, 214, 0.26);
      --led-off: rgba(237, 229, 214, 0.18);
    }
  }

  :root[data-theme="dark"] {
    --bg: #15120d;
    --panel: #1d1811;
    --panel-edge: #2a2318;
    --ink: #ede5d6;
    --ink-dim: rgba(237, 229, 214, 0.62);
    --ink-faint: rgba(237, 229, 214, 0.34);
    --accent: #ff7a3d;
    --accent-ink: #1a0f08;
    --signal: #5fd97e;
    --fault: #a084ff;
    --line: rgba(237, 229, 214, 0.14);
    --line-strong: rgba(237, 229, 214, 0.26);
    --led-off: rgba(237, 229, 214, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
    position: relative;
    overflow-x: hidden;
  }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  }

  /* ---------------- fault overlay: the whole room flickers ---------------- */

  #fault {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: var(--fault-blend, normal);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #fault { --fault-blend: screen; }
  }
  :root[data-theme="dark"] #fault { --fault-blend: screen; }

  #fault.flash { animation: faultFlash 220ms steps(4, end); }

  @keyframes faultFlash {
    0%   { opacity: 0; }
    12%  { opacity: 0.5; }
    24%  { opacity: 0.05; }
    40%  { opacity: 0.32; }
    52%  { opacity: 0; }
    68%  { opacity: 0.22; }
    80%  { opacity: 0; }
    100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    #fault.flash { animation: none; opacity: 0.28; transition: opacity 260ms ease; }
    .rig.shake { animation: none !important; }
  }

  /* ---------------- the device ---------------- */

  .rig {
    position: relative;
    z-index: 1;
    width: min(30rem, 100%);
  }

  .rig.shake { animation: rigShake 240ms linear; }
  @keyframes rigShake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    15%  { transform: translate(-7px, 2px) rotate(-0.6deg); }
    30%  { transform: translate(5px, -3px) rotate(0.5deg); }
    45%  { transform: translate(-4px, 3px) rotate(-0.3deg); }
    60%  { transform: translate(3px, -1px) rotate(0.3deg); }
    80%  { transform: translate(-2px, 1px) rotate(0deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 2rem 2rem 1.75rem;
    box-shadow: 0 1px 0 var(--panel-edge) inset, 0 20px 40px -28px rgba(0,0,0,0.5);
  }

  .rivet {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--panel-edge);
  }
  .rivet::after {
    content: "";
    position: absolute;
    left: 1px;
    right: 1px;
    top: 3px;
    height: 1px;
    background: var(--ink-faint);
  }
  .rivet.tl { top: 0.6rem; left: 0.6rem; }
  .rivet.tr { top: 0.6rem; right: 0.6rem; }
  .rivet.bl { bottom: 0.6rem; left: 0.6rem; }
  .rivet.br { bottom: 0.6rem; right: 0.6rem; }

  .nameplate {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 1.1rem;
  }

  h1 {
    margin: 0;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 700;
    font-size: 2.1rem;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  h1 sup {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
    margin-left: 0.35em;
    vertical-align: 0.9em;
  }

  .tagline {
    margin: 0.7rem 0 0;
    color: var(--ink-dim);
    font-size: 0.92rem;
    line-height: 1.75;
    max-width: 30em;
  }

  .warn {
    margin: 1rem 0 0;
    font-size: 0.74rem;
    color: var(--accent);
    display: flex;
    gap: 0.4em;
    align-items: baseline;
  }

  hr.rule {
    border: none;
    border-top: 1px solid var(--line);
    margin: 1.4rem 0;
  }

  /* ---- footswitch row ---- */

  .switchRow {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .footswitch {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 0.82rem;
    letter-spacing: 0.04em;

<script id="glitch-processor-src" type="text/plain">
class GlitchProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ringLen = Math.ceil(sampleRate * 0.75);
    this.ring = [new Float32Array(this.ringLen), new Float32Array(this.ringLen)];
    this.writeIdx = 0;
    this.active = null;

    this.port.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === "trigger") this.startGlitch(msg);
      else if (msg.type === "clear") this.active = null;
    };
  }

  startGlitch({ kind, durationSamples, intensity }) {
    const a = {
      kind,
      remaining: durationSamples,
      total: durationSamples,
      intensity,
      crushCounter: 0,
      crushHold: [0, 0],
      readPos: 0,
    };

    if (kind === "stutter") {
      const lenSec = 0.02 + Math.random() * 0.09 * (0.4 + intensity);
      a.stutterLen = Math.max(8, Math.floor(lenSec * sampleRate));
      a.stutterStart = (this.writeIdx - a.stutterLen - 64 + this.ringLen * 4) % this.ringLen;
    }

    this.active = a;
  }

  rerollChopGrain(a) {
    const lenSec = 0.008 + Math.random() * 0.045 * (0.3 + a.intensity);
    a.chopLen = Math.max(4, Math.floor(lenSec * sampleRate));
    const back = 120 + Math.floor(Math.random() * (this.ringLen - 400));
    a.chopStart = (this.writeIdx - back + this.ringLen * 4) % this.ringLen;
    a.chopReadPos = 0;
  }

  applyGlitch(xs) {
    const a = this.active;
    switch (a.kind) {
      case "bitcrush": {
        const holdEvery = 2 + Math.floor(a.intensity * 9);
        a.crushCounter++;
        if (a.crushCounter >= holdEvery) {
          a.crushCounter = 0;
          a.crushHold = xs.slice();
        }
        const bits = Math.max(3, 8 - Math.floor(a.intensity * 4));
        const levels = Math.pow(2, bits);
        return a.crushHold.map((v) => Math.round(v * levels) / levels);
      }
      case "stutter": {
        const len = a.stutterLen;
        const idx = (a.stutterStart + (a.readPos % len) + this.ringLen) % this.ringLen;
        a.readPos++;
        return [this.ring[0][idx], this.ring[1][idx]];
      }
      case "chop": {
        if (!a.chopLen || a.chopReadPos >= a.chopLen) this.rerollChopGrain(a);
        const idx = (a.chopStart + a.chopReadPos + this.ringLen) % this.ringLen;
        a.chopReadPos++;
        return [this.ring[0][idx], this.ring[1][idx]];
      }
      case "dropout": {
        return [0, 0];
      }
      default:
        return xs;
    }
  }

  process(inputs, outputs) {
    const input = inputs[0];
    const output = outputs[0];
    if (!output || !output[0]) return true;
    const frames = output[0].length;
    const nOut = output.length;

    for (let i = 0; i < frames; i++) {
      const xs = [0, 0];
      for (let ch = 0; ch < nOut; ch++) {
        const inCh = input[ch] || input[0];
        xs[ch] = inCh ? inCh[i] : 0;
      }
      if (nOut < 2) xs[1] = xs[0];

      this.ring[0][this.writeIdx] = xs[0];
      this.ring[1][this.writeIdx] = xs[1];

      let ys = xs;
      if (this.active) {
        ys = this.applyGlitch(xs);
        this.active.remaining--;
        if (this.active.remaining <= 0) this.active = null;
      }

      for (let ch = 0; ch < nOut; ch++) output[ch][i] = ys[ch];
      this.writeIdx = (this.writeIdx + 1) % this.ringLen;
    }
    return true;
  }
}

registerProcessor("glitch-processor", GlitchProcessor);
</script>

<script>
(() => {
  const startBtn = document.getElementById("startBtn");
  const glitchEnabledBox = document.getElementById("glitchEnabled");
  const statusEl = document.getElementById("status");
  const cycleButtons = Array.from(document.querySelectorAll(".cycleBtn"));
  const intensitySlider = document.getElementById("intensity");
  const volumeSlider = document.getElementById("volume");
  const intensityReadout = document.getElementById("intensityReadout");
  const volumeReadout = document.getElementById("volumeReadout");
  const fault = document.getElementById("fault");
  const rig = document.getElementById("rig");
  const logEl = document.getElementById("log");
  const ledEl = document.getElementById("led");
  const newTabBtn = document.getElementById("newTabBtn");
  const deviceSelect = document.getElementById("deviceSelect");

  newTabBtn.addEventListener("click", () => {
    window.open(window.location.href, "_blank", "noopener");
  });

  // ---- restore per-viewer control preferences (not audio state) ----
  try {
    const saved = JSON.parse(localStorage.getItem("glitchbox:prefs") || "{}");
    if (saved.intensity != null) intensitySlider.value = saved.intensity;
    if (saved.volume != null) volumeSlider.value = saved.volume;
    if (saved.period) {
      cycleButtons.forEach((b) => b.classList.toggle("active", b.dataset.period === saved.period));
    }
  } catch (e) {}

  function savePrefs() {
    try {
      const active = cycleButtons.find((b) => b.classList.contains("active"));
      localStorage.setItem("glitchbox:prefs", JSON.stringify({
        intensity: intensitySlider.value,
        volume: volumeSlider.value,
        period: active ? active.dataset.period : "normal",
      }));
    } catch (e) {}
  }

  function syncReadouts() {
    intensityReadout.textContent = intensitySlider.value + "%";
    volumeReadout.textContent = volumeSlider.value + "%";
  }
  syncReadouts();

  const PERIOD_PRESETS = {
    frequent: [2.5, 7],
    normal: [6, 18],
    rare: [15, 40],
  };
  const AUTO_KEYS = ["frequent", "normal", "rare"];

  const GLITCH_KIND_POOL = [
    "stutter", "stutter", "chop", "chop", "bitcrush", "dropout",
  ];
  const KIND_LABEL = {
    bitcrush: "BITCRUSH",
    stutter: "STUTTER",
    chop: "CHOP",
    dropout: "DROPOUT",
  };
  const KIND_DURATION = {
    bitcrush: [0.12, 0.4],
    stutter: [0.08, 0.35],
    chop: [0.15, 0.5],
    dropout: [0.04, 0.18],
  };
  const KIND_COLOR = {
    bitcrush: "var(--signal)",
    stutter: "var(--accent)",
    chop: "var(--fault)",
    dropout: "var(--ink)",
  };

  let audioCtx = null;
  let stream = null;
  let source = null;
  let workletNode = null;
  let outputGain = null;
  let running = false;

  let periodMode = (cycleButtons.find((b) => b.classList.contains("active")) || {}).dataset
    ? cycleButtons.find((b) => b.classList.contains("active")).dataset.period
    : "normal";
  let autoRangeKey = "normal";
  let schedulerTimer = null;
  let autoDriftTimer = null;

  function currentPresetKey() {
    return periodMode === "auto" ? autoRangeKey : periodMode;
  }

  function nextIntervalSeconds() {
    const [min, max] = PERIOD_PRESETS[currentPresetKey()];
    const r = Math.random();
    if (r < 0.12) return min * (0.12 + Math.random() * 0.3);
    if (r < 0.24) return max * (1.3 + Math.random() * 1.1);
    return min + Math.random() * (max - min);
  }

  function scheduleNext() {
    if (!running) return;
    const waitMs = nextIntervalSeconds() * 1000;
    schedulerTimer = setTimeout(() => {
      fireGlitch();
      scheduleNext();
    }, waitMs);
  }

  function pickAutoRange(avoid) {
    const choices = AUTO_KEYS.filter((k) => k !== avoid);
    return choices[Math.floor(Math.random() * choices.length)];
  }

  function scheduleAutoDrift() {
    clearTimeout(autoDriftTimer);
    if (periodMode !== "auto" || !running) return;
    const waitMs = (25 + Math.random() * 45) * 1000;
    autoDriftTimer = setTimeout(() => {
      autoRangeKey = pickAutoRange(autoRangeKey);
      scheduleAutoDrift();
    }, waitMs);
  }

  function fireGlitch(forceKind) {
    if (!running || !workletNode) return;
    if (!glitchEnabledBox.checked) return;

    const intensity = +intensitySlider.value / 100;
    const kind = forceKind || GLITCH_KIND_POOL[Math.floor(Math.random() * GLITCH_KIND_POOL.length)];
    const [dmin, dmax] = KIND_DURATION[kind];
    const durationSec = dmin + Math.random() * (dmax - dmin);

    workletNode.port.postMessage({
      type: "trigger",
      kind,
      durationSamples: Math.max(1, Math.floor(durationSec * audioCtx.sampleRate)),
      intensity,
    });

    flashVisual(kind, durationSec);

    if (Math.random() < 0.12 * intensity) {
      const kind2 = GLITCH_KIND_POOL[Math.floor(Math.random() * GLITCH_KIND_POOL.length)];
      setTimeout(() => fireGlitch(kind2), 40 + Math.random() * 140);
    }
  }

  function flashVisual(kind, durationSec) {
    fault.style.background = KIND_COLOR[kind];
    fault.classList.remove("flash");
    void fault.offsetWidth;
    fault.classList.add("flash");

    rig.classList.remove("shake");
    void rig.offsetWidth;
    rig.classList.add("shake");

    logEl.textContent = KIND_LABEL[kind] + " " + durationSec.toFixed(2) + "s";
    logEl.classList.add("show");
    clearTimeout(flashVisual._t);
    flashVisual._t = setTimeout(() => {
      logEl.classList.remove("show");
    }, Math.max(500, durationSec * 1000 + 250));
  }

  // deviceId "" means "browser default" — no exact constraint
  async function openStream(deviceId) {
    const audioConstraints = {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false,
    };
    if (deviceId) audioConstraints.deviceId = { exact: deviceId };
    return navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
  }

  async function refreshDeviceList(selectedDeviceId) {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const inputs = devices.filter((d) => d.kind === "audioinput");
      deviceSelect.innerHTML = "";
      const defaultOpt = document.createElement("option");
      defaultOpt.value = "";
      defaultOpt.textContent = "既定の入力";
      deviceSelect.appendChild(defaultOpt);
      inputs.forEach((d, i) => {
        const opt = document.createElement("option");
        opt.value = d.deviceId;
        opt.textContent = d.label || "入力デバイス " + (i + 1);
        deviceSelect.appendChild(opt);
      });
      deviceSelect.value = selectedDeviceId || "";
      deviceSelect.disabled = false;
    } catch (e) {}
  }

  async function switchDevice(deviceId) {
    if (!running) return;
    deviceSelect.disabled = true;
    statusEl.classList.remove("error");
    statusEl.textContent = "入力デバイスを切り替えています…";
    try {
      const newStream = await openStream(deviceId);
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (source) source.disconnect();
      stream = newStream;
      source = audioCtx.createMediaStreamSource(stream);
      source.connect(workletNode);
      await refreshDeviceList(deviceId);
      const track = stream.getAudioTracks()[0];
      statusEl.textContent = "入力中: " + (track ? track.label : "既定の入力");
    } catch (err) {
      statusEl.classList.add("error");
      statusEl.textContent = "デバイスを切り替えられませんでした: " + err.message;
    } finally {
      deviceSelect.disabled = false;
    }
  }

  async function start() {
    startBtn.disabled = true;
    statusEl.classList.remove("error");
    statusEl.textContent = "マイクへのアクセスを許可してください…";
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({
        latencyHint: "interactive",
      });

      const processorSrc = document.getElementById("glitch-processor-src").textContent;
      const blobUrl = URL.createObjectURL(new Blob([processorSrc], { type: "text/javascript" }));
      await audioCtx.audioWorklet.addModule(blobUrl);

      stream = await openStream(deviceSelect.value);

      source = audioCtx.createMediaStreamSource(stream);
      workletNode = new AudioWorkletNode(audioCtx, "glitch-processor", {
        numberOfInputs: 1,
        numberOfOutputs: 1,
        outputChannelCount: [2],
      });
      outputGain = audioCtx.createGain();
      outputGain.gain.value = +volumeSlider.value / 100;

      source.connect(workletNode).connect(outputGain).connect(audioCtx.destination);

      running = true;
      scheduleNext();
      scheduleAutoDrift();

      startBtn.textContent = "停止";
      startBtn.classList.add("engaged");
      ledEl.classList.add("on");
      const track = stream.getAudioTracks()[0];
      statusEl.textContent = "入力中: " + (track ? track.label || "既定の入力" : "既定の入力");

      await refreshDeviceList(track ? track.getSettings().deviceId : "");
    } catch (err) {
      statusEl.classList.add("error");
      let detail = err.message;
      if (err.name === "NotAllowedError") {
        detail = "マイクの使用が許可されていません(ブラウザのサイト設定、またはOSのマイク権限を確認してください)";
      } else if (err.name === "NotFoundError" || err.name === "OverconstrainedError") {
        detail = "指定した入力デバイスが見つかりません。オーディオインターフェースの接続を確認してください";
      } else if (err.name === "NotReadableError") {
        detail = "他のアプリがこの入力デバイスを使用中の可能性があります";
      }
      statusEl.textContent = "マイクに接続できませんでした: " + detail;
    } finally {
      startBtn.disabled = false;
    }
  }

  function stop() {
    running = false;
    clearTimeout(schedulerTimer);
    clearTimeout(autoDriftTimer);
    if (stream) stream.getTracks().forEach((t) => t.stop());
    if (workletNode) workletNode.disconnect();
    if (source) source.disconnect();
    if (outputGain) outputGain.disconnect();
    if (audioCtx) audioCtx.close();
    audioCtx = null; stream = null; source = null; workletNode = null; outputGain = null;

    startBtn.textContent = "接続 & 開始";
    startBtn.classList.remove("engaged");
    ledEl.classList.remove("on");
    statusEl.classList.remove("error");
    statusEl.textContent = "停止中";
    deviceSelect.disabled = true;
  }

  startBtn.addEventListener("click", () => {
    if (running) stop(); else start();
  });

  deviceSelect.addEventListener("change", () => {
    switchDevice(deviceSelect.value);
  });

  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener("devicechange", () => {
      if (running) refreshDeviceList(deviceSelect.value);
    });
  }

  intensitySlider.addEventListener("input", () => { syncReadouts(); savePrefs(); });
  volumeSlider.addEventListener("input", () => {
    syncReadouts();
    if (outputGain) outputGain.gain.value = +volumeSlider.value / 100;
    savePrefs();
  });

  cycleButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      cycleButtons.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      periodMode = btn.dataset.period;
      if (periodMode === "auto") {
        autoRangeKey = "normal";
        scheduleAutoDrift();
      } else {
        clearTimeout(autoDriftTimer);
      }
      savePrefs();
    });
  });

  window.addEventListener("beforeunload", () => { if (running) stop(); });
})();
</script>
