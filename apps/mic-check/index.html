<title>Mic Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14161a;
    --panel-line: rgba(234, 230, 223, 0.1);
    --ink: #eae6df;
    --ink-dim: rgba(234, 230, 223, 0.55);
    --accent: #7fd6ff;
    --ok: #8bffb0;
    --err: #ff6b6b;
    --warn: #ffd166;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f3ef;
      --panel: #ffffff;
      --panel-line: rgba(20, 20, 20, 0.1);
      --ink: #1b1c1e;
      --ink-dim: rgba(27, 28, 30, 0.6);
      --accent: #0a84c4;
      --ok: #1a8f5a;
      --err: #c4342a;
      --warn: #9a6a00;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --panel-line: rgba(20, 20, 20, 0.1);
    --ink: #1b1c1e;
    --ink-dim: rgba(27, 28, 30, 0.6);
    --accent: #0a84c4;
    --ok: #1a8f5a;
    --err: #c4342a;
    --warn: #9a6a00;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 3rem 1.4rem 4rem;
  }
  main {
    width: 100%;
    max-width: 34rem;
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.3rem;
  }
  p.lede {
    margin: 0;
    color: var(--ink-dim);
    font-size: 0.9rem;
    line-height: 1.8;
    max-width: 32em;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 1.4rem 1.5rem;
  }
  .checklist {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .check-row {
    display: grid;
    grid-template-columns: 1.4rem 1fr;
    gap: 0.7rem;
    align-items: baseline;
    font-size: 0.92rem;
  }
  .check-row .dot {
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 50%;
    background: var(--ink-dim);
    opacity: 0.35;
    align-self: center;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  .check-row.pending .dot { background: var(--warn); opacity: 0.7; }
  .check-row.ok .dot { background: var(--ok); opacity: 1; box-shadow: 0 0 10px var(--ok); }
  .check-row.fail .dot { background: var(--err); opacity: 1; box-shadow: 0 0 10px var(--err); }
  .check-row .label { font-weight: 500; }
  .check-row .detail {
    grid-column: 2;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--ink-dim);
    line-height: 1.6;
    word-break: break-word;
  }
  .check-row.fail .detail { color: var(--err); }
  .check-row.ok .detail { color: var(--ok); }

  button {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 0.8rem 1.3rem;
    cursor: pointer;
    align-self: flex-start;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:not(:disabled):hover { filter: brightness(1.08); }

  .verdict {
    border-radius: 12px;
    padding: 1rem 1.2rem;
    font-size: 0.92rem;
    line-height: 1.8;
    display: none;
  }
  .verdict.show { display: block; }
  .verdict.good { background: color-mix(in srgb, var(--ok) 14%, transparent); border: 1px solid var(--ok); }
  .verdict.bad { background: color-mix(in srgb, var(--err) 14%, transparent); border: 1px solid var(--err); }
  .verdict strong { display: block; margin-bottom: 0.3rem; font-size: 0.98rem; }

  footer {
    font-size: 0.72rem;
    color: var(--ink-dim);
    line-height: 1.8;
  }
</style>

<main>
  <div>
    <h1>Mic Check</h1>
    <p class="lede">
      drift rack をこのページ(Artifact)として動かせるかどうかの下調べです。
      マイクへのアクセスと、AudioWorklet(空間ディレイ・バンクに必要な部品)が
      この環境で使えるかを1回だけ確認します。
    </p>
  </div>

  <div class="card">
    <div class="checklist" id="checklist">
      <div class="check-row" data-check="mic">
        <span class="dot"></span><span class="label">マイクへのアクセス</span>
        <span class="detail"></span>
      </div>
      <div class="check-row" data-check="worklet">
        <span class="dot"></span><span class="label">AudioWorklet(空間ディレイ・バンクに必要)</span>
        <span class="detail"></span>
      </div>
    </div>
  </div>

  <button id="runBtn">チェックを実行</button>

  <div class="verdict" id="verdict"></div>

  <footer>結果がそのままこの画面に表示されます。実行したらこの画面ごと教えてください。</footer>
</main>

<script>
  const runBtn = document.getElementById("runBtn");
  const verdictEl = document.getElementById("verdict");

  function setRow(check, state, detail) {
    const row = document.querySelector(`.check-row[data-check="${check}"]`);
    row.className = "check-row " + state;
    row.querySelector(".detail").textContent = detail || "";
  }

  async function runChecks() {
    runBtn.disabled = true;
    verdictEl.className = "verdict";

    setRow("mic", "pending", "確認中…");
    let micOk = false;
    let stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const track = stream.getAudioTracks()[0];
      setRow("mic", "ok", "OK: " + (track ? (track.label || "(no label)") : "stream取得"));
      micOk = true;
    } catch (err) {
      setRow("mic", "fail", `${err.name}: ${err.message}`);
    }

    setRow("worklet", "pending", "確認中…");
    let workletOk = false;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const dummyCode = `
        class DummyProcessor extends AudioWorkletProcessor {
          process() { return true; }
        }
        registerProcessor("dummy-processor", DummyProcessor);
      `;
      const blobUrl = URL.createObjectURL(new Blob([dummyCode], { type: "application/javascript" }));
      try {
        await ctx.audioWorklet.addModule(blobUrl);
        new AudioWorkletNode(ctx, "dummy-processor");
        setRow("worklet", "ok", "OK: AudioWorkletNodeを作成できました");
        workletOk = true;
      } finally {
        URL.revokeObjectURL(blobUrl);
        await ctx.close();
      }
    } catch (err) {
      setRow("worklet", "fail", `${err.name}: ${err.message}`);
    }

    if (stream) stream.getTracks().forEach((t) => t.stop());

    verdictEl.classList.add("show");
    if (micOk && workletOk) {
      verdictEl.classList.add("good");
      verdictEl.innerHTML = "<strong>この環境ならdrift rack(空間ディレイ・バンク込み)を丸ごと動かせそうです。</strong>Claudeに「動いた」と伝えてください。";
    } else if (micOk && !workletOk) {
      verdictEl.classList.add("bad");
      verdictEl.innerHTML = "<strong>マイクは使えますが、AudioWorkletがこの環境では使えません。</strong>空間ディレイ・バンク以外は動かせるかもしれません。この画面の内容をClaudeに伝えてください。";
    } else {
      verdictEl.classList.add("bad");
      verdictEl.innerHTML = "<strong>この環境ではマイクが使えませんでした。</strong>この画面の内容をClaudeに伝えてください。";
    }

    runBtn.disabled = false;
    runBtn.textContent = "もう一度実行";
  }

  runBtn.addEventListener("click", runChecks);
</script>

</body></html>
