<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>またたき — cue light</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg"></canvas>

  <main class="ui" id="ui">
    <header>
      <h1>またたき <span class="sub">matataki</span></h1>
      <p class="tagline">全体の色がひとつの合図。青＝ドラム、赤＝自分、黄＝ふたり同時。全画面にすると操作パネルは消えます（<b>Space</b>で一時停止、<b>F</b>で全画面切替、<b>R</b>または🎲でフェーダーをランダマイズ、<b>Esc</b>で戻る）。</p>
    </header>

    <div class="transport">
      <button id="playBtn" class="playBtn playing">一時停止</button>
      <button id="fsBtn" class="ghostBtn">全画面</button>
      <button id="diceBtn" class="ghostBtn diceBtn" title="フェーダーをランダマイズ">🎲</button>
    </div>

    <div class="controls">
      <label class="slider select-slider">
        <span>パターン <em>pattern</em></span>
        <select id="pattern">
          <option value="chaos">カオス（ロジスティック写像）</option>
          <option value="fibonacci">フィボナッチ（黄金比リズム）</option>
          <option value="wave">波動（数式カーブ）</option>
          <option value="random">ランダム</option>
        </select>
      </label>

      <label class="slider">
        <span>速さ <em>tempo</em></span>
        <input id="speed" type="range" min="0" max="100" value="50" />
      </label>

      <label class="slider">
        <span>ずれ <em>jitter</em></span>
        <input id="jitter" type="range" min="0" max="100" value="45" />
      </label>

      <label class="slider">
        <span>交互の強さ <em>alternation</em></span>
        <input id="alt" type="range" min="0" max="100" value="70" />
      </label>

      <label class="slider">
        <span>光の数 <em>count</em></span>
        <input id="density" type="range" min="4" max="60" value="26" />
      </label>
    </div>

    <div class="controls colorRow">
      <label class="slider">
        <span class="c-red">赤（自分）</span>
        <input id="wRed" type="range" min="1" max="100" value="40" />
      </label>
      <label class="slider">
        <span class="c-blue">青（ドラム）</span>
        <input id="wBlue" type="range" min="1" max="100" value="40" />
      </label>
      <label class="slider">
        <span class="c-yellow">黄（同時）</span>
        <input id="wYellow" type="range" min="1" max="100" value="20" />
      </label>
    </div>

    <p class="hint">3色の頻度・交互の強さ・タイミングのずれを個別に調整できます。</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
