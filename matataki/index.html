<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>またたき — random blink</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg"></canvas>

  <main class="ui">
    <header>
      <h1>またたき <span class="sub">matataki</span></h1>
      <p class="tagline">赤と青の光がランダムに点滅し、尾をひきながら漂う。動きと点滅のリズムはカオス理論・フィボナッチ・波の数式から選べる。ごくまれに黄色が差す。</p>
    </header>

    <div class="transport">
      <button id="playBtn" class="playBtn playing">一時停止</button>
      <button id="fsBtn" class="ghostBtn">全画面</button>
    </div>

    <div class="controls">
      <label class="slider select-slider">
        <span>パターン <em>pattern</em></span>
        <select id="pattern">
          <option value="chaos">カオス（ロジスティック写像）</option>
          <option value="fibonacci">フィボナッチ（黄金角螺旋）</option>
          <option value="wave">波動（リサージュ曲線）</option>
          <option value="random">ランダムウォーク</option>
        </select>
      </label>

      <label class="slider select-slider">
        <span>タイミング <em>timing</em></span>
        <select id="timing">
          <option value="random">さまざま（独立）</option>
          <option value="sync">同時</option>
          <option value="alternate">交互</option>
        </select>
      </label>

      <label class="slider">
        <span>速さ <em>speed</em></span>
        <input id="speed" type="range" min="0" max="100" value="50" />
      </label>

      <label class="slider">
        <span>ゆらぎ <em>chaos</em></span>
        <input id="chaosAmt" type="range" min="0" max="100" value="55" />
      </label>

      <label class="slider">
        <span>光の数 <em>count</em></span>
        <input id="density" type="range" min="4" max="60" value="26" />
      </label>
    </div>

    <p class="hint">同じ軌跡は二度と重なりません。パターンとタイミングはいつでも切り替えられます。</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
