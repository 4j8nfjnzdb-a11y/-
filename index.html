<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VACANCY — 尽きない部屋</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gl"></canvas>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="crosshair" id="crosshair" aria-hidden="true"></div>

  <div class="hint" id="hint">扉を抜けるたび、景色は違う場所になる。</div>

  <main class="overlay" id="startScreen">
    <div class="panel">
      <h1>VACANCY<span class="kana">空室</span></h1>
      <p class="tagline">部屋の中に、また部屋。<br />終わらない廊下を歩いて、扉の向こうへ。</p>
      <button id="startBtn" class="startBtn">CLICK TO ENTER</button>
      <p class="controls-hint">
        WASD / 矢印キー — 歩く&nbsp;&nbsp;&nbsp;マウス — 見回す&nbsp;&nbsp;&nbsp;Esc — 一時停止
      </p>
    </div>
  </main>

  <main class="overlay hidden" id="pauseScreen">
    <div class="panel">
      <h1 class="small">PAUSED</h1>
      <button id="resumeBtn" class="startBtn">CLICK TO RESUME</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
