<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CUT-UP MACHINE — カットアップ生成機</title>
<style>
:root {
  --paper: #f2ece0;
  --paper-dark: #e8e0cf;
  --ink: #221f1a;
  --ink-dim: #5b554a;
  --red: #a8321f;
  --rule: rgba(34, 31, 26, 0.18);
  --card-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #17140f;
  color: var(--ink);
  font-family: "Courier New", "Hiragino Mincho ProN", "Yu Mincho", ui-monospace, monospace;
}

.paper {
  max-width: 780px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
  background:
    radial-gradient(ellipse at top left, rgba(255,255,255,0.4), transparent 60%),
    var(--paper);
  min-height: 100vh;
  box-shadow: var(--card-shadow);
}

.masthead {
  text-align: center;
  border-bottom: 3px double var(--ink);
  padding-bottom: 1.4rem;
  margin-bottom: 2rem;
}

.masthead h1 {
  font-size: 2.1rem;
  letter-spacing: 0.03em;
  margin: 0;
  font-weight: 700;
}

.masthead h1 .dot { color: var(--red); }

.byline {
  margin: 0.5rem 0 0;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
  font-style: italic;
}

.tagline {
  margin: 0.9rem 0 0;
  font-size: 0.92rem;
  color: var(--ink-dim);
  line-height: 1.7;
}

/* ---- source blocks ---- */

.sources {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  margin-bottom: 0.8rem;
}

.source-block {
  position: relative;
  background: #fffdf7;
  border: 1px solid var(--rule);
  border-left: 4px solid var(--red);
  box-shadow: var(--card-shadow);
  padding: 0.9rem 1rem 1rem;
  transform: rotate(var(--tilt, 0deg));
}

.source-block .source-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  color: var(--ink-dim);
  margin-bottom: 0.5rem;
  text-transform: uppercase;
}

.source-block textarea {
  width: 100%;
  min-height: 110px;
  resize: vertical;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.95rem;
  line-height: 1.8;
  color: var(--ink);
  outline: none;
}

.source-block textarea::placeholder { color: #b8b0a0; }

.removeSourceBtn {
  border: none;
  background: transparent;
  color: var(--red);
  font-size: 0.72rem;
  cursor: pointer;
  letter-spacing: 0.04em;
}
.removeSourceBtn:hover { text-decoration: underline; }

.sources-actions {
  text-align: center;
  margin-bottom: 2.2rem;
}

/* ---- controls panel ---- */

.panel {
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 1.6rem 0 1.8rem;
}

.panel h2 {
  font-size: 0.85rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin: 0 0 1rem;
}

.presets {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 1.3rem;
}

.presetBtn {
  font-family: inherit;
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  padding: 0.45rem 0.9rem;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
.presetBtn:hover { background: var(--ink); color: var(--paper); }
.presetBtn.active { background: var(--red); border-color: var(--red); color: #fff; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2rem;
  margin-bottom: 1.2rem;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  font-size: 0.78rem;
  color: var(--ink-dim);
  letter-spacing: 0.03em;
}

.field select {
  font-family: inherit;
  font-size: 0.9rem;
  padding: 0.4rem 0.5rem;
  border: 1px solid var(--rule);
  background: #fffdf7;
  color: var(--ink);
}

.slider {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  font-size: 0.78rem;
  color: var(--ink-dim);
  letter-spacing: 0.03em;
}

.slider.wide { grid-column: 1 / -1; margin-bottom: 1.2rem; }
.slider small { display: block; font-size: 0.68rem; opacity: 0.8; margin-top: 0.15rem; }

.slider em {
  font-style: normal;
  color: var(--red);
  font-weight: 700;
  margin-left: 0.2em;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: var(--ink);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 0;
  background: var(--red);
  cursor: pointer;
  border: 2px solid var(--paper);
  box-shadow: 0 0 0 1px var(--ink);
}

input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 0;
  background: var(--red);
  cursor: pointer;
  border: 2px solid var(--paper);
  box-shadow: 0 0 0 1px var(--ink);
}

.toggles {
  grid-template-columns: 1fr;
  gap: 0.6rem;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.85rem;
  cursor: pointer;
}

.toggle input { accent-color: var(--red); width: 15px; height: 15px; }

.cutBtn {
  display: block;
  width: 100%;
  font-family: inherit;
  font-size: 1rem;
  letter-spacing: 0.06em;
  padding: 0.9rem;
  margin-top: 0.4rem;
  background: var(--ink);
  color: var(--paper);
  border: none;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.08s ease;
}
.cutBtn:hover { background: var(--red); }
.cutBtn:active { transform: scale(0.98); }
.cutBtn.cutting { animation: shear 0.4s ease; }

@keyframes shear {
  0% { clip-path: inset(0 0 0 0); }
  40% { clip-path: inset(0 0 0 48%); }
  60% { clip-path: inset(0 48% 0 0); }
  100% { clip-path: inset(0 0 0 0); }
}

.ghostBtn {
  font-family: inherit;
  font-size: 0.78rem;
  letter-spacing: 0.03em;
  padding: 0.5rem 1rem;
  border: 1px dashed var(--ink-dim);
  background: transparent;
  color: var(--ink-dim);
  cursor: pointer;
}
.ghostBtn:hover { color: var(--ink); border-color: var(--ink); }
.ghostBtn.small { font-size: 0.72rem; }

.hint {
  text-align: center;
  font-size: 0.72rem;
  color: var(--ink-dim);
  opacity: 0.75;
  margin: 0.9rem 0 0;
}

/* ---- results ---- */

.results {
  display: flex;
  flex-direction: column;
  gap: 1.3rem;
  margin-top: 2rem;
}

.result-card {
  position: relative;
  background: #fffdf7;
  padding: 1.2rem 1.3rem 1rem;
  box-shadow: var(--card-shadow);
  border: 1px solid var(--rule);
  opacity: 0;
  transform: translateY(10px) rotate(var(--tilt, 0deg));
  animation: rise 0.5s ease forwards;
  animation-delay: var(--delay, 0s);
}

.result-card::before {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  width: 46px;
  height: 16px;
  background: rgba(168, 50, 31, 0.35);
}

@keyframes rise {
  to { opacity: 1; transform: translateY(0) rotate(var(--tilt, 0deg)); }
}

.result-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  color: var(--ink-dim);
  text-transform: uppercase;
  margin-bottom: 0.6rem;
}

.result-actions { display: flex; gap: 0.6rem; }

.result-actions button {
  font-family: inherit;
  font-size: 0.68rem;
  border: none;
  background: transparent;
  color: var(--red);
  cursor: pointer;
  letter-spacing: 0.03em;
}
.result-actions button:hover { text-decoration: underline; }

.result-text {
  font-size: 1.05rem;
  line-height: 2.1;
  white-space: pre-wrap;
  word-break: break-word;
}

.result-text .frag {
  display: inline;
}
.result-text .frag.seam::before {
  content: "/ ";
  color: var(--red);
  opacity: 0.55;
}

.footnote {
  text-align: center;
  margin-top: 3rem;
  font-size: 0.72rem;
  color: var(--ink-dim);
  font-style: italic;
  opacity: 0.7;
}

@media (max-width: 520px) {
  .paper { padding: 1.6rem 1rem 3rem; }
  .masthead h1 { font-size: 1.6rem; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <div class="paper">
    <header class="masthead">
      <h1>CUT-UP<span class="dot">.</span>MACHINE</h1>
      <p class="byline">— after William S. Burroughs &amp; Brion Gysin —</p>
      <p class="tagline">テクストを切り、並べ替え、まだ誰も読んだことのない一節をつくる。</p>
    </header>

    <section class="sources" id="sources">
      <!-- source blocks injected by script -->
    </section>

    <div class="sources-actions">
      <button id="addSourceBtn" class="ghostBtn small">＋ 素材を追加する（フォールドイン用）</button>
    </div>

    <section class="panel">
      <h2>切り方の設定</h2>

      <div class="presets" id="presets">
        <button class="presetBtn" data-preset="light">ライト</button>
        <button class="presetBtn" data-preset="medium">ミディアム</button>
        <button class="presetBtn" data-preset="heavy">ヘビー</button>
        <button class="presetBtn" data-preset="chaos">カオス</button>
      </div>

      <div class="grid">
        <label class="field">
          <span class="field-label">分割の単位</span>
          <select id="unit">
            <option value="char">文字</option>
            <option value="word" selected>単語</option>
            <option value="line">行</option>
            <option value="sentence">文（。！？区切り）</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">出力の数</span>
          <select id="outputCount">
            <option value="1">少（1）</option>
            <option value="3" selected>普通（3）</option>
            <option value="6">多（6）</option>
            <option value="12">特盛（12）</option>
          </select>
        </label>
      </div>

      <div class="grid">
        <label class="slider">
          <span>断片の長さ：最小 <em id="chunkMinVal">1</em></span>
          <input id="chunkMin" type="range" min="1" max="20" value="1" />
        </label>
        <label class="slider">
          <span>断片の長さ：最大 <em id="chunkMaxVal">3</em></span>
          <input id="chunkMax" type="range" min="1" max="20" value="3" />
        </label>
      </div>

      <label class="slider wide">
        <span>ランダムの強さ <em id="randomnessVal">50</em>% <small>(0 = 元の並び／100 = 完全シャッフル)</small></span>
        <input id="randomness" type="range" min="0" max="100" value="50" />
      </label>

      <div class="grid toggles">
        <label class="toggle">
          <input type="checkbox" id="foldIn" />
          <span>フォールドイン（複数素材を交互に織り込む）</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="keepPunct" checked />
          <span>句読点・記号を保持する</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="capRandom" />
          <span>大文字/小文字をランダムに揺らす（英字）</span>
        </label>
      </div>

      <button id="cutBtn" class="cutBtn">✂ カットアップする</button>
      <p class="hint">同じ設定でも、結果は毎回変わります。何度でも切り直せます。</p>
    </section>

    <section class="results" id="results"></section>

    <footer class="footnote">
      <p>“Cut-ups are for everyone.” — B. Gysin</p>
    </footer>
  </div>

  <script>
// CUT-UP MACHINE
//
// A generative text tool in the tradition of William Burroughs and
// Brion Gysin's cut-up technique: take one or more source texts, slice
// them into fragments (characters / words / lines / sentences), and
// reassemble the fragments in a new order. "Fold-in" mode interleaves
// fragments from multiple sources instead of shuffling a single one.
//
// The amount of reordering is a first-class control (0 = original
// order, 100 = full shuffle) rather than fixed, so the effect can be
// tuned from a light rearrangement to total noise.

(() => {
  const sourcesEl = document.getElementById("sources");
  const addSourceBtn = document.getElementById("addSourceBtn");
  const presetsEl = document.getElementById("presets");
  const unitEl = document.getElementById("unit");
  const outputCountEl = document.getElementById("outputCount");
  const chunkMinEl = document.getElementById("chunkMin");
  const chunkMaxEl = document.getElementById("chunkMax");
  const chunkMinVal = document.getElementById("chunkMinVal");
  const chunkMaxVal = document.getElementById("chunkMaxVal");
  const randomnessEl = document.getElementById("randomness");
  const randomnessVal = document.getElementById("randomnessVal");
  const foldInEl = document.getElementById("foldIn");
  const keepPunctEl = document.getElementById("keepPunct");
  const capRandomEl = document.getElementById("capRandom");
  const cutBtn = document.getElementById("cutBtn");
  const resultsEl = document.getElementById("results");

  const PLACEHOLDERS = [
    "ここにテクストを貼り付けてください(複数行OK・目安30行程度)。",
    "2つ目の素材。ここに別のテクストを入れると、フォールドインで最初の素材と織り交ぜられます。",
    "3つ目の素材。",
  ];

  const PRESETS = {
    light:  { unit: "sentence", min: 1, max: 2, randomness: 20 },
    medium: { unit: "word", min: 2, max: 5, randomness: 50 },
    heavy:  { unit: "word", min: 1, max: 3, randomness: 80 },
    chaos:  { unit: "char", min: 1, max: 6, randomness: 100 },
  };

  let sourceSeq = 0;

  // ---- source blocks --------------------------------------------------

  function addSourceBlock(prefill) {
    const id = ++sourceSeq;
    const block = document.createElement("div");
    block.className = "source-block";
    block.dataset.id = id;
    block.style.setProperty("--tilt", `${(Math.random() * 1.4 - 0.7).toFixed(2)}deg`);

    const idx = sourcesEl.children.length;
    block.innerHTML = `
      <div class="source-head">
        <span>素材 ${idx + 1}</span>
        <button class="removeSourceBtn" type="button">取り除く</button>
      </div>
      <textarea placeholder="${PLACEHOLDERS[idx] || "追加の素材テクスト。"}"></textarea>
    `;

    if (prefill) block.querySelector("textarea").value = prefill;

    block.querySelector(".removeSourceBtn").addEventListener("click", () => {
      if (sourcesEl.children.length <= 1) return;
      block.remove();
      renumberSources();
    });

    sourcesEl.appendChild(block);
    updateRemoveVisibility();
  }

  function renumberSources() {
    [...sourcesEl.children].forEach((block, i) => {
      block.querySelector(".source-head span").textContent = `素材 ${i + 1}`;
    });
    updateRemoveVisibility();
  }

  function updateRemoveVisibility() {
    const only = sourcesEl.children.length <= 1;
    sourcesEl.querySelectorAll(".removeSourceBtn").forEach((btn) => {
      btn.style.visibility = only ? "hidden" : "visible";
    });
  }

  addSourceBtn.addEventListener("click", () => {
    if (sourcesEl.children.length >= 4) return;
    addSourceBlock();
  });

  addSourceBlock();

  // ---- presets & control wiring ----------------------------------------

  function applyPreset(name) {
    const p = PRESETS[name];
    if (!p) return;
    unitEl.value = p.unit;
    chunkMinEl.value = p.min;
    chunkMaxEl.value = p.max;
    randomnessEl.value = p.randomness;
    syncLabels();
    [...presetsEl.children].forEach((b) => b.classList.toggle("active", b.dataset.preset === name));
  }

  presetsEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".presetBtn");
    if (!btn) return;
    applyPreset(btn.dataset.preset);
  });

  [unitEl, chunkMinEl, chunkMaxEl, randomnessEl, foldInEl, keepPunctEl, capRandomEl].forEach((el) => {
    el.addEventListener("input", () => {
      [...presetsEl.children].forEach((b) => b.classList.remove("active"));
    });
  });

  chunkMinEl.addEventListener("input", () => {
    if (+chunkMinEl.value > +chunkMaxEl.value) chunkMaxEl.value = chunkMinEl.value;
    syncLabels();
  });
  chunkMaxEl.addEventListener("input", () => {
    if (+chunkMaxEl.value < +chunkMinEl.value) chunkMinEl.value = chunkMaxEl.value;
    syncLabels();
  });
  randomnessEl.addEventListener("input", syncLabels);

  function syncLabels() {
    chunkMinVal.textContent = chunkMinEl.value;
    chunkMaxVal.textContent = chunkMaxEl.value;
    randomnessVal.textContent = randomnessEl.value;
  }
  syncLabels();
  applyPreset("medium");

  // ---- tokenizers --------------------------------------------------------

  function splitWords(text) {
    return text.split(/\s+/).filter((t) => t.length > 0);
  }

  function splitLines(text) {
    return text.split(/\r?\n/).filter((t) => t.trim().length > 0);
  }

  function splitSentences(text) {
    const matches = text.match(/[^。！？.!?]+[。！？.!?]*/g) || [];
    return matches.map((s) => s.trim()).filter((s) => s.length > 0);
  }

  function groupTokens(tokens, min, max, joinStr) {
    const chunks = [];
    let i = 0;
    while (i < tokens.length) {
      const size = min === max ? min : min + Math.floor(Math.random() * (max - min + 1));
      chunks.push(tokens.slice(i, i + size).join(joinStr));
      i += size;
    }
    return chunks;
  }

  function tokenizeChars(text, min, max) {
    const chars = [...text].filter((c) => c.length > 0);
    const chunks = [];
    let i = 0;
    while (i < chars.length) {
      const size = min === max ? min : min + Math.floor(Math.random() * (max - min + 1));
      chunks.push(chars.slice(i, i + size).join(""));
      i += size;
    }
    return chunks.filter((c) => c.trim().length > 0);
  }

  function tokenize(text, unit, min, max) {
    switch (unit) {
      case "char": return tokenizeChars(text, min, max);
      case "line": return groupTokens(splitLines(text), min, max, "\n");
      case "sentence": return groupTokens(splitSentences(text), min, max, " ");
      case "word":
      default: return groupTokens(splitWords(text), min, max, " ");
    }
  }

  // ---- reordering ---------------------------------------------------------

  function applyShuffle(arr, randomness) {
    const copy = arr.slice();
    const n = copy.length;
    if (randomness <= 0 || n < 2) return copy;
    if (randomness >= 95) {
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    const swaps = Math.round(n * (randomness / 100) * 1.3);
    for (let i = 0; i < swaps; i++) {
      const a = Math.floor(Math.random() * n);
      const b = Math.floor(Math.random() * n);
      [copy[a], copy[b]] = [copy[b], copy[a]];
    }
    return copy;
  }

  function foldInMerge(chunkArrays) {
    const pools = chunkArrays.map((a) => a.slice());
    const result = [];
    while (pools.some((p) => p.length)) {
      const nonEmpty = pools.map((p, i) => i).filter((i) => pools[i].length > 0);
      const pick = nonEmpty[Math.floor(Math.random() * nonEmpty.length)];
      const takeCount = Math.min(pools[pick].length, Math.random() < 0.35 ? 2 : 1);
      for (let k = 0; k < takeCount; k++) result.push(pools[pick].shift());
    }
    return result;
  }

  // ---- post-processing -----------------------------------------------------

  function stripPunct(text) {
    return text.replace(/[、。！？「」『』・…,.!?;:'"()（）\[\]{}]/g, "");
  }

  function randomizeCase(text) {
    return text.replace(/[a-zA-Z]/g, (ch) => (Math.random() < 0.35
      ? (ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase())
      : ch));
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // ---- generation -----------------------------------------------------------

  function readOptions() {
    return {
      unit: unitEl.value,
      min: +chunkMinEl.value,
      max: +chunkMaxEl.value,
      randomness: +randomnessEl.value,
      foldIn: foldInEl.checked,
      keepPunct: keepPunctEl.checked,
      capRandom: capRandomEl.checked,
    };
  }

  function readSourceTexts() {
    return [...sourcesEl.querySelectorAll("textarea")]
      .map((t) => t.value)
      .filter((t) => t.trim().length > 0);
  }

  function generateOne(sourceTexts, options) {
    const chunkArrays = sourceTexts.map((text, idx) =>
      tokenize(text, options.unit, options.min, options.max).map((t) => ({ text: t, sourceIndex: idx }))
    );

    const multiSource = sourceTexts.length > 1;
    let combined;

    if (options.foldIn && multiSource) {
      combined = foldInMerge(chunkArrays);
      combined = applyShuffle(combined, options.randomness * 0.6);
    } else {
      combined = chunkArrays.flat();
      combined = applyShuffle(combined, options.randomness);
    }

    if (!options.keepPunct) {
      combined = combined.map((c) => ({ ...c, text: stripPunct(c.text) }));
    }
    if (options.capRandom) {
      combined = combined.map((c) => ({ ...c, text: randomizeCase(c.text) }));
    }

    combined = combined.filter((c) => c.text.trim().length > 0 || options.unit === "line");
    return { chunks: combined, multiSource };
  }

  function chunksToHtml(chunks, unit, multiSource) {
    const sep = { char: "", word: " ", sentence: " ", line: "\n" }[unit] ?? " ";
    let html = "";
    chunks.forEach((c, i) => {
      const seam = multiSource && i > 0 && c.sourceIndex !== chunks[i - 1].sourceIndex;
      if (i > 0) html += escapeHtml(sep);
      html += `<span class="frag${seam ? " seam" : ""}">${escapeHtml(c.text)}</span>`;
    });
    return html;
  }

  function chunksToPlainText(chunks, unit) {
    const sep = { char: "", word: " ", sentence: " ", line: "\n" }[unit] ?? " ";
    return chunks.map((c) => c.text).join(sep);
  }

  function renderCard(index, sourceTexts, options) {
    const card = document.createElement("div");
    card.className = "result-card";
    card.style.setProperty("--tilt", `${(Math.random() * 1.6 - 0.8).toFixed(2)}deg`);
    card.style.setProperty("--delay", `${Math.min(index, 8) * 0.07}s`);

    function paint() {
      const { chunks, multiSource } = generateOne(sourceTexts, options);
      card.querySelector(".result-text").innerHTML = chunksToHtml(chunks, options.unit, multiSource);
      card.dataset.plain = chunksToPlainText(chunks, options.unit);
    }

    card.innerHTML = `
      <div class="result-head">
        <span>CUT #${String(index + 1).padStart(2, "0")}</span>
        <span class="result-actions">
          <button type="button" class="regenBtn">切り直す</button>
          <button type="button" class="copyBtn">コピー</button>
        </span>
      </div>
      <div class="result-text"></div>
    `;

    card.querySelector(".regenBtn").addEventListener("click", () => {
      card.style.animation = "none";
      void card.offsetWidth;
      card.style.animation = "";
      paint();
    });

    card.querySelector(".copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(card.dataset.plain || "");
        const btn = card.querySelector(".copyBtn");
        const original = btn.textContent;
        btn.textContent = "コピーした";
        setTimeout(() => { btn.textContent = original; }, 1200);
      } catch (e) {
        // clipboard unavailable; silently ignore
      }
    });

    paint();
    return card;
  }

  function runCutUp() {
    const sourceTexts = readSourceTexts();
    if (sourceTexts.length === 0) {
      resultsEl.innerHTML = `<p class="hint">まず、上の欄にテクストを入力してください。</p>`;
      return;
    }

    const options = readOptions();
    const count = +outputCountEl.value;

    resultsEl.innerHTML = "";
    for (let i = 0; i < count; i++) {
      resultsEl.appendChild(renderCard(i, sourceTexts, options));
    }
  }

  cutBtn.addEventListener("click", () => {
    cutBtn.classList.remove("cutting");
    void cutBtn.offsetWidth;
    cutBtn.classList.add("cutting");
    runCutUp();
  });
})();
  </script>
</body>
</html>
