<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>atelier — app gallery &amp; mixer</title>
<link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <div class="stage" id="stage">
    <div class="world" id="world"></div>
    <div class="floor" id="floor" aria-hidden="true"></div>
  </div>

  <header class="hud">
    <h1>atelier <span class="sub">アトリエ</span></h1>
    <p class="tagline">作ったものを並べて、奥行きの中で重ねてミックスする場所。</p>
  </header>

  <div class="toolbar">
    <button id="addBtn" class="pill">＋ 追加</button>
    <button id="shuffleBtn" class="pill ghost">シャッフル</button>
    <button id="resetViewBtn" class="pill ghost">視点リセット</button>
  </div>

  <p class="hint">
    背景ドラッグで移動 / ホイールで空間ズーム / カードにホイールで奥行き調整
  </p>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-label="アイテムを追加">
      <div class="modal-tabs">
        <button class="tab active" data-tab="builtin">作ったアプリ</button>
        <button class="tab" data-tab="html">コードを貼る</button>
        <button class="tab" data-tab="url">URLを追加</button>
      </div>

      <div class="tab-panel" data-panel="builtin">
        <p class="modal-hint">これまでこの場所に加えたアプリから選ぶ。</p>
        <div id="builtinList" class="builtin-list"></div>
      </div>

      <div class="tab-panel" data-panel="html" hidden>
        <p class="modal-hint">アーティファクトの HTML をそのまま貼り付けると、1枚のカードになる。</p>
        <textarea id="htmlInput" placeholder="&lt;!doctype html&gt;..."></textarea>
        <div class="modal-actions">
          <input id="htmlTitle" type="text" placeholder="タイトル(任意)" />
          <button id="htmlAddBtn" class="pill">追加</button>
        </div>
      </div>

      <div class="tab-panel" data-panel="url" hidden>
        <p class="modal-hint">埋め込み可能な URL を指定する(サイト側の設定で拒否される場合あり)。</p>
        <input id="urlInput" type="url" placeholder="https://..." />
        <div class="modal-actions">
          <input id="urlTitle" type="text" placeholder="タイトル(任意)" />
          <button id="urlAddBtn" class="pill">追加</button>
        </div>
      </div>

      <button id="modalCloseBtn" class="modal-close" aria-label="閉じる">×</button>
    </div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
