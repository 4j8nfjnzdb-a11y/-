<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>glitchbox — リアルタイム・ギター・グリッチ</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="glitchOverlay" aria-hidden="true"></div>

  <main class="ui">
    <header>
      <h1>glitchbox</h1>
      <p class="tagline">
        ギターの音をそのまま通しながら、不規則な周期でふっとバグを起こす。
        いつ来るかは分からない — でも完全なランダムでもない。
      </p>
    </header>

    <p class="warn">⚠ ハウリング防止のため、ヘッドホンでの使用を推奨します。</p>

    <div class="transport">
      <button id="startBtn" class="playBtn">マイク接続 &amp; 開始</button>
      <label class="toggle">
        <input id="glitchEnabled" type="checkbox" checked />
        <span>グリッチ有効</span>
      </label>
    </div>

    <p id="status" class="status">停止中</p>

    <div class="deviceGroup">
      <span class="groupLabel">入力デバイス</span>
      <select id="deviceSelect" class="deviceSelect" disabled>
        <option value="">接続すると一覧が表示されます</option>
      </select>
    </div>

    <div class="periodGroup">
      <span class="groupLabel">発生周期</span>
      <div class="periodButtons" role="group">
        <button data-period="frequent" class="periodBtn">頻繁</button>
        <button data-period="normal" class="periodBtn active">普通</button>
        <button data-period="rare" class="periodBtn">稀</button>
        <button data-period="auto" class="periodBtn">自動で変化</button>
      </div>
    </div>

    <div class="controls">
      <label class="slider">
        <span>強度 <em>intensity</em></span>
        <input id="intensity" type="range" min="0" max="100" value="55" />
      </label>
      <label class="slider">
        <span>出力音量 <em>volume</em></span>
        <input id="volume" type="range" min="0" max="100" value="80" />
      </label>
    </div>

    <div id="lastGlitch" class="lastGlitch" aria-live="polite"></div>

    <hr class="rule" />

    <div class="periodGroup">
      <span class="groupLabel">
        ピッチドリフト
        <label class="toggle inlineToggle">
          <input id="pitchEnabled" type="checkbox" checked />
          <span>有効</span>
        </label>
      </span>
      <div class="controls">
        <label class="slider">
          <span>深さ <em>depth</em></span>
          <input id="pitchDepth" type="range" min="0" max="100" value="35" />
        </label>
        <label class="slider">
          <span>速さ <em>rate</em></span>
          <input id="pitchRate" type="range" min="0" max="100" value="20" />
        </label>
      </div>
    </div>

    <p class="hint">同じ周期は二度と繰り返さない。バーストで連発することもあれば、長く何も起きないこともある。ピッチドリフトは常時かかり続け、数十秒かけて上下にゆっくり滑るように動く。</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
