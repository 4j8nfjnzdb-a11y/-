<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROOM 303</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage"></div>

  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="noise"></div>

  <div id="crosshair"></div>

  <div id="prompt" class="hidden"></div>

  <div id="hud" class="hidden">
    <div id="hudLeft">ROOM&nbsp;303</div>
    <div id="hudButtons">
      <button id="effectBtn" class="hudBtn">EFFECT</button>
      <button id="viewBtn" class="hudBtn">視点切替</button>
    </div>
  </div>

  <div id="overlay">
    <div id="overlayGlow"></div>
    <h1 id="title" data-text="ROOM 303">ROOM 303</h1>
    <p id="subtitle">誰かが、まだここにいる。</p>
    <div id="startBtn">クリックして入室する</div>
    <div id="help">
      <p><b>WASD</b> 移動　<b>マウス</b> 視点　<b>E</b> ソファに座る</p>
      <p><b>T</b> / 視点切替ボタン　—　上から部屋を見る</p>
      <p><b>G</b> / EFFECTボタン　—　部屋に干渉する</p>
      <p class="small">Esc で退室（ポインタ解除）</p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
