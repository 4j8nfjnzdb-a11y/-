<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>つぶやき57577 — ひらがな・カットアップ生成器</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>つぶやき<span class="num">57577</span></h1>
      <p class="tagline">ひらがなを一字ずつ気まぐれに拾いつづけ、女性の声でつぶやかせる。意味は通じなくていい。</p>
    </header>

    <section class="controls" aria-label="操作">
      <button id="playBtn" class="playBtn" type="button">はじめる</button>

      <div class="field">
        <span class="fieldLabel">空白</span>
        <select id="spacingSelect">
          <option value="tight">ぎっしり</option>
          <option value="normal" selected>ふつう</option>
          <option value="airy">すきま</option>
          <option value="chaotic">でたらめ</option>
        </select>
      </div>

      <div class="field">
        <span class="fieldLabel">速さ</span>
        <select id="speedSelect">
          <option value="slow">ゆったり</option>
          <option value="normal" selected>ふつう</option>
          <option value="fast">きびきび</option>
          <option value="veryfast">はやい</option>
          <option value="ultra">暴走</option>
        </select>
      </div>

      <button id="diceBtn" class="diceBtn" type="button" aria-pressed="false">
        <span class="diceIcon">🎲</span> サイコロ速度
      </button>

      <div class="field">
        <span class="fieldLabel">サイコロの型</span>
        <select id="patternSelect">
          <option value="drift" selected>ドリフト</option>
          <option value="jump">ジャンプ</option>
          <option value="wave">うねり</option>
          <option value="chaos">カオス</option>
        </select>
      </div>
    </section>

    <p class="status" id="statusLine">声を準備中…</p>

    <section class="feed" id="feed" aria-label="つぶやき"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
