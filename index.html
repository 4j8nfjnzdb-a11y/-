<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CIRCUIT CHOP — modular drum sample mangler</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>CIRCUIT CHOP <span class="sub">4スロット・モジュラー・ドラムサンプルミキサー</span></h1>
    <div class="transport">
      <button id="playBtn" class="playBtn">▶ 再生</button>
      <label class="bpmField">
        <span>BPM</span>
        <input id="bpm" type="number" min="40" max="220" value="120" />
      </label>
      <label class="mixField">
        <span>MASTER</span>
        <input id="masterVol" type="range" min="0" max="1" step="0.01" value="0.85" />
      </label>
      <div class="meter"><div id="meterBar" class="meterBar"></div></div>
    </div>
  </header>

  <main>
    <section id="slots" class="slots"></section>

    <section class="patchSection">
      <div class="patchToolbar">
        <span class="patchTitle">PATCH BAY <span class="sub">中継ボックスをつないで回路を組む</span></span>
        <div class="addButtons">
          <button data-add="glitch">+ GLITCH</button>
          <button data-add="filter">+ FILTER</button>
          <button data-add="crush">+ CRUSH</button>
          <button data-add="delay">+ DELAY</button>
          <button data-add="reverb">+ REVERB</button>
          <button data-add="pitch">+ PITCH</button>
          <button data-add="gate">+ GATE</button>
          <button data-add="mod">+ MOD</button>
          <button id="clearPatchBtn" class="ghostBtn">配線リセット</button>
        </div>
      </div>
      <div id="patchViewport" class="patchViewport">
        <div id="patchCanvas" class="patchCanvas">
          <svg id="cableLayer" class="cableLayer"></svg>
        </div>
      </div>
      <p class="hint">出力ポート（右の丸）をドラッグして、別のボックスの入力ポート（左の丸）へつなげます。ケーブル中央の×で切断。SLOT はそれぞれの出力、MASTER が最終出力です。ひし形（MOD）ポートは制御信号用 — MOD ボックスの出力を、対応するひし形の入力ポートを持つボックスの主要パラメータへつなぐと、その値が自動でゆっくり揺らぎ続けます。</p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
