<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>線音 SenOn — 描いて奏でる非線形DAW</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="quickBar">
      <div class="quickBarRow">
        <button id="playBtn" class="playBtn">再生</button>

        <div class="tools">
          <button id="toolPen" class="toolBtn active" data-tool="pen" title="ペン">✎</button>
          <button id="toolPath" class="toolBtn" data-tool="path" title="スキャンパスを描く">〜</button>
          <button id="toolEraser" class="toolBtn" data-tool="eraser" title="消しゴム">⌫</button>
        </div>

        <button id="undoBtn" class="ghostBtn iconBtn" title="ひとつ戻す">↶</button>
        <button id="clearBtn" class="ghostBtn iconBtn" title="全て消去">🗑</button>

        <details class="settingsDrawer">
        <summary class="ghostBtn">⚙ 設定</summary>
        <div class="drawerBody">
          <section class="drawerSection">
            <h2>再生</h2>
            <div class="drawerRow">
              <label class="field">
                <span>スキャン方式</span>
                <select id="scanMode">
                  <option value="sweep">線形スイープ</option>
                  <option value="bounce">バウンド</option>
                  <option value="path">描いたパス</option>
                  <option value="wander">ゆらぎ（ワンダー）</option>
                </select>
              </label>
              <label class="field slider">
                <span>速度</span>
                <input id="speed" type="range" min="1" max="100" value="45" />
              </label>
              <label class="toggle">
                <input id="loopToggle" type="checkbox" checked />
                <span>ループ</span>
              </label>
              <label class="toggle">
                <input id="reverseToggle" type="checkbox" />
                <span>逆再生</span>
              </label>
            </div>
          </section>

          <section class="drawerSection">
            <h2>音階 / エフェクト</h2>
            <div class="drawerRow">
              <label class="field">
                <span>キー</span>
                <select id="keySelect"></select>
              </label>
              <label class="field">
                <span>スケール</span>
                <select id="scaleSelect"></select>
              </label>
              <label class="field slider">
                <span>フィルター</span>
                <input id="filterKnob" type="range" min="0" max="100" value="100" />
              </label>
              <label class="field slider">
                <span>空間</span>
                <input id="spaceKnob" type="range" min="0" max="100" value="54" />
              </label>
            </div>
          </section>

          <section class="drawerSection">
            <h2>トラックごとの音色</h2>
            <div class="tracks" id="tracks">
              <!-- filled by JS -->
            </div>
          </section>

          <section class="drawerSection">
            <h2>サンプル</h2>
            <div class="samplePanel">
              <div class="sampleRow">
                <label class="fileBtn ghostBtn">
                  音源を読み込む
                  <input id="sampleFile" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.webm" hidden />
                </label>
                <button id="recordBtn" class="ghostBtn">🎙 録音</button>
                <span id="sampleStatus" class="sampleStatus">未読み込み</span>
              </div>
              <div class="sampleRow">
                <label class="field slider small">
                  <span>チョップ数 <em id="chopCountLabel">8</em></span>
                  <input id="chopCount" type="range" min="1" max="32" value="8" />
                </label>
                <button id="chopBtn" class="ghostBtn" disabled>チョップ実行</button>
              </div>
              <canvas id="waveCanvas" class="waveCanvas"></canvas>
            </div>
          </section>
        </div>
        </details>
      </div>

      <div class="colorBar" id="colorBar">
        <!-- filled by JS: one big swatch button per track -->
      </div>

      <div class="brushBar" id="brushBar">
        <!-- filled by JS: brush choice, affects line look and timbre -->
      </div>
    </div>

    <div class="canvasWrap">
      <canvas id="stage"></canvas>
      <div id="hint" class="hint">指かマウスで線を描くとメロディになります</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
