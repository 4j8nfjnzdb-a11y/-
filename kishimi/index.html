<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>軋 Kishimi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an optical-printer bench. The gate (monitor) stays in view on the
   left (on top, sticky, on phones); the right column holds the three reels,
   the two printing passes, the feedback loop and the output settings.
   A, B and C carry the colours of three-colour separation records (red,
   green, blue), which is also how the 色層 mode deals channels out.
   Deliberately single-theme dark: composites are judged against a dark
   surround. The amber is the darkroom safelight, used only for "on". */
:root{
  --bg:#13120f; --panel:#1c1a16; --well:#0b0a08; --ink:#ece6da; --dim:#aaa293; --faint:#6f685c;
  --line:rgba(236,230,218,.10); --line2:rgba(236,230,218,.22);
  --amber:#f0b45c; --amber-soft:rgba(240,180,92,.14); --amber-ink:#1a1206;
  --a:#ee6b4f; --b:#6cc28f; --c:#77a0f4; --rec:#ff4b3e;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:1480px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}

.top{display:flex;align-items:flex-end;gap:8px 24px;flex-wrap:wrap}
.top h1{margin:0;display:flex;align-items:flex-end;gap:12px;line-height:1}
.top .glyph{font-family:var(--f-disp);font-weight:800;font-size:clamp(46px,7vw,68px);letter-spacing:0;position:relative;display:inline-block;
  text-shadow:-.035em .02em 0 rgba(238,107,79,.55),.03em -.015em 0 rgba(119,160,244,.5)}
.top .nm{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:13px;letter-spacing:.22em;color:var(--dim);padding-bottom:6px}
.top .nm small{font-family:var(--f-body);font-size:12px;letter-spacing:.3em;color:var(--faint)}
.top p{margin:0;color:var(--dim);max-width:66ch;min-width:0;flex:1 1 320px;text-wrap:pretty}

.main{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:20px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.stageCol{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:981px) and (min-height:700px){.stageCol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
@media (max-width:980px){
  .stageCol{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 6px;margin-block:-8px 0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .readout,.msg:empty{display:none}
}
.stage{position:relative;display:flex;justify-content:center;align-items:center;background:var(--well);border-radius:4px;min-height:220px;overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-position:center}
#cv{display:block;max-width:100%;width:min(100%, calc(var(--maxh) * var(--asp,1)));height:auto;background:#000}
.stageCol{--maxh:calc(100vh - 210px)}
@media (max-width:980px){.stageCol{--maxh:38vh}.stage{min-height:0}}
.stage.on{outline:2px dashed var(--amber);outline-offset:-8px}
.stage.loaded{background-image:none}
.stage:not(.loaded) #cv{visibility:hidden}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;color:var(--dim);font-size:13px}
.empty b{font-family:var(--f-disp);font-weight:800;font-size:clamp(22px,3.2vw,30px);letter-spacing:.06em;color:var(--ink)}
.empty p{margin:0;max-width:40ch;text-wrap:pretty}
.recBadge{position:absolute;top:10px;left:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:#fff;background:rgba(0,0,0,.62);padding:3px 9px;border-radius:3px;display:flex;align-items:center;gap:7px}
.recBadge i{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.recBadge i{animation:none}}

.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.transport .grow{flex:1}
.readout{margin:0;font-family:var(--f-mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.msg{margin:0;font-size:13px;color:var(--dim);min-height:1.2em;text-wrap:pretty}
.msg.err{color:#ffb4a6}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:5px;border:1px solid var(--line2);background:var(--panel);font-size:13.5px;line-height:1.25;white-space:nowrap}
.btn:hover:not(:disabled){border-color:rgba(236,230,218,.4)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:transparent;font-weight:700}
.btn.rec{border-color:rgba(255,75,62,.5);color:#ffd0ca}
.btn.rec[aria-pressed="true"]{background:var(--rec);color:#fff;border-color:transparent}
.btn .dot{width:9px;height:9px;border-radius:50%;background:var(--rec)}
.btn.rec[aria-pressed="true"] .dot{background:#fff}
.btn.small{padding:4px 9px;font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cardHead h2{margin:0;font-family:var(--f-disp);font-weight:800;font-size:18px;letter-spacing:.08em}
.cardHead .hint{font-size:12px;color:var(--faint)}
.cardHead .grow{flex:1}
.note{margin:0;font-size:12.5px;color:var(--dim);text-wrap:pretty}

/* reels */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0;--k:var(--a)}
.slot[data-i="1"]{--k:var(--b)} .slot[data-i="2"]{--k:var(--c)}
.drop{position:relative;aspect-ratio:1;max-width:100%;width:100%;border-radius:4px;border:1px dashed var(--line2);background:var(--well);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0}
.drop:hover{border-color:var(--k)}
.drop.on{border:2px solid var(--amber)}
.drop.full{border-style:solid;border-color:var(--k)}
.drop img,.drop video,.drop canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.drop .ltr{position:absolute;left:6px;top:4px;z-index:1;font-family:var(--f-mono);font-weight:500;font-size:15px;color:var(--k);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.drop .ph{font-size:12px;color:var(--faint)}
.slot .meta{display:flex;align-items:center;gap:6px;min-width:0;font-size:11.5px;color:var(--dim)}
.slot .meta .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono)}
.slot .x{border:0;background:none;color:var(--faint);padding:2px 4px;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.slot .x:hover{color:var(--ink)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mode{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 6px;border-radius:4px;border:1px solid var(--line);background:var(--well);min-width:0}
.mode b{font-family:var(--f-disp);font-weight:800;font-size:17px;line-height:1.15;letter-spacing:.02em}
.mode i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;color:var(--faint);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mode[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.mode[aria-pressed="true"] i{color:var(--amber)}
.desc{margin:0;font-size:13px;color:var(--dim);text-wrap:pretty;min-height:2.6em}

/* role rows */
.roles{display:flex;flex-direction:column;gap:7px}
.role{display:grid;grid-template-columns:6.6em minmax(0,1fr);align-items:center;gap:8px}
.role > span{font-size:12.5px;color:var(--dim)}
.role > span em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-right:5px}
.seg{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.seg button{padding:3px 7px;border-radius:3px;border:1px solid var(--line);background:var(--well);font-size:12.5px;line-height:1.4;min-width:2.1em;--k:var(--ink)}
.seg button.k-a{--k:var(--a)} .seg button.k-b{--k:var(--b)} .seg button.k-c{--k:var(--c)}
.seg button.k-a,.seg button.k-b,.seg button.k-c{font-family:var(--f-mono);color:var(--k)}
.seg button[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft);color:var(--ink)}
.seg button.k-a[aria-pressed="true"],.seg button.k-b[aria-pressed="true"],.seg button.k-c[aria-pressed="true"]{border-color:var(--k);background:color-mix(in srgb,var(--k) 22%,transparent);color:var(--ink)}
.seg button.missing{opacity:.45}

/* sliders */
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.sl{display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.sl label,.sl .lab{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--dim)}
.sl output{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.sl .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:-2px}
.sl.choice .seg{margin-top:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;border-radius:50%;background:var(--ink);border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:0}
.tsl{padding:10px 10px 8px;border:1px solid var(--line);border-radius:4px;background:var(--well)}
.tsl .trk{position:relative}
.tsl .tick{position:absolute;top:3px;bottom:3px;width:2px;margin-left:-1px;left:calc(7px + var(--tv,0) * (100% - 14px));background:var(--amber);border-radius:1px;pointer-events:none}
.tsl.still .tick{display:none}
.tsl .motion{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.tsl .motion .params{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}

.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:3px 11px 3px 4px;background:var(--well)}
.switch i{width:26px;height:16px;border-radius:999px;background:var(--line2);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--ink);transition:left .15s}
.switch[aria-pressed="true"]{color:var(--ink)}
.switch[aria-pressed="true"] i{background:var(--amber)}
.switch[aria-pressed="true"] i::after{left:12px;background:var(--amber-ink)}

footer{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12px;color:var(--faint)}
@media (max-width:520px){.modes{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.mode b{font-size:15px}.mode i{font-size:8.5px}.role{grid-template-columns:6em minmax(0,1fr)}}

</style>
<div class="app">
  <header class="top">
    <h1><span class="glyph" aria-hidden="true">軋</span><span class="nm">Kishimi<small>軋み</small></span></h1>
    <p>写真や動画を二つか三つ入れて、混ぜ方を選びます。片方がもう片方を押し、切り、遅らせ、網目から覗かせます。混ぜ方は十通り。二段まで重ねられ、一段目の結果や直前のこまも次の素材になります。</p>
  </header>

  <main class="main">
    <section class="stageCol" aria-label="画面">
      <div class="stage" id="stage">
        <canvas id="cv" width="1080" height="1080"></canvas>
        <div class="empty" id="empty">
          <b>A と B に素材を</b>
          <p>写真か動画を二つ入れると、ここで混ざりはじめます。三つ目は C へ。ここへ直接ドロップしても、空いている枠に入ります。</p>
          <div class="row"><button class="btn primary" type="button" data-pick="0">A を入れる</button><button class="btn" type="button" data-pick="1">B を入れる</button></div>
        </div>
        <div class="recBadge" id="recBadge" hidden><i></i><span id="recTime">00:00</span></div>
      </div>
      <div class="transport">
        <button class="btn" type="button" id="play" aria-pressed="true">一時停止</button>
        <button class="btn" type="button" id="shake" title="今の設定から少しずらす">揺さぶる</button>
        <span class="grow"></span>
        <button class="btn" type="button" id="still">静止画</button>
        <button class="btn rec" type="button" id="rec" aria-pressed="false"><span class="dot"></span><span id="recLabel">録画</span></button>
      </div>
      <p class="readout" id="readout"></p>
      <p class="msg" id="msg" role="status"></p>
    </section>

    <aside class="side">
      <section class="card" aria-labelledby="h-src">
        <div class="cardHead"><h2 id="h-src">素材</h2><span class="hint">枠を押すか、ファイルをドロップ</span></div>
        <div class="slots" id="slots"></div>
      </section>
      <section class="card stagecard" id="st0" aria-label="一段目"></section>
      <section class="card stagecard" id="st1" aria-label="二段目"></section>
      <section class="card" id="post" aria-label="残像"></section>
      <section class="card" id="out" aria-label="出力"></section>
    </aside>
  </main>

  <footer>
    <span>スライダーはダブルクリックで初期値に戻ります。</span>
    <span>録画は MP4（使えないブラウザでは WebM）、毎秒 30 こま。動画の音は入りません。</span>
  </footer>
  <input type="file" id="file0" accept="image/*,video/*" hidden>
  <input type="file" id="file1" accept="image/*,video/*" hidden>
  <input type="file" id="file2" accept="image/*,video/*" hidden>
</div>

<script>
// Kishimi engine: a WebGL2 compositor for two or three photos/videos.
//
// One frame runs up to two "stages". Each stage reads three inputs:
//   P and Q, the two pictures that are seen, and
//   F, a field that decides where, in what order, or how hard the mix acts.
// An input can be a loaded source (A, B, C), the first stage's result, the
// previous output frame, or a procedural field (noise, vertical ramp, radial).
// Ten modes combine them; most never average P and Q. A pixel is taken from
// one or the other, or one picture moves or delays the other.
// After the stages, an optional feedback pass folds in the previous frame.

function KishimiEngine(cv) {
  const gl = cv.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: false, powerPreference: 'high-performance' });
  if (!gl) return null;
  let HALF = !!gl.getExtension('EXT_color_buffer_float');

  const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*.5+.5; gl_Position = vec4(aPos,0.,1.); }`;

  const COMMON = `
float lum(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s/.9375; }
vec3 toYCC(vec3 c){ float y=dot(c,vec3(.299,.587,.114)); return vec3(y, (c.b-y)*.564+.5, (c.r-y)*.713+.5); }
vec3 fromYCC(vec3 v){ float y=v.x, cb=v.y-.5, cr=v.z-.5; return vec3(y+1.403*cr, y-.344*cb-.714*cr, y+1.773*cb); }
// Sample a texture through a fit transform. lod is a blur level in OUTPUT
// pixels; the source's own extra resolution is added so a 4000px photo is
// not aliased onto a 1080px frame.
vec3 sampT(sampler2D s, vec4 x, vec2 uv, float lod){
  vec2 u = uv*x.xy + x.zw;
  vec2 ts = vec2(textureSize(s,0));
  float L = max(0., log2(ts.y*x.y/uRes.y)) + lod;
  if (lod < .5) return textureLod(s,u,L).rgb;
  vec2 d = exp2(L)/ts*.7;
  return .25*(textureLod(s,u+vec2(d.x,d.y*.35),L).rgb + textureLod(s,u+vec2(-d.x*.35,d.y),L).rgb
            + textureLod(s,u-vec2(d.x,d.y*.35),L).rgb + textureLod(s,u-vec2(-d.x*.35,d.y),L).rgb);
}`;

  const FS_STAGE = `#version 300 es
precision highp float; precision highp sampler2DArray;
in vec2 vUv; out vec4 o;
uniform vec2 uRes;
uniform sampler2D uP, uQ, uF, uFlow;
uniform sampler2DArray uHist;
uniform vec4 uXP, uXQ, uXF;
uniform int uKP, uKQ, uKF, uMode;
uniform float uT, uA, uB, uC, uTime, uAsp, uHead, uHN, uRange, uSeed;
${COMMON}
vec3 P(vec2 uv, float l){ return uKP==1 ? vec3(0.) : sampT(uP,uXP,uv,l); }
vec3 Q(vec2 uv, float l){ return uKQ==1 ? vec3(0.) : sampT(uQ,uXQ,uv,l); }
vec3 Fc(vec2 uv, float l){
  if (uKF==0) return sampT(uF,uXF,uv,l);
  if (uKF==2) return vec3(clamp((fbm(vec2(uv.x*uAsp,uv.y)*3.+vec2(uTime*.031,-uTime*.023)+uSeed*7.)-.5)*2.2+.5,0.,1.));
  if (uKF==3) return vec3(uv.y);
  if (uKF==4) return vec3(clamp(length((uv-.5)*vec2(uAsp,1.))*1.35,0.,1.));
  return vec3(0.);
}
float F(vec2 uv, float l){ return lum(Fc(uv,l)); }
vec2 asp(vec2 v){ return v*vec2(1./uAsp,1.); }
float bayer4(vec2 p){
  int m[16] = int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);
  return float(m[int(p.y)*4+int(p.x)]);
}
void main(){
  vec2 uv = vUv; float t = uT; vec3 col;
  if (uMode==0) {            // flow: carry P's shapes onto Q's along matched patches
    vec2 fl = (texture(uFlow,uv).rg-.5)*2.5*uRange; fl.x /= uAsp;
    vec3 a = P(uv-fl*t,0.), b = Q(uv+fl*(1.-t),0.);
    // with the noise field the switch is a fine stipple (a few px) that grows
    // into blobs as 混ざり方 rises, so the warp stays visible underneath
    float n;
    if (uKF==2) { float g = mix(1.5,70.,smoothstep(0.,.7,uC)); n = clamp((fbm(uv*uRes/g+uSeed*7.)-.5)*2.2+.5,0.,1.); }
    else n = F(uv,1.);
    float s = mix(.015,.35,uC), tt = t*(1.+2.*s)-s;
    float m = 1.-smoothstep(tt-s,tt+s,n);
    m = mix(m, t, smoothstep(.75,1.,uC));
    col = mix(a,b,m);
  } else if (uMode==1) {     // threshold: F's brightness is the order of replacement
    float f = F(uv,0.), bands = 1.+floor(uA*9.99);
    float g = abs(fract(f*bands*.5+.5)*2.-1.);
    float s = mix(.003,.2,uB*uB), tt = t*(1.+2.*s)-s;
    float m = 1.-smoothstep(tt-s,tt+s,g);
    vec3 p = P(uv,0.), q = Q(uv,0.);
    col = mix(p,q,m);

  const tsl = slider({ id: `t${si}`, label: '度合い', get: () => st.t, set: (v) => { st.t = v; }, def: .5, fmt: (v) => st.mot === 'none' ? v.toFixed(2) : `中心 ${v.toFixed(2)}` });
  const inp = tsl.querySelector('input'); const trk = h('div', { class: 'trk' }); inp.replaceWith(trk); trk.append(inp, h('i', { class: 'tick' }));
  tWrap.append(tsl);
  const mot = h('div', { class: 'motion' }, seg(MOTIONS.map(([v, t]) => [v, t]), () => st.mot, (v) => { st.mot = v; buildStage(si); }));
  if (st.mot !== 'none') mot.append(h('div', { class: 'params' },
    slider({ id: `amp${si}`, label: '振れ幅', get: () => st.amp, set: (v) => { st.amp = v; }, def: 1 }),
    slider({ id: `per${si}`, label: '周期', get: () => st.per, set: (v) => { st.per = v; }, def: .667, fmt: (v) => secs(v).toFixed(1) + ' 秒' })));
  tWrap.append(mot);
  el.append(tWrap);

  const ps = h('div', { class: 'params' });
  m.p.forEach((pd, k) => {
    if (pd.choice) {
      const n = pd.choice.length, idx = () => Math.round(st.p[k] * (n - 1));
      ps.append(h('div', { class: 'sl choice' }, h('span', { class: 'lab' }, h('span', {}, pd.n)),
        seg(pd.choice.map((c, j) => [String(j), c]), () => String(idx()), (v) => { st.p[k] = n > 1 ? +v / (n - 1) : 0; })));
    } else ps.append(slider({ id: `p${si}${k}`, label: pd.n, get: () => st.p[k], set: (v) => { st.p[k] = v; }, def: pd.d, fmt: pd.fmt, lo: pd.lo, hi: pd.hi }));
  });
  el.append(ps);
  refreshInputs();
}

function buildPost() {
  const el = $('post'); el.textContent = '';
  el.append(h('div', { class: 'cardHead' }, h('h2', {}, '残像'), h('span', { class: 'hint' }, '直前のこまを重ねて、時間に跡を残す')));
  el.append(h('div', { class: 'params' },
    slider({ id: 'pamt', label: '残る量', get: () => S.post.amt, set: (v) => { S.post.amt = v; }, def: 0 }),
    h('div', { class: 'sl choice' }, h('span', { class: 'lab' }, h('span', {}, '重ね方')),
      seg([['0', '混ぜる'], ['1', '明るい方'], ['2', '暗い方'], ['3', '差']], () => String(S.post.blend), (v) => { S.post.blend = +v; })),
    slider({ id: 'pzoom', label: '寄り・引き', get: () => S.post.zoom, set: (v) => { S.post.zoom = v; }, def: .5, fmt: (v) => ((v - .5) * 2).toFixed(2), lo: '引く', hi: '寄る' }),
    slider({ id: 'prot', label: '回転', get: () => S.post.rot, set: (v) => { S.post.rot = v; }, def: .5, fmt: (v) => ((v - .5) * 2).toFixed(2), lo: '左', hi: '右' })));
  el.append(h('p', { class: 'note' }, '入力に「前」を選ぶと、残像そのものを素材にして混ぜられます。'));
}
function buildOut() {
  const el = $('out'); el.textContent = '';
  el.append(h('div', { class: 'cardHead' }, h('h2', {}, '出力')));
  el.append(h('div', { class: 'role' }, h('span', {}, '縦横比'),
    seg([['a', '素材に合わせる', 'A（空なら次の素材）の縦横比'], ['1:1', '1:1'], ['4:5', '4:5'], ['9:16', '9:16'], ['16:9', '16:9']], () => S.aspect, (v) => { S.aspect = v; applySize(); })));
  el.append(h('div', { class: 'role' }, h('span', {}, '長い辺'),
    seg([['720', '720'], ['1080', '1080'], ['1440', '1440']], () => String(S.res), (v) => { S.res = +v; applySize(); })));
  el.append(h('p', { class: 'note' }, '重いときは長い辺を 720 に。素材はすべてこの端末の中で処理され、どこにも送られません。'));
}

// ---------- shake: move away from the current state, not reset ----------
function shake() {
  const notes = [], R = Math.random;
  S.stages.forEach((st, si) => {
    if (si === 1 && !st.on) return;
    const nm = si ? '二段目' : '一段目';
    if (R() < .4) {
      const others = MODES.filter((m) => m.id !== st.mode), m = others[Math.floor(R() * others.length)];
      notes.push(`${nm}を${MODES[MI[st.mode]].k}から${m.k}へ`);
      applyMode(st, m.id);
    }
    const m = MODES[MI[st.mode]];
    st.p = st.p.map((v, k) => m.p[k].choice ? (R() < .35 ? Math.floor(R() * m.p[k].choice.length) / Math.max(1, m.p[k].choice.length - 1) : v) : clamp(v + (R() - .5) * .5, 0, 1));
    if (m.roles.F && R() < .3) { const fs = FIELDS(si), f = fs[Math.floor(R() * fs.length)]; if (f !== st.F) { st.F = f; notes.push(`${nm}の F を${LABEL[f]}に`); } }
    if (m.roles.Q && R() < .2) { [st.P, st.Q] = [st.Q, st.P]; notes.push(`${nm}の P と Q を入れ替え`); }
    if (st.mot !== 'none') st.per = clamp(st.per + (R() - .5) * .3, 0, 1);
    st.seed = R() * 10;
    buildStage(si);
  });
  if (S.post.amt > 0 && R() < .5) { S.post.zoom = clamp(S.post.zoom + (R() - .5) * .2, 0, 1); S.post.rot = clamp(S.post.rot + (R() - .5) * .2, 0, 1); buildPost(); }
  msg('揺さぶり：' + (notes.length ? notes.join('、') + '。値も少しずらしました。' : '値を少しずつずらしました。'));
}

// ---------- transport ----------
function setPlaying(p) {
  S.playing = p;
  const b = $('play'); b.setAttribute('aria-pressed', String(p)); b.textContent = p ? '一時停止' : '再生';
  for (const s of E.slots) if (s.el && s.el.tagName === 'VIDEO') { if (p) s.el.play().catch(() => {}); else s.el.pause(); }
}
$('play').addEventListener('click', () => setPlaying(!S.playing));
$('shake').addEventListener('click', shake);

// saving: inside the claude.ai viewer files go through the downloads capability
const inViewer = !!(window.claude && typeof window.claude.use === 'function');
const DLP = inViewer ? window.claude.use('downloads').catch(() => null) : null;
function stamp() { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
async function deliver(name, blob) {
  if (inViewer) {
    const dl = await DLP;
    if (!dl) { msg('この表示ではファイルを保存できません。', true); return; }
    try { await dl.save({ filename: name, data: blob }); msg(`「${name}」を保存しました。`); }
    catch (e) { const c = e && e.code; msg(c === 'declined' ? '保存をやめました。' : c === 'rate_limited' ? '保存の確認がまだ開いています。閉じてからもう一度押してください。' : c === 'host_unavailable' ? 'このアプリでは保存できません。ブラウザかパソコンで開いてください。' : 'この表示ではファイルを保存できません。', c !== 'declined'); }
    return;
  }
  const url = URL.createObjectURL(blob), a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  msg(`「${name}」を書き出しました。`);
}
$('still').addEventListener('click', () => {
  cv.toBlob((b) => { if (b) deliver(`kishimi-${stamp()}.png`, b); else msg('静止画を作れませんでした。', true); }, 'image/png');
});

function pickMime() {
  if (!window.MediaRecorder || !cv.captureStream) return null;
  for (const m of ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} }
  return '';
}
const mime = pickMime();
let rec = null, recChunks = [], recStart = 0;
function toggleRec() {
  if (rec) { rec.stop(); return; }
  if (mime === null) { msg('このブラウザは録画に対応していません。静止画は保存できます。', true); return; }
  const stream = cv.captureStream(30);
  const [W] = E.size;
  try { rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: W >= 1400 ? 16e6 : W >= 1000 ? 12e6 : 8e6 } : { videoBitsPerSecond: 10e6 }); }
  catch (e) { msg('録画を始められませんでした：' + e.message, true); rec = null; return; }
  recChunks = [];
  const r = rec;
  r.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
  r.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    const type = r.mimeType || mime || 'video/webm', ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recChunks, { type });
    rec = null; recChunks = [];
    $('rec').setAttribute('aria-pressed', 'false'); $('recLabel').textContent = '録画'; $('recBadge').hidden = true;
    if (blob.size) deliver(`kishimi-${stamp()}.${ext}`, blob); else msg('録画が空でした。もう一度試してください。', true);
  };
  r.start(500);
  recStart = performance.now();
  $('rec').setAttribute('aria-pressed', 'true'); $('recLabel').textContent = '止めて保存'; $('recBadge').hidden = false;
}
$('rec').addEventListener('click', toggleRec);

// ---------- the loop ----------
function wave(st, time) {
  if (st.mot === 'none') return st.t;
  const x = time / secs(st.per) + st.phase, TAU = Math.PI * 2;
  let w;
  if (st.mot === 'pp') w = Math.sin(TAU * x);
  else if (st.mot === 'drift') w = (Math.sin(TAU * x) * .6 + Math.sin(TAU * x * 2.17 + 1.3) * .3 + Math.sin(TAU * x * 3.71 + .4) * .2) / 1.1;
  else w = (x - Math.floor(x)) * 2 - 1;
  return clamp(st.t + w * st.amp * .5, 0, 1);
}
let last = performance.now(), clock = 0, fpsN = 0, fpsT = 0, fps = 0, roT = 0;
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (S.playing) clock += dt;
  for (let i = 0; i < 3; i++) { const s = E.slots[i]; if (s.el && s.el._poll && !s.el.paused) E.markFresh(i); }
  S.stages.forEach((st, si) => { st.tv = wave(st, clock); stageEls[si].style.setProperty('--tv', st.tv.toFixed(4)); });
  try { E.render(S, clock); } catch (e) { console.error(e); }
  fpsN++; fpsT += dt;
  if (fpsT > .5) { fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }
  if (now - roT > 250) {
    roT = now;
    const [W, H] = E.size, parts = [`${W}×${H}`];
    S.stages.forEach((st, si) => { if (si === 0 || st.on) parts.push(`${si ? '二段' : '一段'} ${MODES[MI[st.mode]].k} ${st.tv.toFixed(2)}`); });
    parts.push(`${fps.toFixed(0)} fps`);
    $('readout').textContent = parts.join(' · ');
    if (rec) { const s = Math.floor((now - recStart) / 1000); $('recTime').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
  }
  requestAnimationFrame(loop);
}

cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); msg('描画が止まりました（GPU の都合）。ページを読み込み直してください。', true); });

buildSlots(); buildStage(0); buildStage(1); buildPost(); buildOut();
applySize(); refreshInputs();
if (mime === null) $('rec').title = 'このブラウザは録画に対応していません';
requestAnimationFrame(loop);

// handle for the offline tests (tools/test.mjs)
window.__kishimi = { S, E, MODES, buildStage, applyMode, setPlaying, get clock() { return clock; }, set clock(v) { clock = v; } };
})();

</script>
