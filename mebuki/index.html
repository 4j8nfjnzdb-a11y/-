<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Mebuki 芽吹</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=BIZ+UDPGothic:wght@400;700&family=Martian+Mono:wght@400&display=swap">
<style>
/* Layout: a mixing desk in four strips. A (ground, indigo) and B (sprout,
   young-leaf green) sit either side of the merge strip, whose colours blend
   between them; the whole-mix strip closes the desk. Faders are the
   primary controls; grain settings are horizontal sliders. */
:root{
  --bg:#eaece6; --panel:#f7f8f3; --well:#dde1d8; --ink:#161915; --dim:#525950; --faint:#858b82;
  --line:rgba(22,25,21,.12); --a:#3450b4; --b:#4b8a1b; --hot:#cc432c; --a-soft:rgba(52,80,180,.11); --b-soft:rgba(75,138,27,.13);
  --knob:#ffffff; --onacc:#ffffff;
  --f-disp:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d100d; --panel:#151915; --well:#090b09; --ink:#e5e8e1; --dim:#a2a99e; --faint:#6c7369;
  --line:rgba(229,232,225,.1); --a:#8da2ff; --b:#9bd35a; --hot:#ff6b52; --a-soft:rgba(141,162,255,.13); --b-soft:rgba(155,211,90,.13);
  --knob:#e5e8e1; --onacc:#0d100d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d100d; --panel:#151915; --well:#090b09; --ink:#e5e8e1; --dim:#a2a99e; --faint:#6c7369;
  --line:rgba(229,232,225,.1); --a:#8da2ff; --b:#9bd35a; --hot:#ff6b52; --a-soft:rgba(141,162,255,.13); --b-soft:rgba(155,211,90,.13);
  --knob:#e5e8e1; --onacc:#0d100d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.app{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,5vw,50px);line-height:1;letter-spacing:.04em;display:flex;align-items:baseline;gap:12px}
.brand h1 span{font-family:var(--f-mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);font-weight:400}
.brand h1 i{font-style:normal;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:6px 0 0;color:var(--dim);max-width:60ch}
.trans{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.play,.rec{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:6px;padding:10px 18px;font-weight:700;letter-spacing:.05em}
.play{background:var(--ink);color:var(--bg)}
.play[aria-pressed="true"]{background:linear-gradient(90deg,var(--a),var(--b));color:var(--onacc)}
.rec{background:var(--panel);border:1px solid var(--line)}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--hot)}
.rec[aria-pressed="true"]{background:var(--hot);color:var(--onacc)}
.rec[aria-pressed="true"] .dot{background:var(--onacc);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.mono{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--dim)}
.msg{font-size:12.5px;color:var(--dim);min-height:1.2em}
.scenes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scenes .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-right:2px}
.chipb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:12.5px}
.chipb:hover{border-color:var(--faint)}

/* desk */
.desk{display:grid;gap:12px;grid-template-columns:minmax(0,1.12fr) minmax(0,.94fr) minmax(0,1.12fr) minmax(0,.9fr);grid-template-areas:"a m b x";align-items:start}
@media (max-width:1260px){.desk{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a b" "m x"}}
@media (max-width:760px){.desk{grid-template-columns:minmax(0,1fr);grid-template-areas:"a" "b" "m" "x"}}
#trkA{grid-area:a}#trkB{grid-area:b}#morph{grid-area:m}#master{grid-area:x}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0;border-top:4px solid var(--c,var(--ink))}
#trkA{--c:var(--a);--cs:var(--a-soft)}
#trkB{--c:var(--b);--cs:var(--b-soft)}
#morph{border-top:4px solid transparent;border-image:linear-gradient(90deg,var(--a),var(--b)) 1 0 0 0;border-radius:0 0 10px 10px}
#master{--c:var(--ink);--cs:var(--well)}
.sh{display:flex;align-items:center;gap:10px}
.sh .badge{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--c);color:var(--onacc);font-family:var(--f-disp);font-weight:700;font-size:20px;flex:none}
#morph .sh .badge{background:linear-gradient(135deg,var(--a),var(--b))}
.sh h2{font-family:var(--f-disp);font-weight:700;font-size:21px;line-height:1.15}
.sh h2 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.sh .acts{margin-left:auto;display:flex;gap:6px}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--dim);white-space:nowrap}
.ibtn:hover{border-color:var(--faint);color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}

/* source */
.wave{position:relative;border-radius:6px;background:var(--well);border:1px solid var(--line);overflow:hidden;touch-action:none}
.wave canvas{display:block;width:100%;height:110px}
.wave .drop{position:absolute;inset:0;display:grid;place-items:center;background:var(--cs);border:2px dashed var(--c);border-radius:6px;font-weight:700;pointer-events:none}
.srcrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srcrow .fname{font-size:12px;color:var(--dim);min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow .chipb[aria-pressed="true"]{border-color:var(--c);color:var(--c);font-weight:700}
.mixline{min-height:1.4em}
.wave{cursor:pointer}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:2px 0}
details.more[open] summary{margin-bottom:6px}

/* horizontal sliders */
.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
@media (max-width:420px){.sliders{grid-template-columns:minmax(0,1fr)}}
.hs{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:0 6px;min-width:0}
.hs label{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs output{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.hs input{grid-column:1 / -1;width:100%;margin:0;accent-color:var(--c,var(--ink));height:22px}
.tgl{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:12.5px}
.tgl[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--onacc)}

/* vertical faders */
.bank{display:flex;flex-wrap:wrap;gap:8px 2px;justify-content:space-between}
.fd{display:flex;flex-direction:column;align-items:center;gap:4px;width:44px;min-width:0}
.ft{position:relative;width:30px;height:118px;border-radius:6px;background:var(--well);border:1px solid var(--line);touch-action:none;cursor:ns-resize}
.ft .rail{position:absolute;left:50%;top:7px;bottom:7px;width:2px;margin-left:-1px;background:var(--line)}
.ft .fill{position:absolute;left:50%;width:4px;margin-left:-2px;border-radius:2px;background:var(--c,var(--ink))}
.ft .zero{position:absolute;left:4px;right:4px;height:1px;background:var(--faint)}
.ft .knob{position:absolute;left:1px;right:1px;height:14px;border-radius:4px;background:var(--knob);border:1px solid var(--faint);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.ft .knob::after{content:"";position:absolute;left:4px;right:4px;top:6px;height:1px;background:var(--c,var(--ink))}
.ft.tall{height:190px;width:36px}
.fd .fl{font-size:10.5px;line-height:1.25;text-align:center;color:var(--ink);min-height:2.5em;display:flex;align-items:flex-start;justify-content:center}
.fd .fv{font-family:var(--f-mono);font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.outrow{display:flex;gap:14px;align-items:flex-end}
.outrow .side{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.meter{width:10px;height:190px;border-radius:3px;background:var(--well);border:1px solid var(--line);position:relative;overflow:hidden;flex:none}
.meter i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--c,var(--ink)),var(--c,var(--ink)) 70%,var(--hot))}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* morph */
.modes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:3px;background:var(--well);border-radius:8px}
.modes button{border:0;background:none;border-radius:6px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.modes button b{font-family:var(--f-disp);font-size:16px;font-weight:700}
.modes button span{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.06em;color:var(--faint)}
.modes button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.modedesc{margin:0;font-size:12.5px;color:var(--dim);min-height:3.2em}
.xf{position:relative;height:58px;border-radius:8px;background:linear-gradient(90deg,var(--a-soft),var(--b-soft));border:1px solid var(--line);touch-action:none;cursor:ew-resize}
.xf .ends{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-family:var(--f-disp);font-weight:700;font-size:20px;pointer-events:none}
.xf .ends b:first-child{color:var(--a)}.xf .ends b:last-child{color:var(--b)}
.xf .cap{position:absolute;top:5px;bottom:5px;width:26px;margin-left:-13px;border-radius:5px;background:var(--knob);border:1px solid var(--faint);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.xf .cap::after{content:"";position:absolute;top:6px;bottom:6px;left:12px;width:2px;background:var(--ink)}
.xf .live{position:absolute;bottom:0;width:2px;height:12px;margin-left:-1px;background:var(--hot)}
.xfv{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
.freeze{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:8px}
.freeze[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.spec{border-radius:6px;background:var(--well);border:1px solid var(--line);overflow:hidden}
.spec canvas{display:block;width:100%;height:96px}
.help{font-size:12.5px;color:var(--dim);margin:0}
.help b{color:var(--ink)}
footer{font-size:12.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){.rec[aria-pressed="true"] .dot{animation:none}}

</style>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1><i>芽吹</i><span>mebuki</span></h1>
      <p>ファイルを入れると、まずはそのまま流れます。フェーダーを動かした分だけ、少しずつ別の音へ変わっていきます。ふたつの音は合体させられます。</p>
    </div>
    <div class="trans">
      <button class="play" id="play" aria-pressed="false"><span id="playlabel">▶ 再生</span></button>
      <button class="rec" id="rec" aria-pressed="false"><span class="dot"></span><span id="reclabel">録音</span></button>
      <span class="mono" id="rectime"></span>
    </div>
  </header>
  <div class="scenes" id="scenes"><span class="lab">場面</span></div>
  <p class="msg" id="msg">A（と B）に音声ファイルを入れて、再生を押してください。すべてのフェーダーが初期値のあいだは、元の音がそのまま流れます。</p>

  <main class="desk">
    <section class="strip trk" id="trkA" data-t="a" aria-label="トラック A"></section>
    <section class="strip" id="morph" aria-label="合体"></section>
    <section class="strip trk" id="trkB" data-t="b" aria-label="トラック B"></section>
    <section class="strip" id="master" aria-label="全体"></section>
  </main>

  <footer>
    <span>フェーダーはドラッグ／矢印キー（Shift で大きく）、ダブルクリックで初期値に戻る。波形を押すとその位置から再生。</span>
    <span>録音は WebM（Safari では MP4）で保存されます。</span>
  </footer>
  <input type="file" id="file" accept="audio/*,.wav,.aif,.aiff,.mp3,.m4a,.flac,.ogg" hidden>
</div>

<script>
// ---------------------------------------------------------------------------
// Mebuki DSP. Self-contained (no outer references) so it can be stringified
// into an AudioWorklet; the same Engine runs in a ScriptProcessor fallback
// and in Node for tests.
//
// Signal flow per sample:
//   track A grains -> A chain (filter, drive, crush, wow) -> level/pan --+
//   track B grains -> B chain ...........................................+-> morph
//   morph: grain share | blend | spectral | cross | ring  (+ smear, shift, freeze, all in one STFT)
//   -> master chain (filter, drive, crush) + delay return + reverb return
//   -> width -> level -> limiter
// ---------------------------------------------------------------------------
function MEBUKI_DSP(){
  const TAU=Math.PI*2;
  const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
  const wrap01=x=>x-Math.floor(x);

  function makeFFT(n){
    const lev=Math.round(Math.log2(n)),rev=new Uint32Array(n),cs=new Float64Array(n/2),sn=new Float64Array(n/2);
    for(let i=0;i<n;i++){let r=0,x=i;for(let b=0;b<lev;b++){r=(r<<1)|(x&1);x>>=1}rev[i]=r}
    for(let i=0;i<n/2;i++){cs[i]=Math.cos(TAU*i/n);sn[i]=Math.sin(TAU*i/n)}
    return function(re,im,inv){
      for(let i=0;i<n;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
      for(let size=2;size<=n;size<<=1){
        const half=size>>1,step=n/size;
        for(let i=0;i<n;i+=size){
          for(let j=0,k=0;j<half;j++,k+=step){
            const c=cs[k],s=inv?sn[k]:-sn[k],a=i+j,b=a+half;
            const tr=re[b]*c-im[b]*s,ti=re[b]*s+im[b]*c;
            re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;
          }
        }
      }
      if(inv)for(let i=0;i<n;i++){re[i]/=n;im[i]/=n}
    };
  }

  // ---------- one effect chain: filter, drive, crush, wow ----------
  class Chain{
    constructor(sr){
      this.sr=sr;this.ic1=[0,0];this.ic2=[0,0];this.hold=[0,0];this.hc=0;
      this.dl=[new Float32Array(4096),new Float32Array(4096)];this.dw=0;this.wph=0;this.fph=0;this.wr=0;this.wt=0;
      this.a1=1;this.a2=0;this.a3=0;this.k=2;this.mode=0;this.dg=1;this.dn=1;this.q=32768;this.dec=1;
      this.cb=[new Float32Array(2048),new Float32Array(2048)];this.cw=0;
      this.out=[0,0];
    }
    // per block: turn fader values into coefficients
    prep(tone,res,drive,crush){
      const sr=this.sr;
      this.mode=Math.abs(tone)<0.02?0:(tone<0?1:2);
      let fc=tone<0?20000*Math.pow(2,tone*7.4):20*Math.pow(2,tone*8.2);
      fc=clamp(fc,20,sr*0.45);
      const g=Math.tan(Math.PI*fc/sr);this.k=2-2*clamp(res,0,1)*0.96;
      this.a1=1/(1+g*(g+this.k));this.a2=g*this.a1;this.a3=g*this.a2;
      this.drive=drive;this.dg=1+drive*12;this.dn=1/Math.pow(this.dg,0.6);
      this.crush=crush;const bits=16-Math.sqrt(crush)*13;this.q=Math.pow(2,bits-1);this.dec=1+Math.floor(crush*20);
    }
    run(l,r,wow,comb){
      const x=[l,r];
      // filter (TPT state variable)
      if(this.mode){
        for(let c=0;c<2;c++){
          const v3=x[c]-this.ic2[c],v1=this.a1*this.ic1[c]+this.a2*v3,v2=this.ic2[c]+this.a2*this.ic1[c]+this.a3*v3;
          this.ic1[c]=2*v1-this.ic1[c];this.ic2[c]=2*v2-this.ic2[c];
          x[c]=this.mode===1?v2:x[c]-this.k*v1-v2;
        }
      }
      if(this.drive>0.005){x[0]=Math.tanh(x[0]*this.dg)*this.dn;x[1]=Math.tanh(x[1]*this.dg)*this.dn}
      if(this.crush>0.005){
        if(++this.hc>=this.dec){this.hc=0;this.hold[0]=Math.round(x[0]*this.q)/this.q;this.hold[1]=Math.round(x[1]*this.q)/this.q}
        x[0]=this.hold[0];x[1]=this.hold[1];
      }
      // wow & flutter: a short modulated delay (constant 3 ms base so toggling never clicks);
      // wow < 0 means no wow stage at all (the master chain)
      const sr=this.sr;
      if(wow>=0){
      this.wph=wrap01(this.wph+0.55/sr);this.fph=wrap01(this.fph+6.3/sr);
      if(Math.random()<1/(sr*0.4))this.wt=Math.random()*2-1;
      this.wr+=(this.wt-this.wr)*0.00004;
      const dm=sr*0.003+wow*sr*(0.0045*(0.6*Math.sin(TAU*this.wph)+0.4*this.wr)+0.0006*Math.sin(TAU*this.fph));
      const N=4096,w=this.dw;
      for(let c=0;c<2;c++){
        this.dl[c][w]=x[c];
        const rp=w-dm,i0=Math.floor(rp),f=rp-i0,a=this.dl[c][(i0+N)&(N-1)],b=this.dl[c][(i0+1+N)&(N-1)];
        x[c]=a+(b-a)*f;
      }
      this.dw=(w+1)&(N-1);
      }
      // 響き: a feedback comb tuned near G3 (slightly detuned left/right), faded in by the fader
      if(comb>0.003){
        const fb=comb*0.94,cw=this.cw,M=2047;
        for(let c=0;c<2;c++){
          const dly=sr/(c?198.4:196),rp=cw-dly,j0=Math.floor(rp),f=rp-j0,cb=this.cb[c];
          const y=cb[(j0+2048)&M]*(1-f)+cb[(j0+2049)&M]*f;
          cb[cw]=x[c]+y*fb;
          x[c]=x[c]+(y*(1-fb)*2.2-x[c])*comb;
        }
        this.cw=(cw+1)&M;
      }
      this.out[0]=x[0];this.out[1]=x[1];
    }
  }

  // ---------- track: plain playback that turns into grains as faders move ----------
  // At rest a track simply loops its file. Each fader in the 変化 group pulls
  // the sound into a grain engine that reads around the playhead, so every
  // fader starts from the original and changes it gradually.
  const V=40;
  class Track{
    constructor(sr){
      this.sr=sr;this.buf=null;this.ph=0;this.timer=0;this.gm=0;
      this.act=new Uint8Array(V);this.pos=new Float64Array(V);this.inc=new Float64Array(V);this.age=new Float64Array(V);
      this.dur=new Float64Array(V);this.gl=new Float64Array(V);this.gr=new Float64Array(V);this.shp=new Float64Array(V);this.vb=new Array(V).fill(null);
      this.chain=new Chain(sr);this.peak=0;this.o=[0,0];this.lv=0;this.ov=1;
    }

  // ---------- STFT morph: spectral / cross / smear / shift / freeze ----------
  class Spectral{
    constructor(){
      const N=1024;this.N=N;this.H=256;this.fft=makeFFT(N);
      this.win=new Float64Array(N);for(let i=0;i<N;i++)this.win[i]=0.5-0.5*Math.cos(TAU*i/N);
      const F=()=>[new Float64Array(N),new Float64Array(N)];
      this.ia=F();this.ib=F();this.ob=F();this.w=0;this.h=0;
      this.ar=new Float64Array(N);this.ai=new Float64Array(N);this.br=new Float64Array(N);this.bi=new Float64Array(N);
      this.yr=new Float64Array(N);this.yi=new Float64Array(N);
      const K=N/2+1;this.ma=new Float64Array(K);this.mb=new Float64Array(K);this.ea=new Float64Array(K);this.eb=new Float64Array(K);
      this.sm=[new Float64Array(K),new Float64Array(K)];this.fz=[new Float64Array(K),new Float64Array(K)];this.fp=[new Float64Array(K),new Float64Array(K)];
      this.last=[new Float64Array(K),new Float64Array(K)];this.lph=[new Float64Array(K),new Float64Array(K)];

  // ---------- ping-pong delay ----------
  class Delay{
    constructor(sr){this.sr=sr;this.N=1<<17;this.b=[new Float32Array(this.N),new Float32Array(this.N)];this.w=0;this.t=sr*0.4;this.lp=[0,0];this.o=[0,0]}

  class Reverb{

// ---------- state ----------
const DEF={a:Object.assign({},DSP.TRACK_DEF),b:Object.assign({},DSP.TRACK_DEF),m:Object.assign({},DSP.MORPH_DEF),x:Object.assign({},DSP.MASTER_DEF)};
const ST=JSON.parse(JSON.stringify(DEF));
try{const s=JSON.parse(localStorage.getItem('mebuki.v2')||'null');if(s)for(const g in ST)for(const k in ST[g])if(s[g]&&typeof s[g][k]==='number')ST[g][k]=s[g][k]}catch(e){}
const CTL=new Map();
let saveT=0;
function setParam(g,k,v,silent){
  ST[g][k]=v;send({t:'p',k:`${g}.${k}`,v});
  const u=CTL.get(`${g}.${k}`);if(u)u.forEach(f=>f(v));
  if(g==='m'&&k==='mode')updateModeDesc();
  if(!silent){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('mebuki.v2',JSON.stringify(ST))}catch(e){}},400)}
}
function reg(key,f){if(!CTL.has(key))CTL.set(key,[]);CTL.get(key).push(f)}
const toN=(s,v)=>s.log?Math.log(v/s.min)/Math.log(s.max/s.min):(v-s.min)/(s.max-s.min);
const fromN=(s,n)=>s.log?s.min*Math.pow(s.max/s.min,n):s.min+(s.max-s.min)*n;

// ---------- components ----------
function fader(g,s,opt={}){
  const w=document.createElement('div');w.className='fd';
  w.innerHTML=`<div class="ft${opt.tall?' tall':''}" role="slider" tabindex="0" aria-label="${esc(s.l)}"><div class="rail"></div>${s.ctr!==undefined?'<div class="zero"></div>':''}<div class="fill"></div><div class="knob"></div></div><span class="fl">${esc(s.l)}</span><output class="fv"></output>`;
  const ft=w.querySelector('.ft'),fill=w.querySelector('.fill'),knob=w.querySelector('.knob'),zero=w.querySelector('.zero'),out=w.querySelector('output');
  const KH=14,z=s.ctr!==undefined?toN(s,s.ctr):0;
  if(zero)zero.style.top=`calc(${(1-z)*100}% - ${(1-z)*KH}px + ${KH/2}px)`;
  const draw=v=>{
    const n=clamp(toN(s,v),0,1);
    knob.style.top=`calc(${(1-n)*100}% - ${(1-n)*KH}px)`;
    const hi=Math.max(n,z),lo=Math.min(n,z);
    fill.style.top=`calc(${(1-hi)*100}% - ${(1-hi)*KH}px + ${KH/2}px)`;
    fill.style.height=`calc(${(hi-lo)*100}% - ${(hi-lo)*KH}px)`;
    out.textContent=s.f(v);ft.setAttribute('aria-valuenow',String(+v.toFixed(3)));ft.setAttribute('aria-valuetext',s.f(v));
  };
  const at=e=>{const r=ft.getBoundingClientRect();return clamp(1-(e.clientY-r.top-KH/2)/(r.height-KH),0,1)};
  ft.addEventListener('pointerdown',e=>{ft.setPointerCapture(e.pointerId);setParam(g,s.k,fromN(s,at(e)));e.preventDefault()});
  ft.addEventListener('pointermove',e=>{if(ft.hasPointerCapture(e.pointerId))setParam(g,s.k,fromN(s,at(e)))});
  ft.addEventListener('dblclick',()=>setParam(g,s.k,DEF[g][s.k]));
  ft.addEventListener('keydown',e=>{
    const st=e.shiftKey?0.1:0.01;let n=toN(s,ST[g][s.k]);
    if(e.key==='ArrowUp'||e.key==='ArrowRight')n+=st;else if(e.key==='ArrowDown'||e.key==='ArrowLeft')n-=st;
    else if(e.key==='Home')n=0;else if(e.key==='End')n=1;else return;
    e.preventDefault();setParam(g,s.k,fromN(s,clamp(n,0,1)));
  });
  reg(`${g}.${s.k}`,draw);draw(ST[g][s.k]);
  return w;
}
function slider(g,s){
  const w=document.createElement('div');w.className='hs';const id=`s-${g}-${s.k}`;
  w.innerHTML=`<label for="${id}">${esc(s.l)}</label><output></output><input type="range" id="${id}" min="0" max="1000" step="1">`;
  const inp=w.querySelector('input'),out=w.querySelector('output');
  const draw=v=>{inp.value=Math.round(clamp(toN(s,v),0,1)*1000);out.textContent=s.f(v)};
  inp.addEventListener('input',()=>setParam(g,s.k,fromN(s,+inp.value/1000)));
  inp.addEventListener('dblclick',()=>setParam(g,s.k,DEF[g][s.k]));
  reg(`${g}.${s.k}`,draw);draw(ST[g][s.k]);
  return w;
}
function toggle(g,k,label){
  const b=document.createElement('button');b.className='tgl';b.type='button';b.textContent=label;
  const draw=v=>b.setAttribute('aria-pressed',v>0.5);
  b.onclick=()=>setParam(g,k,ST[g][k]>0.5?0:1);
  reg(`${g}.${k}`,draw);draw(ST[g][k]);return b;
}

function buildTrack(g){
  const el=$(g==='a'?'trkA':'trkB'),N=g==='a'?['A','地','ground']:['B','芽','sprout'];
  el.innerHTML=`<div class="sh"><span class="badge">${N[0]}</span><h2><small>track ${N[0]} · ${N[2]}</small>${N[1]}</h2>
      <div class="acts"><button class="ibtn" data-act="dice">ダイス</button><button class="ibtn" data-act="reset">元に戻す</button></div></div>
    <div class="sec"><h3>音源</h3><div class="wave" id="wave-${g}"><canvas id="cv-${g}" aria-label="トラック ${N[0]} の波形。押した位置から再生"></canvas><div class="drop" hidden>ここにドロップ</div></div>
      <div class="srcrow" id="src-${g}"></div><div class="mixline mono" id="mix-${g}"></div></div>
    <div class="sec"><h3>変化 — 0 なら元の音のまま</h3><div class="bank" id="ch-${g}"></div><div class="btnrow" id="tg-${g}"></div></div>
    <div class="sec"><h3>効果</h3><div class="bank" id="fx-${g}"></div></div>
    <div class="sec"><h3>出力</h3><div class="outrow"><div id="lv-${g}"></div><div class="meter"><i id="mt-${g}"></i></div><div class="side"><div id="pan-${g}"></div><div id="wd-${g}"></div><div class="btnrow" id="ms-${g}"></div></div></div></div>
    <details class="sec more"><summary>詳細 — 粒の長さ・密度・形、フィルターの鋭さ</summary><div class="sliders" id="dt-${g}"></div></details>`;
  CHANGE.forEach(s=>$(`ch-${g}`).append(fader(g,s)));
  $(`tg-${g}`).append(toggle(g,'toy','音高を五音に丸める'));
  FX.forEach(s=>$(`fx-${g}`).append(fader(g,s)));
  $(`lv-${g}`).append(fader(g,LEVEL,{tall:1}));
  $(`pan-${g}`).append(slider(g,PAN));$(`wd-${g}`).append(slider(g,TWIDTH));
  $(`ms-${g}`).append(toggle(g,'mute','ミュート'),toggle(g,'solo','ソロ'));
  DETAIL.forEach(s=>$(`dt-${g}`).append(slider(g,s)));
  el.querySelector('[data-act="dice"]').onclick=()=>dice(g);
  el.querySelector('[data-act="reset"]').onclick=()=>{for(const k in DEF[g])if(k!=='mute'&&k!=='solo')setParam(g,k,DEF[g][k]);msg(`トラック ${g.toUpperCase()} を元の音に戻しました。`)};
  const wave=$(`wave-${g}`),drop=wave.querySelector('.drop');
  ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();drop.hidden=false}));
  ['dragleave','drop'].forEach(ev=>el.addEventListener(ev,e=>{if(ev==='dragleave'&&el.contains(e.relatedTarget))return;e.preventDefault();drop.hidden=true}));
  el.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadFile(f,g)});
  // click or drag on the waveform: play from there
  const seek=e=>{const r=wave.getBoundingClientRect();const pos=clamp((e.clientX-r.left)/r.width,0,0.9999);send({t:'seek',track:g==='a'?0:1,pos});STATUS[g==='a'?'pa_h':'pb_h']=pos;drawWave(g)};
  wave.addEventListener('pointerdown',e=>{if(!SRC[g]){pickFile(g);return}wave.setPointerCapture(e.pointerId);seek(e)});
  wave.addEventListener('pointermove',e=>{if(wave.hasPointerCapture(e.pointerId))seek(e)});
  renderSrc(g);
}
function buildMorph(){
  const el=$('morph');
  el.innerHTML=`<div class="sh"><span class="badge">合</span><h2><small>morph · A × B</small>合体</h2></div>
    <div class="sec"><h3>混ぜ方</h3><div class="modes" id="modes"></div><p class="modedesc" id="modedesc"></p></div>
    <div class="sec"><h3>モーフ</h3><div class="xf" id="xf" role="slider" tabindex="0" aria-label="A と B のモーフ"><div class="ends"><b>A</b><b>B</b></div><div class="cap" id="xfcap"></div><div class="live" id="xflive"></div></div>

  const at=e=>{const r=xf.getBoundingClientRect();return clamp((e.clientX-r.left-13)/(r.width-26),0,1)};

  xf.addEventListener('pointermove',e=>{if(xf.hasPointerCapture(e.pointerId))setParam('m','amount',at(e))});
  xf.addEventListener('dblclick',()=>setParam('m','amount',0.5));
  xf.addEventListener('keydown',e=>{const st=e.shiftKey?0.1:0.01;let v=ST.m.amount;if(e.key==='ArrowRight'||e.key==='ArrowUp')v+=st;else if(e.key==='ArrowLeft'||e.key==='ArrowDown')v-=st;else return;e.preventDefault();setParam('m','amount',clamp(v,0,1))});
  reg('m.amount',draw);draw(ST.m.amount);
  $('xflive').style.left=`calc(13px + ${ST.m.amount}*(100% - 26px))`;STATUS.m=ST.m.amount;
  CTL.get('m.mode').forEach(f=>f(ST.m.mode));CTL.get('m.freeze').forEach(f=>f(ST.m.freeze));
  updateModeDesc();
}

function applyScene(sc){

function dice(g){
  const r=Math.random,pick=a=>a[Math.floor(r()*a.length)];
  const v={speed:pick([1,1,1,0.75,0.5,1.5,-1]),stretch:r()<0.4?r()*0.8:0,grain:r()<0.6?r()*0.7:0,pitch:pick([-12,-7,-5,0,0,0,5,7,12]),pspray:r()<0.4?r()*5:0,
    rev:r()<0.4?r()*0.6:0,toy:r()<0.25?1:0,tone:r()<0.5?0:(r()*2-1)*0.6,drive:r()<0.3?r()*0.4:0,crush:r()<0.25?r()*0.4:0,wow:r()<0.35?r()*0.6:0,comb:r()<0.25?r()*0.6:0,

// ---------- sources ----------
const SRC={a:null,b:null};let pendingTrack='a';
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function normalise(chs,peak){let mx=0;for(const c of chs)for(let i=0;i<c.length;i++){const v=Math.abs(c[i]);if(v>mx)mx=v}const g=mx>0?peak/mx:1;for(const c of chs)for(let i=0;i<c.length;i++)c[i]*=g;return chs}
const TESTS={
  rain:{n:'雨',f(sr){const sec=10,n=Math.floor(sr*sec),L=new Float32Array(n),R=new Float32Array(n),r=rng(23);let a=0,b=0;for(let i=0;i<n;i++){a+=((r()*2-1)-a)*0.05;b+=((r()*2-1)-b)*0.05;L[i]=a*0.35;R[i]=b*0.35}
    for(let k=0;k<90;k++){const t=r()*sec,f=1800+r()*2600,p=r()*2-1,s=Math.floor(t*sr);for(let i=0;i<sr*0.06&&s+i<n;i++){const x=i/sr,v=Math.sin(2*Math.PI*f*x*(1-x*4))*Math.exp(-x*70)*0.25;L[s+i]+=v*(1-p);R[s+i]+=v*(1+p)}}
    return normalise([L,R],0.8)}},
  pad:{n:'和音',f(sr){const sec=10,n=Math.floor(sr*sec),L=new Float32Array(n),R=new Float32Array(n),fs=[146.83,220,277.18,329.63,440,554.37];
    for(let i=0;i<n;i++){const t=i/sr;let v=0,w=0;fs.forEach((f,k)=>{const a=(0.6+0.4*Math.sin(2*Math.PI*(0.07+k*0.031)*t+k))/(1+k*0.4);v+=Math.sin(2*Math.PI*f*t)*a;w+=Math.sin(2*Math.PI*f*1.003*t+k)*a});const e=Math.min(1,t/1.5,(sec-t)/1.5);L[i]=v*e;R[i]=w*e}
    return normalise([L,R],0.8)}},
  piano:{n:'ピアノ',f(sr){const sec=10,n=Math.floor(sr*sec),L=new Float32Array(n),R=new Float32Array(n),r=rng(11);
    const note=(t0,m,vel,pan,len)=>{const f=mtof(m),s=Math.floor(t0*sr),e=Math.min(n,s+Math.floor(len*sr)),hs=[1,2,3,4].map(h=>2*Math.PI*f*h*Math.sqrt(1+0.0004*h*h)/sr);
      for(let i=s;i<e;i++){const k=i-s,x=k/sr;let v=0;for(let h=0;h<4;h++)v+=Math.sin(hs[h]*k)*Math.exp(-x*(1.1+h*1.1))/(h+1);v*=Math.min(1,x*300)*vel;L[i]+=v*(1-pan);R[i]+=v*(1+pan)}};
    [[50,57,62,64,69],[46,53,57,62,65],[43,50,57,58,62],[45,52,57,61,64]].forEach((c,k)=>c.forEach((m,j)=>note(k*2.5+j*0.035+r()*0.01,m,0.32-j*0.03,(j/(c.length-1)-0.5)*0.6,2.6)));
    [[0.6,74],[1.4,76],[3.1,77],[3.9,74],[5.6,72],[6.3,69],[8.1,73],[8.8,76]].forEach(([t,m],k)=>note(t+r()*0.04,m,0.26,k%2?0.4:-0.4,2.2));
    return normalise([L,R],0.8)}},
};
function renderSrc(g){
  const s=SRC[g];
  $(`src-${g}`).innerHTML=`<button class="chipb" data-a="file">ファイルを選ぶ…</button>`+Object.entries(TESTS).map(([k,t])=>`<button class="chipb" data-a="test" data-k="${k}" aria-pressed="${!!s&&s.test===k}">試し音: ${t.n}</button>`).join('')+
    (s?`<button class="chipb" data-a="clear">外す</button><span class="fname">${esc(s.name)}・${(s.frames/(ctx?ctx.sampleRate:48000)).toFixed(1)} 秒</span>`:'');
  $(`src-${g}`).querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='file')pickFile(g);else if(b.dataset.a==='clear')setSource(g,null);else loadTest(g,b.dataset.k);
  });
}
function pickFile(g){pendingTrack=g;$('file').value='';$('file').click()}
function setSource(g,s){
  SRC[g]=s;peaksCache.delete(g);renderSrc(g);
  send({t:'buf',track:g==='a'?0:1,frames:s?s.frames:0,data:s?s.data:[]});
  drawWaves(true);
}
async function loadTest(g,k){await ensureAudio(false);const t=TESTS[k];setSource(g,{name:'試し音: '+t.n,test:k,frames:Math.floor(ctx.sampleRate*10),data:t.f(ctx.sampleRate)})}
async function loadFile(file,g){
  try{
    await ensureAudio(false);
    const ab=await file.arrayBuffer();
    const audio=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});
    const data=[];for(let c=0;c<Math.min(2,audio.numberOfChannels);c++)data.push(audio.getChannelData(c).slice(0));
    setSource(g,{name:file.name,frames:audio.length,data});
    msg(`トラック ${g.toUpperCase()} に「${file.name}」を入れました。`);
  }catch(e){msg(`「${file.name}」を読み込めませんでした。WAV / AIFF / MP3 など、ブラウザが再生できる形式を選んでください。`)}
}

// ---------- audio ----------
let ctx=null,node=null,eng=null,outGain=null,analyser=null,playing=false;
const WSRC=`const MEBUKI_DSP=${MEBUKI_DSP.toString()};
const DSP=MEBUKI_DSP();
class MebukiProc extends AudioWorkletProcessor{
  constructor(){super();this.e=new DSP.Engine(sampleRate);this.n=0;this.port.onmessage=ev=>this.e.handle(ev.data)}
  process(ins,outs){const o=outs[0];this.e.render(o[0],o[1]||o[0],o[0].length);if(++this.n%6===0)this.port.postMessage(this.e.status());return true}
}
registerProcessor('mebuki',MebukiProc);`;
const STATUS={ga:[],gb:[],pa_h:0,pb_h:0,gma:0,gmb:0,m:0.5,pa:0,pb:0,pm:0};
function send(m){if(node)node.port.postMessage(m);else if(eng)eng.handle(m)}
async function ensureAudio(){
  if(ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
  outGain=ctx.createGain();outGain.connect(ctx.destination);
  analyser=ctx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0.75;outGain.connect(analyser);
  try{
    if(!ctx.audioWorklet||!window.AudioWorkletNode)throw new Error('no worklet');
    const url=URL.createObjectURL(new Blob([WSRC],{type:'application/javascript'}));
    await Promise.race([ctx.audioWorklet.addModule(url),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),5000))]);
    node=new AudioWorkletNode(ctx,'mebuki',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
    node.port.onmessage=e=>Object.assign(STATUS,e.data);node.connect(outGain);
  }catch(err){
    node=null;eng=new DSP.Engine(ctx.sampleRate);let k=0;
    const sp=ctx.createScriptProcessor(1024,0,2);
    sp.onaudioprocess=e=>{const ob=e.outputBuffer;eng.render(ob.getChannelData(0),ob.getChannelData(1),ob.length);if(++k%2===0)Object.assign(STATUS,eng.status())};
    sp.connect(outGain);
  }
  for(const g in ST)for(const k in ST[g])send({t:'p',k:`${g}.${k}`,v:ST[g][k]});
  for(const g of ['a','b'])if(SRC[g])send({t:'buf',track:g==='a'?0:1,frames:SRC[g].frames,data:SRC[g].data});
}
async function togglePlay(){
  await ensureAudio();if(ctx.state==='suspended')await ctx.resume();
  playing=!playing;send({t:'run',v:playing});
  $('play').setAttribute('aria-pressed',playing);$('playlabel').textContent=playing?'■ 停止':'▶ 再生';
  if(playing&&!SRC.a&&!SRC.b)msg('音源が空です。A か B にファイルを入れるか、試し音を選んでください。');
  if(playing)loop();
}

// ---------- recording ----------
let rec=null,recDest=null,recChunks=[],recStart=0,recTick=0;
let DL=null,DLP=null;
if(window.claude&&typeof window.claude.use==='function'){DLP=window.claude.use('downloads').then(x=>{DL=x;return x}).catch(()=>null)}
async function saveBlob(blob,name){
  const dl=DL||(DLP?await DLP:null);
  if(dl){try{await dl.save({filename:name,data:blob});msg(`「${name}」を保存しました。`)}catch(e){const c=e&&e.code;msg(c==='declined'?'保存を取りやめました。':c==='rate_limited'?'保存の確認が開いています。少し待ってからもう一度。':'この表示ではファイルを保存できません。')}return}
  if(DLP){msg('この表示ではファイルを保存できません。');return}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  msg(`「${name}」を書き出しました。`);
}
async function toggleRec(){
  await ensureAudio();
  if(rec){rec.stop();return}
  if(!window.MediaRecorder||!ctx.createMediaStreamDestination){msg('このブラウザは録音に対応していません。');return}
  const t=[['audio/webm;codecs=opus','webm'],['audio/webm','webm'],['audio/mp4','mp4']].find(([m])=>MediaRecorder.isTypeSupported(m));
  if(!t){msg('このブラウザで使える録音形式がありません。');return}
  if(!recDest){recDest=ctx.createMediaStreamDestination();outGain.connect(recDest)}
  rec=new MediaRecorder(recDest.stream,{mimeType:t[0]});recChunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
  rec.onstop=()=>{
    const blob=new Blob(recChunks,{type:t[0]});rec=null;clearInterval(recTick);
    $('rec').setAttribute('aria-pressed','false');$('reclabel').textContent='録音';$('rectime').textContent='';
    const d=new Date(),p=n=>String(n).padStart(2,'0');
    if(blob.size)saveBlob(blob,`mebuki-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${t[1]}`);
  };
  rec.start(1000);recStart=Date.now();
  $('rec').setAttribute('aria-pressed','true');$('reclabel').textContent='録音を止めて保存';
  recTick=setInterval(()=>{const s=Math.floor((Date.now()-recStart)/1000);$('rectime').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500);
  if(!playing)togglePlay();
}

// ---------- drawing ----------
const peaksCache=new Map();
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function fit(cv,h){const d=window.devicePixelRatio||1,W=Math.max(10,Math.round(cv.clientWidth*d)),H=Math.round(h*d);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}return d}
function peaksOf(g,cols){
  const s=SRC[g];if(!s)return null;let p=peaksCache.get(g);if(p&&p.cols===cols)return p;
  const d=s.data[0],n=s.frames,mn=new Float32Array(cols),mx=new Float32Array(cols);
  for(let j=0;j<cols;j++){let a=1,b=-1;const st=Math.floor(j*n/cols),en=Math.max(st+1,Math.floor((j+1)*n/cols)),step=Math.max(1,Math.floor((en-st)/160));for(let i=st;i<en;i+=step){const v=d[i];if(v<a)a=v;if(v>b)b=v}mn[j]=a;mx[j]=b}
  p={cols,mn,mx};peaksCache.set(g,p);return p;
}
function drawWave(g){
  const cv=$(`cv-${g}`);if(!cv)return;const d=fit(cv,110),W=cv.width,H=cv.height,x=cv.getContext('2d');
  const col=css(g==='a'?'--a':'--b'),faint=css('--faint'),ink=css('--ink');
  x.clearRect(0,0,W,H);
  const p=peaksOf(g,W);
  if(!p){x.fillStyle=faint;x.font=`${13*d}px ${css('--f-body')}`;x.textAlign='center';x.textBaseline='middle';x.fillText('ここに音声ファイルをドロップ／押して選ぶ',W/2,H/2);return}
  const ph=g==='a'?STATUS.pa_h:STATUS.pb_h,px=ph*W;
  // played part a little darker
  for(let j=0;j<W;j++){const a=H/2-p.mx[j]*H*0.44,b=H/2-p.mn[j]*H*0.44;x.globalAlpha=j<px?0.75:0.4;x.fillStyle=ink;x.fillRect(j,a,1,Math.max(1,b-a))}
  x.globalAlpha=1;x.fillStyle=col;x.fillRect(px-d,0,2*d,H);
  x.beginPath();x.moveTo(px-5*d,0);x.lineTo(px+5*d,0);x.lineTo(px,7*d);x.fill();
  const gr=g==='a'?STATUS.ga:STATUS.gb;
  for(let i=0;i<gr.length;i+=2){const gx=gr[i]*W,age=gr[i+1],e=Math.sin(Math.PI*Math.min(1,age));x.globalAlpha=0.25+0.75*e;x.beginPath();x.arc(gx,H*(0.14+0.72*age),(2+2.5*e)*d,0,Math.PI*2);x.fill()}
  x.globalAlpha=1;
}
function drawSpec(){
  const cv=$('spec');if(!cv)return;const d=fit(cv,96),W=cv.width,H=cv.height,x=cv.getContext('2d');x.clearRect(0,0,W,H);
  if(!analyser)return;const bins=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(bins);
  const a=css('--a'),b=css('--b'),n=64,sr=ctx.sampleRate,m=STATUS.m;
  const grad=x.createLinearGradient(0,0,W,0);grad.addColorStop(0,a);grad.addColorStop(1,b);x.fillStyle=grad;
  for(let i=0;i<n;i++){
    const f0=40*Math.pow(18000/40,i/n),f1=40*Math.pow(18000/40,(i+1)/n),k0=Math.floor(f0/(sr/2)*bins.length),k1=Math.max(k0+1,Math.floor(f1/(sr/2)*bins.length));
    let v=0;for(let k=k0;k<k1&&k<bins.length;k++)v=Math.max(v,bins[k]);
    const h=v/255*H,w=W/n;x.globalAlpha=0.35+0.65*(m*i/n+(1-m)*(1-i/n));x.fillRect(i*w+1,H-h,w-2,h);
  }
  x.globalAlpha=1;
}
function drawWaves(){drawWave('a');drawWave('b')}
let raf=0;
function loop(){
  cancelAnimationFrame(raf);
  const step=()=>{
    drawWaves();drawSpec();
    const m=v=>clamp(Math.sqrt(v)*100,0,100)+'%';
    $('mt-a').style.height=m(STATUS.pa);$('mt-b').style.height=m(STATUS.pb);$('mt-x').style.height=m(STATUS.pm);
    $('xflive').style.left=`calc(13px + ${STATUS.m}*(100% - 26px))`;
    for(const g of ['a','b']){const gm=g==='a'?STATUS.gma:STATUS.gmb,el=$(`mix-${g}`);if(el)el.textContent=SRC[g]?`いま 元の音 ${Math.round(Math.cos(gm*Math.PI/2)**2*100)}% ／ 粒 ${Math.round(Math.sin(gm*Math.PI/2)**2*100)}%`:''}$('xfnow').textContent=`いま A ${Math.round((1-STATUS.m)*100)} : B ${Math.round(STATUS.m*100)}`;
    if(playing||STATUS.pm>0.001)raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}
function msg(t){$('msg').textContent=t}

// ---------- boot ----------
buildTrack('a');buildTrack('b');buildMorph();buildMaster();
$('scenes').insertAdjacentHTML('beforeend',SCENES.map((s,i)=>`<button class="chipb" data-i="${i}" title="${esc(s.d)}">${esc(s.n)}</button>`).join(''));
$('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>applyScene(SCENES[+b.dataset.i]));
$('play').onclick=togglePlay;$('rec').onclick=toggleRec;
$('file').onchange=()=>{const f=$('file').files[0];if(f)loadFile(f,pendingTrack)};
window.addEventListener('resize',()=>{drawWaves();drawSpec()});
drawWaves();

</script>

</body></html>
