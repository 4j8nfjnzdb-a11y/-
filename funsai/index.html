<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d0b" />
<title>粉砕 FUNSAI — beat destruction unit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0a'/%3E%3Cg fill='%23e9d64a'%3E%3Crect x='3' y='13' width='3' height='6'/%3E%3Crect x='8' y='7' width='3' height='18'/%3E%3Crect x='13' y='16' width='3' height='3'/%3E%3Crect x='18' y='4' width='3' height='24'/%3E%3Crect x='23' y='11' width='3' height='10'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="top">
    <h1>粉砕<span class="rom">FUNSAI</span></h1>
    <div class="modeSwitch" id="modeSwitch">
      <button class="mode on" data-mode="mono">一本<em>MONO</em></button>
      <button class="mode" data-mode="kit">四本<em>KIT</em></button>
    </div>
  </header>

  <section class="transport">
    <button id="play" class="play">▶</button>
    <label class="num">
      <span>BPM</span>
      <input id="bpm" type="range" min="60" max="260" step="1" value="174" />
      <b id="bpmv">174</b>
    </label>
    <label class="num">
      <span>揺れ<em>SWING</em></span>
      <input id="swing" type="range" min="0" max="100" step="1" value="0" />
      <b id="swingv">0</b>
    </label>
    <button id="rec" class="ghost">●録音</button>
    <button id="panic" class="ghost">全解除</button>
  </section>

  <section class="source">
    <label class="sel"><span>音源</span><select id="kitSel"></select></label>
    <label class="sel"><span>型</span><select id="patSel"></select></label>
    <button id="dice" class="ghost">賽</button>
    <button id="resync" class="ghost">整列</button>
    <label class="fileBtn">
      <span id="loadLabel">読込</span>
      <input id="file" type="file" accept="audio/*" />
    </label>
  </section>

  <section class="seq" id="seqMono">
    <div class="seqHead">
      <span class="seqTitle">切片列<em>SLICES</em></span>
      <span class="hint">叩く＝順/逆/無　上下に擦る＝切片番号</span>
      <label class="chk"><input type="checkbox" id="fit" checked /> 尺合<em>FIT</em></label>
      <label class="sel tiny"><span>長</span><select id="monoLen"></select></label>
    </div>
    <div class="slices" id="slices"></div>
  </section>

  <section class="seq" id="seqKit" hidden>
    <div class="seqHead">
      <span class="seqTitle">格子<em>GRID</em></span>
      <span class="hint">叩く＝強/弱/無　長＝歩数　速＝分解能</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <canvas id="scope" class="scope"></canvas>

  <section class="targets" id="targets"></section>

  <section class="pads" id="pads"></section>

  <footer class="foot">
    <button id="latch" class="ghost">保持<em>LATCH</em></button>
    <button id="xyhold" class="ghost">XY記憶</button>
    <label class="num auto">
      <button id="auto" class="ghost">自動破壊</button>
      <input id="autoAmt" type="range" min="0" max="100" step="1" value="35" />
    </label>
    <label class="num">
      <span>音量</span>
      <input id="vol" type="range" min="0" max="100" step="1" value="85" />
    </label>
  </footer>

  <p class="keys">鍵盤: <code>1234 / qwer / asdf / zxcv</code> ＝ 16パッド（押しっぱなし）　<code>space</code> ＝ 再生　<code>0</code> ＝ 全解除</p>

</div>

<div id="splash" class="splash">
  <div class="splashInner">
    <h2>粉砕</h2>
    <p>ブレイクを刻んで、凍らせて、変拍子で踏み潰す装置。</p>
    <p class="small">パッドは押している間だけ効く。押した<b>位置</b>がそのままパラメータになる。</p>
    <button id="start">起動</button>
  </div>
</div>

<script src="engine.js"></script>
<script src="kits.js"></script>
<script src="app.js"></script>
</body>
</html>
